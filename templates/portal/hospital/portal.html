      f.draft.commonOtherOn = !f.draft.commonOtherOn;
      if (!f.draft.commonOtherOn) f.draft.commonOther = '';
      this.renderFlowView();
      const box = document.getElementById('txCommonOther');
      if (box && f.draft.commonOtherOn) box.focus();
      return;
    }
    if (act === 'tx-test') { f.draft.infectious[k] = i; this.renderFlowView(); return; }
    if (act === 'tx-skin') {
      f.draft.skinMucosa = f.draft.skinMucosa === k ? '' : k;
      if (f.draft.skinMucosa !== '其他') f.draft.skinOther = '';
      this.renderFlowView();
      const box = document.getElementById('txSkinOther');
      if (box && f.draft.skinMucosa === '其他') box.focus();
      return;
    }
    if (act === 'tx-item-toggle') { f.open[k] = !f.open[k]; this.refreshItemCard(k); return; }
    if (act === 'tx-date-quick') {
      const item = f.draft.items[k];
      if (item) item.plannedDate = this.addDays(i);
      this.refreshItemCard(k);
      return;
    }
    if (act === 'tx-advice-tpl') {
      const t = (((f.detail || {}).options || {}).advice_templates || [])[Number(k)];
      if (t) f.draft.advice = f.draft.advice ? (f.draft.advice.replace(/\s*$/, '') + '\n' + t) : t;
      this.renderFlowView();
      return;
    }
    if (act === 'tx-note-tpl') {
      const meta = this.txItemMeta(k) || {};
      const t = (meta.note_tpl || [])[Number(i)];
      const item = f.draft.items[k];
      if (item && t) item.notes = item.notes ? (item.notes.replace(/\s*$/, '') + '；' + t) : t;
      this.refreshItemCard(k);
      return;
    }
    if (act === 'tx-rx-del') {
      const item = f.draft.items[k];
      if (item) item.rx.splice(Number(i), 1);
      this.refreshItemCard(k);
      return;
    }
    if (act === 'tx-med-open') { this.openMedPicker(k); return; }
    if (act === 'tx-chip-open') { this.openChipPicker(k); return; }
    if (act === 'tx-check-save') { this.saveTreatmentCheck(true); return; }
    if (act === 'tx-check-submit') { this.saveTreatmentCheck(false); return; }
    if (act === 'tx-plan-save') { this.saveTreatmentPlan(false); return; }
    if (act === 'tx-diagnose') { this.diagnoseTreatment(); return; }
    if (act === 'tx-undiagnose') { this.undiagnoseTreatment(); return; }
    if (act === 'tx-next3') {
      f.step = 3; f.maxStep = Math.max(f.maxStep, 3); this.renderFlowView(); return;
    }
    if (act === 'tx-exec') { this.executeTreatmentItem(k); return; }
    if (act === 'tx-undo') { this.undoTreatmentItem(k); return; }
    if (act === 'tx-treat-done') { this.markTreatmentDone(); return; }
    if (act === 'tx-disposal') { f.draft.disposal = k; this.renderFlowView(); return; }
    if (act === 'tx-photo') { this.txUploadPhoto(); return; }
    if (act === 'tx-finish') { this.finishTreatment(); return; }
  },

  /* 诊疗后照片上传（B2）：弹层选文件 + 预览（与领养页 uploadPhoto 同款交互），
     但走诊疗单独立接口 —— 落 Pet.photo_treatment 且**不碰**领养展示位。
     成功后用服务端返回的整份 detail 重建流程、停在当前步骤，
     照片 url 回显靠 detail.pet.photo_treatment。 */
  txUploadPhoto() {
    const f = this.state.treatmentFlow;
    if (!f || (f.detail || {}).is_disposed) return;
    TNR_UI.modal({
      title: '上传诊疗后照片',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="form-group"><label class="form-label">选择图片文件</label>'
          + '<input type="file" accept="image/*" id="txPhotoInput" class="form-input" style="padding:4px;" /></div>'
          + '<div id="txPhotoPreview" style="margin-top:var(--sp-3);"></div>'
          + '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);">'
          + '<button class="btn btn-secondary" data-close>取消</button>'
          + '<button class="btn btn-primary" id="txPhotoUploadBtn">上传</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#txPhotoInput').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            bodyEl.querySelector('#txPhotoPreview').innerHTML =
              '<img src="' + ev.target.result + '" style="width:100%;border-radius:var(--r-md);" />';
          };
          reader.readAsDataURL(file);
        });
        bodyEl.querySelector('#txPhotoUploadBtn').onclick = async () => {
          const file = bodyEl.querySelector('#txPhotoInput').files[0];
          if (!file) { TNR_UI.toast('请选择图片文件', 'warning'); return; }
          try {
            const res = await TNR_API.uploadTreatmentPhoto(f.detail.id, file);
            TNR_UI.assertOk(res, '照片上传失败');
            closeFn();
            this.startTreatmentFlow(res.data, f.step);
            TNR_UI.toast('诊疗后照片已保存', 'success');
          } catch (e) {
            TNR_UI.toast(e.message || '上传失败', 'danger');
          }
        };
      }
    });
  },

  onTreatmentInput(target) {
    const f = this.state.treatmentFlow;
    if (!f || !target || !target.dataset) return;
    const d = target.dataset;
    if (d.inp) {
      f.draft[d.inp] = target.value;
      // 传染病快检项**按物种**下发，改了种类必须重渲染，否则「猫的 FPV」
      // 会跟着狗的检查单一起提交，被服务端 400 拒绝。
      if (d.inp === 'species') this.renderFlowView();
      // 体温手改后自动刷新判定：点 chip 会自动填数值，但反过来「手改数值」
      // 原本不联动判定 —— 测出 40.2℃ 判定却停在「正常」，会被服务端的
      // 交叉校验 400 打回。阈值从 `check_options()` 下发，与服务端
      // `fever_judge()` 同一条线，前端不另抄一份。
      if (d.inp === 'temperature') this.syncTempFlag(target.value);
      return;
    }
    if (d.plan) {
      const item = f.draft.items[d.plan];
      if (!item) return;
      item[d.f] = target.value;
      this.refreshItemState(d.plan);
    }
  },

  /* 体温数值 → 判定 chip 的实时同步（≥ 阈值判发烧，阈值由 check_options 下发）。
     只直接 toggle chip 的 class，**不整块重渲染** —— renderFlowView 会让
     输入框失焦，用户一次只能输一个字符。清空 / 输入到一半（非数字）时
     不动判定：草稿判定保留，提交前的必填校验与服务端交叉校验兜底。 */
  syncTempFlag(raw) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const th = ((f.detail || {}).options || {}).fever_threshold;
    if (th === undefined || th === null) return;
    const v = parseFloat(raw);
    if (String(raw).trim() === '' || isNaN(v)) return;
    const flag = v >= Number(th) ? 'fever' : 'normal';
    f.draft.temperatureFlag = flag;
    document.querySelectorAll('#page-treatment [data-act="tx-temp"]').forEach(ch => {
      const on = ch.dataset.v === flag;
      ch.classList.toggle('active', on);
      ch.classList.toggle('ok', on && flag === 'normal');
      ch.classList.toggle('warn', on && flag === 'fever');
    });
  },

  addDays(n) {
    const d = new Date();
    d.setDate(d.getDate() + Number(n || 0));
    const p = (x) => String(x).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  },

  /* ==================== 写操作 ==================== */
  txCheckPayload() {
    const d = this.state.treatmentFlow.draft;
    // `temperature` 一律显式传（空串 = 清空）。不传的话「用户把体温删了」
    // 会保留旧值，而服务端「提交必须填体温」的校验会拿旧值放行 —— 界面空白、
    // 单据却有体温，且不报错。
    return {
      species: d.species, gender: d.gender, breed: d.breed,
      color: d.color, weight: d.weight,
      temperature: String(d.temperature).trim() === '' ? null : d.temperature,
      temperature_flag: d.temperatureFlag,
      common_findings: d.commonFindings,
      common_other: d.commonOther,
      infectious_tests: d.infectious,
      skin_mucosa: d.skinMucosa,
      skin_other: d.skinOther,
      check_note: d.checkNote
    };
  },

  async saveTreatmentCheck(isDraft) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const d = f.draft;
    if (!isDraft) {
      if (String(d.temperature).trim() === '') {
        TNR_UI.toast('请先完成「体温检测」再提交', 'warning'); return;
      }
      if (!d.temperatureFlag) {
        TNR_UI.toast('请选择体温判定（正常 / 发烧）再提交', 'warning'); return;
      }
    }
    try {
      const payload = this.txCheckPayload();
      payload.draft = !!isDraft;
      const res = await TNR_API.treatmentCheck(f.detail.id, payload);
      TNR_UI.assertOk(res, '检查单保存失败');
      // 暂存停在原步骤（提交才前进），否则「点了暂存却被弹到第二步」。
      this.startTreatmentFlow(res.data, isDraft ? f.step : 2);
      TNR_UI.toast(isDraft ? '检查单已暂存' : '检查单已提交，进入医嘱与处方', 'success');
    } catch (e) {
      TNR_UI.toast(e.message || '保存失败', 'danger');
    }
  },

  /* 与后端 `_replace_items()` **同口径**的前端预检。
     前端漏拦不会造成脏数据（服务端也会拒），但用户会看到一句与自己操作
     对不上的报错；这里提前拦并把出问题的项目自动展开。 */
  txPlanProblem() {
    const f = this.state.treatmentFlow;
    const keys = Object.keys(f.draft.items);
    for (let idx = 0; idx < keys.length; idx++) {
      const k = keys[idx];
      const meta = this.txItemMeta(k) || {};
      const item = f.draft.items[k];
      if (meta.needs_chip && item.plannedDate && !String(item.chipNo).trim()) {
        f.open[k] = true;
        this.renderFlowView();
        return (meta.name || k) + '：填写了预计执行时间就必须填芯片号';
      }
      if (this.txItemState(k).half) {
        f.open[k] = true;
        this.renderFlowView();
        return (meta.name || k) + '：已选处方但未填预计执行时间，请补上';
      }
    }
    return '';
  },

  txPlanPayload() {
    const f = this.state.treatmentFlow;
    const items = Object.keys(f.draft.items).map(k => {
      const it = f.draft.items[k];
      return {
        key: k,
        planned_date: it.plannedDate || '',
        chip_no: it.chipNo || '',
        notes: it.notes || '',
        rx_other: it.rxOther || '',
        rx: it.rx.slice()
      };
    });
    return { advice: f.draft.advice || '', items: items };
  },

  async saveTreatmentPlan(advance) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const bad = this.txPlanProblem();
    if (bad) { TNR_UI.toast(bad, 'warning'); return; }
    try {
      const res = await TNR_API.treatmentPlan(f.detail.id, this.txPlanPayload());
      TNR_UI.assertOk(res, '医嘱与处方保存失败');
      this.startTreatmentFlow(res.data, advance ? 3 : f.step);
      TNR_UI.toast('医嘱与处方已暂存', 'success');
    } catch (e) {
      TNR_UI.toast(e.message || '保存失败', 'danger');
    }
  },

  async diagnoseTreatment() {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const bad = this.txPlanProblem();
    if (bad) { TNR_UI.toast(bad, 'warning'); return; }
    if (!String(f.draft.advice).trim() && !this.txMustItems().length) {
      TNR_UI.toast('请至少填写医嘱，或为某个处置项目填写时间与处方', 'warning'); return;
    }
    try {
      const saveRes = await TNR_API.treatmentPlan(f.detail.id, this.txPlanPayload());
      TNR_UI.assertOk(saveRes, '医嘱与处方保存失败');
      const res = await TNR_API.treatmentDiagnose(f.detail.id);
      TNR_UI.assertOk(res, '诊断完成失败');
      this.startTreatmentFlow(res.data, 3);
      TNR_UI.toast('诊断完成，进入执行阶段', 'success');
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async undiagnoseTreatment() {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const ok = await TNR_UI.confirm('撤回诊断后可以继续修改医嘱与处方，确定撤回吗？', '撤回诊断');
    if (!ok) return;
    try {
      const res = await TNR_API.treatmentUndiagnose(f.detail.id);
      TNR_UI.assertOk(res, '撤回诊断失败');
      this.startTreatmentFlow(res.data, 2);
      TNR_UI.toast('已撤回诊断，可继续修改医嘱与处方', 'warning');
    } catch (e) {
      TNR_UI.toast(e.message || '撤回失败', 'danger');
    }
  },

  async executeTreatmentItem(itemId) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    if (!itemId) { TNR_UI.toast('请先保存医嘱与处方，再执行项目', 'warning'); return; }
    try {
      const res = await TNR_API.treatmentExecuteItem(f.detail.id, itemId);
      TNR_UI.assertOk(res, '执行失败');
      this.startTreatmentFlow(res.data, 3);
      TNR_UI.toast(res.message || '已执行完成，库存已扣减', 'success');
    } catch (e) {
      TNR_UI.toast(e.message || '执行失败', 'danger');
    }
  },

  async undoTreatmentItem(itemId) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const ok = await TNR_UI.confirm('撤销后该项的库存会退回、芯片会退回「可用」，确定撤销吗？', '撤销执行');
    if (!ok) return;
    try {
      const res = await TNR_API.treatmentUndoItem(f.detail.id, itemId);
      TNR_UI.assertOk(res, '撤销失败');
      this.startTreatmentFlow(res.data, 3);
      TNR_UI.toast(res.message || '已撤销执行', 'warning');
    } catch (e) {
      TNR_UI.toast(e.message || '撤销失败', 'danger');
    }
  },

  async markTreatmentDone() {
    const f = this.state.treatmentFlow;
    if (!f) return;
    try {
      const res = await TNR_API.treatmentDone(f.detail.id);
      TNR_UI.assertOk(res, '诊疗完成失败');
      this.startTreatmentFlow(res.data, 3);
      TNR_UI.toast('诊疗完成，请在下方选择办结去向', 'success');
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async finishTreatment() {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const disposal = f.draft.disposal;
    if (!disposal) { TNR_UI.toast('请先选择办结去向', 'warning'); return; }
    try {
      const res = await TNR_API.treatmentDispose(f.detail.id, disposal);
      TNR_UI.assertOk(res, '办结失败');
      TNR_UI.toast('已办结，动物状态已更新', 'success');
      this.state.treatmentFlow = null;
      this.state.treatmentFilter = 'done';
      this.renderTreatmentFlow();
    } catch (e) {
      TNR_UI.toast(e.message || '办结失败', 'danger');
    }
  },

  /* ==================== 药品弹层 ====================
     处方药品走**现有物料体系**（`Material` 的「药品 / 疫苗 / 驱虫药」三类），
     不新建独立药品字典 —— 与后端 `services_treatment.RX_CATEGORIES` 同口径。
     类别常量在这里再写一份是**故意**的：它是「前端筛选口径」而不是业务真源，
     真源仍是后端 `_replace_items()` 的校验（类别不对会被 400 拒绝）。 */
  openMedPicker(key) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const item = f.draft.items[key];
    if (!item) return;
    const RX_CATS = ['medicine', 'vaccine', 'dewormer'];
    const CATS = [['all', '全部'], ['medicine', '药品'], ['vaccine', '疫苗'], ['dewormer', '驱虫药']];
    let group = 'all';
    let kw = '';

    TNR_UI.modal({
      title: '从库存药品中选择',
      size: 'lg',
      body: (bodyEl) => {
        bodyEl.innerHTML = '<div class="form-group" style="margin-bottom:0;">'
          + '<input class="form-input" data-role="kw" placeholder="搜索药品名称 / 批号">'
          + '</div>'
          + '<div data-role="cats" style="display:flex;gap:var(--sp-2);flex-wrap:wrap;margin:var(--sp-3) 0;"></div>'
          + '<div data-role="rows"></div>';
        const rowsEl = bodyEl.querySelector('[data-role="rows"]');
        const catsEl = bodyEl.querySelector('[data-role="cats"]');
        const kwEl = bodyEl.querySelector('[data-role="kw"]');

        const renderRows = () => {
          const meds = (this._txMaterials || []).filter(m => {
            if (RX_CATS.indexOf(m.category) < 0) return false;
            if (group !== 'all' && m.category !== group) return false;
            if (!kw) return true;
            const hay = (String(m.name || '') + ' ' + String(m.batch_no || '')).toLowerCase();
            return hay.indexOf(kw) >= 0;
          });
          if (!meds.length) {
            rowsEl.innerHTML = '<div class="tx-empty">该条件下暂无可用药品</div>';
            return;
          }
          rowsEl.innerHTML = meds.map(m => {
            const on = item.rx.some(id => String(id) === String(m.id));
            const stock = Number(m.hospital_stock || 0);
            const out = stock <= 0;
            return '<div style="display:flex;align-items:center;gap:var(--sp-3);'
              + 'padding:10px 11px;border:1px solid ' + (on ? 'var(--bamboo-green)' : 'var(--border-light)')
              + ';border-radius:var(--r-lg);margin-bottom:8px;'
              + (on ? 'background:var(--bamboo-light);' : '') + (out ? 'opacity:.55;' : '') + '">'
              + '<div style="flex:1;min-width:0;">'
              + '<div style="font-size:var(--fs-md);font-weight:600;">' + this.escape(m.name)
              + (out ? ' <span class="badge badge-default">无库存</span>' : '') + '</div>'
              + '<div style="font-size:var(--fs-xs);color:var(--ink-light);margin-top:2px;">'
              + this.escape(m.specification || '') + ' · '
              + this.escape(TNR_API.getMaterialCategoryText(m.category))
              + (m.batch_no ? ' · 批号 ' + this.escape(m.batch_no) : '') + '</div></div>'
              + '<div style="flex:none;text-align:right;">'
              + '<div style="font-size:var(--fs-xs);color:var(--ink-muted);margin-bottom:3px;">本院库存 '
              + '<b class="' + (stock <= 3 ? 'text-danger' : '') + '">' + stock + '</b></div>'
              + (out ? '<button class="btn btn-sm btn-secondary" disabled>不可选</button>'
                     : '<button class="btn btn-sm ' + (on ? 'btn-success' : 'btn-outline')
                       + '" data-role="pick" data-v="' + m.id + '">'
                       + (on ? '✓ 已选' : '＋1 头份') + '</button>')
              + '</div></div>';
          }).join('');
          rowsEl.querySelectorAll('[data-role="pick"]').forEach(btn => {
            btn.addEventListener('click', () => {
              const mid = btn.dataset.v;
              const at = item.rx.findIndex(id => String(id) === String(mid));
              if (at >= 0) item.rx.splice(at, 1); else item.rx.push(mid);
              renderRows();
              this.refreshItemCard(key);
            });
          });
        };

        const renderCats = () => {
          catsEl.innerHTML = CATS.map(c => '<button class="btn btn-sm '
            + (group === c[0] ? 'btn-primary' : 'btn-secondary') + '" data-role="cat" data-v="'
            + c[0] + '">' + c[1] + '</button>').join('');
          catsEl.querySelectorAll('[data-role="cat"]').forEach(btn => {
            btn.addEventListener('click', () => { group = btn.dataset.v; renderCats(); renderRows(); });
          });
        };

        // 搜索框**不进重渲染区域**：整块重画会让输入框失焦、光标跳走。
        kwEl.addEventListener('input', () => {
          kw = String(kwEl.value || '').trim().toLowerCase();
          renderRows();
        });
        renderCats();
        renderRows();
      },
      actions: '<button class="btn btn-primary" data-action="close">完成</button>'
    });
  },

  /* ==================== 芯片选择弹层 ==================== */
  async openChipPicker(key) {
    const f = this.state.treatmentFlow;
    if (!f) return;
    const item = f.draft.items[key];
    if (!item) return;
    const meta = this.txItemMeta(key) || {};

    TNR_UI.modal({
      title: '选择可用芯片 · ' + this.escape(meta.name || ''),
      size: 'lg',
      body: async (bodyEl) => {
        bodyEl.innerHTML = '<div class="loading-state">加载可用芯片...</div>';
        let chips = [];
        try {
          // ⚠ `getData` 已经解包（返回 `data.data` 数组本身）—— 再取 `.data`
          // 恒为 undefined，会把「有芯片」渲染成「本院暂无可用芯片」。
          chips = await TNR_API.getAvailableChips(meta.materialId || null) || [];
        } catch (e) {
          bodyEl.innerHTML = '<div class="tx-empty">加载失败：' + this.escape(e.message || '') + '</div>';
          return;
        }
        if (!chips.length) {
          bodyEl.innerHTML = '<div class="tx-empty">本院暂无可用芯片。<br>请先确认芯片物料已采购/下发并签收。</div>';
          return;
        }
        const cur = String(item.chipNo || '').trim();
        bodyEl.innerHTML = '<div class="form-group" style="margin-bottom:var(--sp-3);">'
          + '<input class="form-input" data-role="kw" placeholder="搜索芯片号">'
          + '</div><div data-role="rows"></div>';
        const rowsEl = bodyEl.querySelector('[data-role="rows"]');
        const kwEl = bodyEl.querySelector('[data-role="kw"]');
        let kw = '';

        const renderRows = () => {
          const list = chips.filter(ch => {
            if (!kw) return true;
            return String(ch.number || '').toLowerCase().includes(kw);
          });
          if (!list.length) {
            rowsEl.innerHTML = '<div class="tx-empty">没有匹配的芯片号</div>';
            return;
          }
          rowsEl.innerHTML = list.map(ch => {
            const on = cur === String(ch.number || '');
            return '<div style="display:flex;align-items:center;gap:var(--sp-3);'
              + 'padding:10px 11px;border:1px solid ' + (on ? 'var(--bamboo-green)' : 'var(--border-light)')
              + ';border-radius:var(--r-lg);margin-bottom:8px;'
              + (on ? 'background:var(--bamboo-light);' : '') + '">'
              + '<div style="flex:1;min-width:0;">'
              + '<div style="font-size:var(--fs-md);font-weight:600;font-family:var(--font-mono);">' + this.escape(ch.number || '') + '</div>'
              + '<div style="font-size:var(--fs-xs);color:var(--ink-light);margin-top:2px;">'
              + this.escape(ch.materialName || '') + (ch.batchNo ? ' · 批号 ' + this.escape(ch.batchNo) : '') + '</div></div>'
              + '<div style="flex:none;">'
              + '<button class="btn btn-sm ' + (on ? 'btn-success' : 'btn-outline') + '" data-role="pick" data-v="' + this.escape(ch.number || '') + '">'
              + (on ? '✓ 已选' : '选择') + '</button></div></div>';
          }).join('');
          rowsEl.querySelectorAll('[data-role="pick"]').forEach(btn => {
            btn.addEventListener('click', () => {
              item.chipNo = btn.dataset.v;
              renderRows();
              this.refreshItemCard(key);
            });
          });
        };
        kwEl.addEventListener('input', () => {
          kw = String(kwEl.value || '').trim().toLowerCase();
          renderRows();
        });
        renderRows();
      },
      actions: '<button class="btn btn-primary" data-action="close">完成</button>'
    });
  },

  /* ==================== 旧口径「快速登记」 ==================== */
  async renderTreatmentQuick() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const pets = await TNR_API.getHospitalPetsStrict('in_treatment');
      if (pets.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔬</div><div class="empty-state-text">暂无待诊疗动物</div><div class="empty-state-desc">请先在「动物交接管理」中确认接收转运单</div><button class="btn btn-primary mt-4" data-nav-btn="receive">前往动物交接管理</button></div>';
        c.querySelector('[data-nav-btn]')?.addEventListener('click', () => this.navigateTo('receive'));
        return;
      }

      const selectedPet = pets.find(p => String(p.id) === String(this.state.treatmentPetId)) || pets[0];
      this.state.treatmentPetId = selectedPet.id;

      let html = '<div class="tx-tip wrn"><span>ℹ️</span><div>这是**旧口径**的一次性登记：'
        + '提交时当场扣减库存。新收治请优先用「诊疗流程」页签走三步流程；'
        + '这里保留用于补录绝育手术病历（手术日期 / 主刀 / 麻醉 / 诊断 / 手术过程 / 恢复），'
        + '这些字段打印页与政府端详情在读。</div></div>';
      html += '<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>选择诊疗动物</div></div><div class="card-body"><div style="display:grid;gap:var(--sp-2);">';
      pets.forEach(p => {
        html += '<div class="pet-select-item ' + (String(p.id) === String(selectedPet.id) ? 'selected' : '') + '" data-pet="' + p.id + '">' +
          '<div class="photo-placeholder">🐾</div>' +
          '<div style="flex:1;"><div style="font-weight:500;">' + this.escape(p.code) + ' · ' + this.escape(p.name || '') + '</div>' +
          '<div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + this.escape(p.species || '') + ' · ' + this.escape(p.breed || '') + ' · ' + this.escape(p.gender || '') + ' · ' + this.escape(p.age || '') + '</div></div>' +
          '<span class="badge badge-info">' + TNR_API.getPetStatusText(p.status) + '</span></div>';
      });
      html += '</div></div></div><div id="treatmentFormArea"></div>';
      c.innerHTML = html;

      c.querySelectorAll('[data-pet]').forEach(el => {
        el.addEventListener('click', () => {
          this.state.treatmentPetId = el.dataset.pet;
          this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
          this.renderTreatmentQuick();
        });
      });

      this.renderTreatmentForm(selectedPet);
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div>'
        + '<div class="empty-state-desc">' + this.escape(e.message || '') + '</div></div>';
    }
  },

  async renderTreatmentForm(pet) {
    const area = document.getElementById('treatmentFormArea');
    if (!area) return;
    area.innerHTML = '<div class="loading-state">加载表单...</div>';

    let materials = [];
    try { materials = await TNR_API.getMaterials(); } catch(e) {}
    const vaccines = materials.filter(m => m.category === 'vaccine');
    const dewormers = materials.filter(m => m.category === 'dewormer');

    /* 过期物料不能用于诊疗（服务端 `expired_material_error` 会拒），
       界面必须同步把它从下拉里去掉 —— 否则是「界面上能选、服务端要拒」的死胡同。
       ⚠ 但**当前已选中的那一条必须保留**（置灰）—— 否则编辑存量记录时下拉会退到
       第一个选项，归属被静默改掉（同区县下拉「保留当前值兜底」的约定）。 */
    const today = TNR_UI.todayStr();
    const matExpiry = m => m.expiryDate || m.expiry_date || '';
    const isExpired = m => !!matExpiry(m) && matExpiry(m) < today;
    const keepSelected = (list, selectedId) => list.filter(m =>
      !isExpired(m) || (selectedId != null && String(m.id) === String(selectedId)));

    const td = this.state.treatmentData;
    const esc = this.escape.bind(this);

    let html = '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>诊疗操作 · ' + esc(pet.code) + '</div></div><div class="card-body">';

    /* 基础信息 */
    html += '<div class="form-section"><div class="form-section-header"><div class="form-section-header-icon">📋</div><div class="form-section-title">基础信息</div></div><div class="form-section-body"><div class="desc-list">' +
      '<div class="desc-item"><div class="desc-label">宠物编号</div><div class="desc-value">' + esc(pet.code) + '</div></div>' +
      '<div class="desc-item"><div class="desc-label">名称</div><div class="desc-value">' + esc(pet.name || '—') + '</div></div>' +
      '<div class="desc-item"><div class="desc-label">物种/品种</div><div class="desc-value">' + (pet.species ? esc(pet.species) + (pet.breed ? ' / ' + esc(pet.breed) : '') : '—') + '</div></div>' +
      '<div class="desc-item"><div class="desc-label">性别/年龄</div><div class="desc-value">' + (pet.gender ? esc(pet.gender) + (pet.age ? ' / ' + esc(pet.age) : '') : (pet.age ? esc(pet.age) : '—')) + '</div></div>' +
      '<div class="desc-item"><div class="desc-label">芯片号</div><div class="desc-value">' + esc(pet.chip_no || '—') + '</div></div>' +
      '</div></div></div>';

    /* 诊疗项目 */
    html += '<div class="form-section"><div class="form-section-header"><div class="form-section-header-icon">🔬</div><div class="form-section-title">诊疗项目（勾选执行）</div></div><div class="form-section-body">';

    /* 绝育 */
    html += '<div class="treatment-item-card ' + (td.items.sterilization ? 'checked' : '') + '" data-toggle="sterilization" style="margin-bottom:var(--sp-3);"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.sterilization ? 'checked' : '') + ' data-check="sterilization" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +
      '<div class="treatment-item-icon">✂️</div><div style="flex:1;"><div style="font-weight:500;">绝育手术</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">必填录入完整病历档案，无库存消耗</div></div>' +
      (td.items.sterilization ? (td.sterilization ? '<span class="badge badge-success">已填写</span>' : '<span class="badge badge-warning">待填写</span>') : '') + '</div>' +
      (td.items.sterilization ? '<div class="treatment-item-body">' + (td.sterilization ?
        '<div style="display:flex;align-items:center;gap:var(--sp-3);"><span style="font-size:var(--fs-sm);color:var(--ink-muted);">手术日期：' + esc(td.sterilization.surgery_date || '—') + ' · 医生：' + esc(td.sterilization.surgeon || '—') + '</span><button class="btn btn-outline btn-sm" data-ster-modal>修改病历</button></div>'
        : '<button class="btn btn-outline btn-sm" data-ster-modal>填写病历</button>') + '</div>' : '') +
      '</div>';

    /* 疫苗 */
    html += '<div class="treatment-item-card ' + (td.items.vaccine ? 'checked' : '') + '" data-toggle="vaccine" style="margin-bottom:var(--sp-3);"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.vaccine ? 'checked' : '') + ' data-check="vaccine" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +
      '<div class="treatment-item-icon">💉</div><div style="flex:1;"><div style="font-weight:500;">疫苗接种</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">勾选后自动扣减医院疫苗库存-1，记录批次</div></div></div>' +
      (td.items.vaccine ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">疫苗类型</label><select class="form-select" id="vaccineSelect"><option value="">请选择</option>' +
        keepSelected(vaccines, td.vaccine && td.vaccine.material_id).map(v => '<option value="' + v.id + '" ' + (td.vaccine && String(td.vaccine.material_id) === String(v.id) ? 'selected' : '') + ' ' + (((v.hospital_stock || 0) <= 0 || isExpired(v)) ? 'disabled' : '') + '>' + esc(v.name) + (isExpired(v) ? '（已过期）' : '') + ' (库存:' + (v.hospital_stock || 0) + (v.unit || '') + ')</option>').join('') +
        '</select></div><div class="form-group" style="margin:0;"><label class="form-label">批号</label><input type="text" class="form-input" id="vaccineBatch" value="' + (td.vaccine ? esc(td.vaccine.batch_no || '') : '') + '" readonly /></div></div>' +
        '<div class="form-group" style="margin:var(--sp-2) 0 0;"><label class="form-label">接种日期</label><input type="date" class="form-input" id="vaccineDate" value="' + (td.vaccine ? td.vaccine.date : TNR_UI.todayStr()) + '" /></div></div>' : '') +
      '</div>';

    /* 驱虫 */
    html += '<div class="treatment-item-card ' + (td.items.deworming ? 'checked' : '') + '" data-toggle="deworming" style="margin-bottom:var(--sp-3);"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.deworming ? 'checked' : '') + ' data-check="deworming" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +
      '<div class="treatment-item-icon">💊</div><div style="flex:1;"><div style="font-weight:500;">驱虫护理</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">勾选后自动扣减医院驱虫药库存-1，留存用药记录</div></div></div>' +
      (td.items.deworming ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">驱虫药类型</label><select class="form-select" id="dewormerSelect"><option value="">请选择</option>' +
        keepSelected(dewormers, td.deworming && td.deworming.material_id).map(d => '<option value="' + d.id + '" ' + (td.deworming && String(td.deworming.material_id) === String(d.id) ? 'selected' : '') + ' ' + (((d.hospital_stock || 0) <= 0 || isExpired(d)) ? 'disabled' : '') + '>' + esc(d.name) + (isExpired(d) ? '（已过期）' : '') + ' (库存:' + (d.hospital_stock || 0) + (d.unit || '') + ')</option>').join('') +
        '</select></div><div class="form-group" style="margin:0;"><label class="form-label">批号</label><input type="text" class="form-input" id="dewormerBatch" value="' + (td.deworming ? esc(td.deworming.batch_no || '') : '') + '" readonly /></div></div>' +
        '<div class="form-group" style="margin:var(--sp-2) 0 0;"><label class="form-label">用药日期</label><input type="date" class="form-input" id="dewormerDate" value="' + (td.deworming ? td.deworming.date : TNR_UI.todayStr()) + '" /></div></div>' : '') +
      '</div>';

    /* 芯片 */
    html += '<div class="treatment-item-card ' + (td.items.chip ? 'checked' : '') + '" data-toggle="chip"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.chip ? 'checked' : '') + ' data-check="chip" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +
      '<div class="treatment-item-icon">📡</div><div style="flex:1;"><div style="font-weight:500;">芯片植入</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">输入可用芯片编号，绑定宠物档案，库存-1，芯片永久不可复用</div></div></div>' +
      (td.items.chip ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">芯片编号<span class="req">*</span></label><input type="text" class="form-input" id="chipInput" value="' + (td.chip ? esc(td.chip.chip_no || '') : '') + '" placeholder="请输入可用芯片编号" /></div>' +
        '<div class="form-group" style="margin:0;"><label class="form-label">植入日期</label><input type="date" class="form-input" id="chipDate" value="' + (td.chip ? td.chip.date : TNR_UI.todayStr()) + '" /></div></div></div>' : '') +
      '</div>';

    html += '</div></div>';

    /* 操作按钮 */
    html += '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;"><button class="btn btn-secondary" data-reset>重置</button><button class="btn btn-primary" data-save>保存诊疗记录</button></div>';
    html += '</div></div>';

    area.innerHTML = html;

    /* 绑定事件 */
    area.querySelectorAll('[data-toggle]').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        const item = card.dataset.toggle;
        const cb = card.querySelector('input[type="checkbox"]');
        const checked = !cb.checked;
        cb.checked = checked;
        this.state.treatmentData.items[item] = checked;
        if (!checked) {
          if (item === 'sterilization') this.state.treatmentData.sterilization = null;
          if (item === 'vaccine') this.state.treatmentData.vaccine = null;
          if (item === 'deworming') this.state.treatmentData.deworming = null;
          if (item === 'chip') this.state.treatmentData.chip = null;
        }
        this.renderTreatmentForm(pet);
      });
    });

    area.querySelectorAll('[data-check]').forEach(cb => {
      cb.addEventListener('change', e => {
        e.stopPropagation();
        const item = cb.dataset.check;
        this.state.treatmentData.items[item] = cb.checked;
        if (!cb.checked) {
          if (item === 'sterilization') this.state.treatmentData.sterilization = null;
          if (item === 'vaccine') this.state.treatmentData.vaccine = null;
          if (item === 'deworming') this.state.treatmentData.deworming = null;
          if (item === 'chip') this.state.treatmentData.chip = null;
        }
        this.renderTreatmentForm(pet);
      });
    });

    area.querySelector('[data-ster-modal]')?.addEventListener('click', e => {
      e.stopPropagation();
      this.openSterilizationModal(pet);
    });

    area.querySelector('[data-reset]')?.addEventListener('click', () => {
      this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
      this.renderTreatmentForm(pet);
    });

    area.querySelector('[data-save]')?.addEventListener('click', () => this.saveTreatment(pet));

    /* 疫苗/驱虫选择联动 */
    const vSel = area.querySelector('#vaccineSelect');
    if (vSel) vSel.addEventListener('change', () => {
      const mid = vSel.value;
      if (!mid) { this.state.treatmentData.vaccine = null; return; }
      const mat = materials.find(m => String(m.id) === String(mid));
      if (mat) {
        this.state.treatmentData.vaccine = {material_id: mid, type: mat.name, batch_no: mat.batch_no, date: area.querySelector('#vaccineDate')?.value || TNR_UI.todayStr(), quantity: 1};
        const bEl = area.querySelector('#vaccineBatch');
        if (bEl) bEl.value = mat.batch_no || '';
      }
    });

    const dSel = area.querySelector('#dewormerSelect');
    if (dSel) dSel.addEventListener('change', () => {
      const mid = dSel.value;
      if (!mid) { this.state.treatmentData.deworming = null; return; }
      const mat = materials.find(m => String(m.id) === String(mid));
      if (mat) {
        this.state.treatmentData.deworming = {material_id: mid, type: mat.name, batch_no: mat.batch_no, date: area.querySelector('#dewormerDate')?.value || TNR_UI.todayStr(), quantity: 1};
        const bEl = area.querySelector('#dewormerBatch');
        if (bEl) bEl.value = mat.batch_no || '';
      }
    });
  },

  openSterilizationModal(pet) {
    const td = this.state.treatmentData, ex = td.sterilization || {};
    TNR_UI.modal({
      title: '绝育手术病历档案',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML =
          '<div class="form-row"><div class="form-group"><label class="form-label">手术日期<span class="req">*</span></label><input type="date" class="form-input" id="sterSurgeryDate" value="' + (ex.surgery_date || TNR_UI.todayStr()) + '" /></div>' +
          '<div class="form-group"><label class="form-label">主刀医生<span class="req">*</span></label><input type="text" class="form-input" id="sterSurgeon" value="' + this.escape(ex.surgeon || '') + '" placeholder="请输入医生姓名" /></div></div>' +
          '<div class="form-group"><label class="form-label">诊断<span class="req">*</span></label><textarea class="form-textarea" id="sterDiagnosis" placeholder="请输入诊断信息">' + this.escape(ex.diagnosis || '') + '</textarea></div>' +
          '<div class="form-group"><label class="form-label">麻醉方式<span class="req">*</span></label><select class="form-select" id="sterAnesthesia"><option value="吸入麻醉" ' + (ex.anesthesia === '吸入麻醉' ? 'selected' : '') + '>吸入麻醉</option><option value="注射麻醉" ' + (ex.anesthesia === '注射麻醉' ? 'selected' : '') + '>注射麻醉</option><option value="复合麻醉" ' + (ex.anesthesia === '复合麻醉' ? 'selected' : '') + '>复合麻醉</option></select></div>' +
          '<div class="form-group"><label class="form-label">手术过程<span class="req">*</span></label><textarea class="form-textarea" id="sterProcedure" placeholder="请描述手术过程">' + this.escape(ex.procedure || '') + '</textarea></div>' +
          '<div class="form-group"><label class="form-label">恢复情况<span class="req">*</span></label><textarea class="form-textarea" id="sterRecovery" placeholder="请描述术后恢复情况">' + this.escape(ex.recovery || '') + '</textarea></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="sterSaveBtn">保存病历</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#sterSaveBtn').onclick = () => {
          const d = {
            surgery_date: bodyEl.querySelector('#sterSurgeryDate').value,
            surgeon: bodyEl.querySelector('#sterSurgeon').value.trim(),
            diagnosis: bodyEl.querySelector('#sterDiagnosis').value.trim(),
            anesthesia: bodyEl.querySelector('#sterAnesthesia').value,
            procedure: bodyEl.querySelector('#sterProcedure').value.trim(),
            recovery: bodyEl.querySelector('#sterRecovery').value.trim()
          };
          if (!d.surgery_date || !d.surgeon || !d.diagnosis || !d.procedure || !d.recovery) { TNR_UI.toast('请填写所有必填项', 'warning'); return; }
          this.state.treatmentData.sterilization = d;
          TNR_UI.toast('病历档案已保存', 'success');
          closeFn();
          this.renderTreatmentForm(pet);
        };
      }
    });
  },

  async saveTreatment(pet) {
    const td = this.state.treatmentData;
    const items = td.items;
    if (!items.sterilization && !items.vaccine && !items.deworming && !items.chip) { TNR_UI.toast('请至少选择一项诊疗项目', 'warning'); return; }
    if (items.sterilization && !td.sterilization) { TNR_UI.toast('请填写绝育手术病历', 'warning'); return; }

    const area = document.getElementById('treatmentFormArea');
    if (!area) return;

    if (items.vaccine) {
      const vSel = area.querySelector('#vaccineSelect');
      if (!vSel || !vSel.value) { TNR_UI.toast('请选择疫苗类型', 'warning'); return; }
      const vDate = area.querySelector('#vaccineDate')?.value || TNR_UI.todayStr();
      const mat = await TNR_API.getMaterials().then(ms => ms.find(m => String(m.id) === String(vSel.value)));
      td.vaccine = {material_id: vSel.value, type: mat ? mat.name : '', batch_no: mat ? mat.batch_no : '', date: vDate, quantity: 1};
    }
    if (items.deworming) {
      const dSel = area.querySelector('#dewormerSelect');
      if (!dSel || !dSel.value) { TNR_UI.toast('请选择驱虫药类型', 'warning'); return; }
      const dDate = area.querySelector('#dewormerDate')?.value || TNR_UI.todayStr();
      const mat = await TNR_API.getMaterials().then(ms => ms.find(m => String(m.id) === String(dSel.value)));
      td.deworming = {material_id: dSel.value, type: mat ? mat.name : '', batch_no: mat ? mat.batch_no : '', date: dDate, quantity: 1};
    }
    if (items.chip) {
      const cInput = area.querySelector('#chipInput');
      if (!cInput || !cInput.value.trim()) { TNR_UI.toast('请输入芯片编号', 'warning'); return; }
      td.chip = {chip_no: cInput.value.trim(), date: area.querySelector('#chipDate')?.value || TNR_UI.todayStr()};
    }

    const allChecked = items.sterilization && items.vaccine && items.deworming && items.chip;
    const payload = {
      pet_id: pet.id,
      items: {
        sterilization: !!items.sterilization,
        vaccine: !!items.vaccine,
        deworming: !!items.deworming,
        chip: !!items.chip
      },
      sterilization: td.sterilization || null,
      vaccine: td.vaccine || null,
      deworming: td.deworming || null,
      chip: td.chip || null,
      status: allChecked ? 'completed' : 'in_progress'
    };

    try {
      const res = await TNR_API.createTreatment(payload);
      if (res.success) {
        TNR_UI.toast('诊疗记录保存成功' + (allChecked ? '，诊疗已完成' : ''), 'success');
        this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
        this.renderTreatmentQuick();
      } else {
        TNR_UI.toast(res.message || '保存失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async renderTreatmentList() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const treatments = await TNR_API.getTreatmentsStrict();
      if (treatments.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无诊疗记录</div></div>';
        return;
      }

      const rows = treatments.map(t => {
        const items = [];
        if (t.items_sterilization) items.push('<span class="badge badge-cinnabar">绝育</span>');
        if (t.items_vaccine) items.push('<span class="badge badge-info">疫苗</span>');
        if (t.items_deworming) items.push('<span class="badge badge-success">驱虫</span>');
        if (t.items_chip) items.push('<span class="badge badge-warning">芯片</span>');
        return {
          pet_code: t.pet_code || '',
          _items: items.join(' ') || '—',
          hospital_name: t.hospital_name || '',
          _doctor: this.escape(t.sterilization_surgeon || t.operator_name || '—'),
          created_at: t.created_at,
          _status: this.treatmentStatusBadge(t.status),
          _actions: '<button class="btn-link" data-view-treatment="' + t.id + '">详情</button>',
        };
      });

      /* 列表卡不再渲染标题；筛选条放列表容器内 —— 本页有「诊疗操作 / 诊疗记录」两个
         子标签，筛选条只对记录有意义，放 sub-tabs 下面常驻会在另一个标签页里显得多余。
         ⚠ 筛选条的 id 直接写在 `.filter-bar` 上，**不要**再套一层 `<div id="...">`：
         那一层与筛选条同高，`position: sticky` 的包含块就是它自己，冻结直接失效。 */
      c.innerHTML = TNR_UI.renderFilterBar([
        { key: 'keyword', label: '搜索', type: 'search', placeholder: '宠物编号 / 医院 / 医生' },
        { key: 'start_date', label: '开始日期', type: 'date' },
        { key: 'end_date', label: '结束日期', type: 'date' }
      ], '', { id: 'treatListFilterBar' }) + '<div id="treatTableHolder"></div>';
      const treatBar = document.getElementById('treatListFilterBar');
      const renderTreatTable = () => {
        const v = TNR_UI.getFilterValues(treatBar);
        const list = rows.filter(r => {
          // 同上：`created_at` 是 UTC 串，必须按本地时区取日期再比较。
          if (!TNR_UI.inDateRange(r.created_at, v.start_date, v.end_date)) return false;
          if (!v.keyword) return true;
          return [r.pet_code, r.hospital_name, r._doctor]
            .filter(Boolean).join(' ').toLowerCase().includes(v.keyword);
        });
        TNR_UI.mountTable('treatTableHolder', { id: 'hospital.treatments', columns: [
            { title: '宠物编号', key: 'pet_code' },
            { title: '诊疗项目', key: '_items', sortable: false },
            { title: '医院', key: 'hospital_name' },
            { title: '医生', key: '_doctor', sortable: false },
            { title: '日期', key: 'created_at' },
            { title: '状态', key: '_status', sortable: false },
            { title: '操作', key: '_actions', sortable: false },
          ], data: list, emptyText: '暂无诊疗记录' });
      };
      renderTreatTable();
      TNR_UI.bindFilter(renderTreatTable, c);

      TNR_UI.delegateClick(c, {
        'data-view-treatment': (id) => this.viewTreatmentDetail(id)
      });
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async viewTreatmentDetail(treatmentId) {

      const res = await fetch('/api/business/treatments/' + treatmentId + '/');
      const result = await res.json();
      if (!result.success) { TNR_UI.toast(result.message || '加载失败', 'danger'); return; }
      const t = result.data;
      const pet = t.pet || {};

      let html = '<div class="detail-section"><div class="detail-section-title">宠物信息</div>' + TNR_UI.renderDescList([
        {label: '宠物编号', value: this.escape(t.pet_code)},
        {label: '名称', value: this.escape(pet.name || '—')},
        {label: '物种/品种', value: pet.species ? (this.escape(pet.species) + (pet.breed ? ' / ' + this.escape(pet.breed) : '')) : '—'},
        {label: '性别/年龄', value: (pet.gender || pet.age) ? ((pet.gender ? this.escape(pet.gender) : '') + (pet.gender && pet.age ? ' / ' : '') + (pet.age ? this.escape(pet.age) : '')) : '—'}
      ]) + '</div>';

      html += '<div class="detail-section"><div class="detail-section-title">诊疗项目</div>' + TNR_UI.renderDescList([
        {label: '绝育手术', value: t.items_sterilization ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '疫苗接种', value: t.items_vaccine ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '驱虫护理', value: t.items_deworming ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '芯片植入', value: t.items_chip ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'}
      ]) + '</div>';

      if (t.sterilization_surgeon) {
        html += '<div class="detail-section"><div class="detail-section-title">绝育病历档案</div>' + TNR_UI.renderDescList([
          {label: '手术日期', value: this.formatDate(t.sterilization_surgery_date)},
          {label: '主刀医生', value: this.escape(t.sterilization_surgeon)},
          {label: '麻醉方式', value: this.escape(t.sterilization_anesthesia)},
          {label: '诊断', value: this.escape(t.sterilization_diagnosis), full: true},
          {label: '手术过程', value: this.escape(t.sterilization_procedure), full: true},
          {label: '恢复情况', value: this.escape(t.sterilization_recovery), full: true}
        ]) + '</div>';
      }
      if (t.vaccine_type) {
        html += '<div class="detail-section"><div class="detail-section-title">疫苗接种记录</div>' + TNR_UI.renderDescList([
          {label: '疫苗类型', value: this.escape(t.vaccine_type)},
          {label: '批号', value: this.escape(t.vaccine_batch_no)},
          {label: '接种日期', value: this.formatDate(t.vaccine_date)},
          {label: '数量', value: (t.vaccine_quantity || 0) + '支'}
        ]) + '</div>';
      }
      if (t.deworming_type) {
        html += '<div class="detail-section"><div class="detail-section-title">驱虫护理记录</div>' + TNR_UI.renderDescList([
          {label: '驱虫药类型', value: this.escape(t.deworming_type)},
          {label: '批号', value: this.escape(t.deworming_batch_no)},
          {label: '用药日期', value: this.formatDate(t.deworming_date)},
          {label: '数量', value: (t.deworming_quantity || 0) + '盒'}
        ]) + '</div>';
      }
      if (t.chip_no) {
        html += '<div class="detail-section"><div class="detail-section-title">芯片植入记录</div>' + TNR_UI.renderDescList([
          {label: '芯片编号', value: this.escape(t.chip_no)},
          {label: '植入日期', value: this.formatDate(t.chip_date)}
        ]) + '</div>';
      }

        {label: '医院', value: this.escape(t.hospital_name)},

      ]) + '</div>';

  /* ========== 4. 物料库存管理 ========== */
  async render_material() {
    const page = document.getElementById('page-material');

    let txns = [];
    try { txns = await TNR_API.getMaterialTransactions(); } catch(e) {}
    const pending = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]')).length;
    const adjustments = txns.filter(t => t.type === 'adjustment').length;

    page.innerHTML = '<div class="tabs">' +
      '<div class="tab-item ' + (this.state.materialTab === 'pending' ? 'active' : '') + '" data-mtab="pending">待接收物料 (' + pending + ')</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'stock' ? 'active' : '') + '" data-mtab="stock">实时库存</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'chip' ? 'active' : '') + '" data-mtab="chip">芯片库存</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'adjustment' ? 'active' : '') + '" data-mtab="adjustment">库存异动 (' + adjustments + ')</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'ledger' ? 'active' : '') + '" data-mtab="ledger">出入库台账 (' + txns.length + ')</div>' +
      '</div>' +
      // 五个标签页共用一条筛选条，位置紧跟 .tabs（CSS 里 .tabs 钉 top:0、.filter-bar 钉 top:46px）。
      TNR_UI.renderFilterBar([
        { key: 'keyword', label: '搜索', type: 'search', placeholder: '物料 / 单号 / 批号 / 操作人 / 芯片号' },
        { key: 'start_date', label: '开始日期', type: 'date' },
        { key: 'end_date', label: '结束日期', type: 'date' }
      ], '', { id: 'materialFilterBar' }) +
      '<div id="materialTabContent"></div>';

    page.querySelectorAll('[data-mtab]').forEach(el => {
      el.addEventListener('click', () => {
        this.state.materialTab = el.dataset.mtab;
        page.querySelectorAll('.tab-item').forEach(t => {
          t.classList.toggle('active', t.dataset.mtab === this.state.materialTab);
        });
        this.renderMaterialTab(txns);
      });
    });

    this._matCache = txns;
    this.renderMaterialTab(txns);
    TNR_UI.bindFilter(() => this.renderMaterialTab(this._matCache || []), page);
  },

  /* 物料管理页四个标签页共用一条筛选条（#materialFilterBar），统一在这里取值与判定。
     日期字段各页不同（date 为主），故 inRange 按值传入。 */
  _matQuery() {
    const bar = document.getElementById('materialFilterBar');
    const v = TNR_UI.getFilterValues(bar);
    return {
      ok: (hay) => !v.keyword || String(hay || '').toLowerCase().includes(v.keyword),
      inRange: (d) => TNR_UI.inDateRange(d, v.start_date, v.end_date)
    };
  },

  async renderMaterialTab(txns) {
    const c = document.getElementById('materialTabContent');
    if (!c) return;
    if (this.state.materialTab === 'pending') this.renderMaterialPending(c, txns);
    else if (this.state.materialTab === 'stock') this.renderMaterialStock(c);
    else if (this.state.materialTab === 'chip') this.renderMaterialChip(c);
    else if (this.state.materialTab === 'adjustment') this.renderMaterialAdjustment(c, txns);
    else if (this.state.materialTab === 'ledger') this.renderMaterialLedger(c, txns);
  },

  renderMaterialPending(c, txns) {
    const q = this._matQuery();
    const dispatches = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]'))
      .filter(t => q.inRange(t.date)
        && q.ok([t.material_name, t.ledger_no, t.batch_no, t.operator_name].join(' ')));
    if (dispatches.length === 0) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">暂无待接收物料</div><div class="empty-state-desc">所有下发的物料已确认接收</div></div>';
      return;
    }
    const rows = dispatches.map(t => {
      return {
        _mat: '<div style="font-weight:500;">' + this.escape(t.material_name || '') + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">' + this.escape(t.ledger_no || '') + '</div>',
        _qty: (t.quantity || 0) + ' ' + this.escape(t.unit || ''),
        batch_no: t.batch_no || '—',
        operator_name: t.operator_name || '',
        date: t.date,
        _actions: '<button class="btn btn-success btn-sm" data-mreceive="' + t.id + '">确认入库</button>',
      };
    });
    TNR_UI.mountTable(c, { id: 'hospital.material.pending', columns: [
        { title: '物料名称', key: '_mat', sortable: false },
        { title: '数量', key: '_qty', sortable: false },
        { title: '批号', key: 'batch_no' },
        { title: '下发方', key: 'operator_name' },
        { title: '下发日期', key: 'date' },
        { title: '操作', key: '_actions', sortable: false },
      ], data: rows, emptyText: '暂无待接收物料' });
    TNR_UI.delegateClick(c, {
      'data-mreceive': (id) => this.confirmMaterialReceive(id)
    });
  },

  async renderMaterialStock(c) {
    c.innerHTML = '<div class="loading-state">加载中...</div>';
    try {
      const q = this._matQuery();
      const allMats = await TNR_API.getMaterialsStrict();
      const materials = allMats.filter(m =>
        q.ok([m.name, m.specification, m.batch_no, m.category].join(' ')));
      if (allMats.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">暂无物料</div></div>';
        return;
      }
      if (materials.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">没有符合筛选条件的物料</div></div>';
        return;
      }
      const cards = materials.map(m => {
        const stock = m.hospital_stock || 0;
        const safety = m.safety_stock || 1;
        const isLow = stock < safety;
        const pct = Math.min(100, (stock / (safety * 2)) * 100);
        const color = isLow ? 'var(--rouge)' : (stock < safety * 1.5 ? 'var(--autumn-gold)' : 'var(--bamboo-green)');
        return '<div class="card"><div class="card-body"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);">' +
          '<div><div style="font-weight:600;font-size:var(--fs-lg);">' + this.escape(m.name) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + TNR_API.getMaterialCategoryText(m.category) + ' · ' + this.escape(m.specification || '') + '</div></div>' +
          '<span class="badge ' + (isLow ? 'badge-danger' : 'badge-success') + '">' + (isLow ? '库存不足' : '正常') + '</span></div>' +
          '<div style="display:flex;align-items:center;gap:var(--sp-4);"><div style="flex:1;">' +
          '<div class="stock-bar"><div class="stock-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
          '<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:var(--fs-xs);color:var(--ink-light);"><span>当前库存</span><span>安全库存</span></div></div>' +
          '<div style="text-align:right;"><div style="font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;color:' + color + ';">' + stock + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">/ ' + safety + ' ' + this.escape(m.unit || '') + '</div></div></div>' +
          '<div class="desc-list mt-4"><div class="desc-item"><div class="desc-label">供应商</div><div class="desc-value">' + this.escape(m.supplier || '—') + '</div></div>' +
          '<div class="desc-item"><div class="desc-label">批号</div><div class="desc-value">' + this.escape(m.batch_no || '—') + '</div></div>' +
          '<div class="desc-item"><div class="desc-label">有效期</div><div class="desc-value">' + this.formatDate(m.expiry_date) + '</div></div></div>' +
          // B5：批次行内展开。主表那对批号/效期只是「最近一次入库」的快照 ——
          // 老批次还剩多少、是否临期，点开批次明细才看得到（展开逻辑在 TNR_UI）。
          '<div style="margin-top:var(--sp-3);"><button type="button" class="btn btn-outline btn-sm" data-batchcard="' + m.id + '">批次明细</button>' +
          '<div id="batchbox-' + m.id + '" style="display:none;margin-top:var(--sp-2);"></div></div></div></div>';
      }).join('');
      c.innerHTML = '<div class="stat-grid">' + cards + '</div>';
      // 批次展开走事件委托：卡片由筛选条重渲染，逐卡绑事件会失效。
      // ⚠ 标记防重：#materialTabContent 这个节点跨渲染复用，每次都
      // addEventListener 会让一次点击触发 N 次展开请求。
      if (!c._batchCardBound) {
        c._batchCardBound = true;
        c.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-batchcard]');
          if (!btn) return;
          TNR_UI.toggleCardBatches(btn.dataset.batchcard,
            document.getElementById('batchbox-' + btn.dataset.batchcard));
        });
      }
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async renderMaterialAdjustment(c, txns) {
    let materials = [];
    try { materials = await TNR_API.getMaterials(); } catch(e) {}

    const q = this._matQuery();
    const adj = txns.filter(t => t.type === 'adjustment')
      .filter(t => q.inRange(t.date)
        && q.ok([t.material_name, t.note, t.operator_name].join(' ')));
    let adjHtml = '<div class="empty-state" style="padding:var(--sp-6);"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无异动记录</div></div>';
    const adjRows = adj.map(t => ({
      material_name: t.material_name || '',
      note: t.note || '—',
      _qty: (t.quantity || 0) + ' ' + this.escape(t.unit || ''),
      date: t.date,
      operator_name: t.operator_name || '',
    }));
    if (adj.length > 0) adjHtml = '<div id="hospitalAdjTable"></div>';

    c.innerHTML = '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>库存异动报备</div></div><div class="card-body">' +
      '<div class="form-section"><div class="form-section-header"><div class="form-section-header-icon">📝</div><div class="form-section-title">新增异动报备</div></div><div class="form-section-body">' +
      '<div class="form-row"><div class="form-group"><label class="form-label">物料<span class="req">*</span></label><select class="form-select" id="adjMaterial"><option value="">请选择</option>' +
      materials.map(m => '<option value="' + m.id + '">' + this.escape(m.name) + ' (当前:' + (m.hospital_stock || 0) + (m.unit || '') + ')</option>').join('') +
      '</select></div><div class="form-group"><label class="form-label">数量<span class="req">*</span></label><input type="number" class="form-input" id="adjQty" value="1" min="1" /></div></div>' +
      '<div class="form-group" id="adjChipGroup" style="display:none;"><label class="form-label">芯片起始号<span class="req">*</span></label><input class="form-input" id="adjChipStart" placeholder="如 042060107000177" inputmode="numeric"><div class="fs-sm text-muted mt-2">按「首号 + 数量」作废连续号码的芯片，作废后不可恢复</div>'
      + '<div class="mt-2" id="adjChipSegments"></div>'
      + '<div class="fs-sm mt-2" id="adjChipPreview"><span class="text-muted">填写起始号后，这里会预览将要作废的号码范围</span></div></div>' +
      // B5：提交前预览「会扣哪几批」—— 异动正是处理过期物料的出口，
      // 预览不跳过过期批次（txn_type='adjustment'），操作员能明确看到
      // 报废的就是那批过期的。
      '<div class="form-group"><div class="fs-sm mt-2" id="adjBatchHint"><span class="text-muted">填写数量后，这里会预览将要扣减的批次</span></div></div>' +
      '<div class="form-group"><label class="form-label">原因说明<span class="req">*</span></label><textarea class="form-textarea" id="adjReason" placeholder="请说明异动原因（过期/破损/盘亏等）"></textarea></div>' +
      '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-primary" id="adjSubmitBtn">提交报备</button></div></div></div></div></div>' +
      '<div class="card mt-5"><div class="card-body-flush">' + adjHtml + '</div></div>';

    if (adj.length > 0) {
      TNR_UI.mountTable('hospitalAdjTable', { id: 'hospital.material.adjustment', columns: [
          { title: '物料', key: 'material_name' },
          { title: '原因', key: 'note' },
          { title: '数量', key: '_qty', sortable: false },
          { title: '日期', key: 'date' },
          { title: '操作人', key: 'operator_name' },
        ], data: adjRows, emptyText: '暂无异动记录' });
    }
    // 异动数量：PC/移动端统一的 −/+ 步进按钮
    TNR_UI.bindQtyStepper('adjQty');
    // 芯片物料按号码作废（「首号 + 数量」口径）：选到芯片时才亮出起始号，
    // 否则后端 `chip_batch_void()` 拿不到号码直接 400 —— 而界面上
    // 原来没有任何地方能填，芯片报废这条路完全走不通。
    // 作废是**不可恢复**操作，void 预检在提交前逐颗核对；
    // 号段摘要与捕捉点端同一份实现（TNR_UI），两端口径不会漂移。
    const adjPreview = TNR_UI.bindChipPreview('void', 'adjChipStart', 'adjQty', 'adjChipPreview',
      () => ({ material_id: document.getElementById('adjMaterial').value }));
    const adjToggleChip = () => {
      const m = materials.find(x => String(x.id) === String(document.getElementById('adjMaterial').value));
      const isChip = !!(m && m.category === 'chip');
      document.getElementById('adjChipGroup').style.display = isChip ? '' : 'none';
      if (isChip) {
        TNR_UI.renderChipSegments('adjChipSegments', m.id, (start) => {
          document.getElementById('adjChipStart').value = start;
          if (adjPreview) adjPreview.rerun();
        });
      } else {
        document.getElementById('adjChipSegments').innerHTML = '';
      }
    };
    // B5：批次扣减预览（adjustment 不跳过过期批次 —— 异动正是过期物料的出口）
    const adjBatchPreview = TNR_UI.bindBatchPreview('adjQty', 'adjBatchHint',
      () => document.getElementById('adjMaterial')?.value || null, 'adjustment');
    c.querySelector('#adjMaterial')?.addEventListener('change', () => {
      adjToggleChip();
      // 物料切换 → 批次预览重跑（bindBatchPreview 只监听数量输入，
      // 物料维度的变化由这里驱动 —— 与芯片 preview 的 rerun 同一模式）
      if (adjBatchPreview) adjBatchPreview.rerun();
    });
    c.querySelector('#adjSubmitBtn')?.addEventListener('click', () => this.saveStockAdjustment(materials));
  },

  async saveStockAdjustment(materials) {
    const mid = document.getElementById('adjMaterial').value;
    const qty = parseInt(document.getElementById('adjQty').value);
    const reason = document.getElementById('adjReason').value.trim();
    if (!mid) { TNR_UI.toast('请选择物料', 'warning'); return; }
    if (!qty || qty <= 0) { TNR_UI.toast('请输入有效数量', 'warning'); return; }
    if (!reason) { TNR_UI.toast('请填写原因说明', 'warning'); return; }
    // 芯片物料：异动 = 按「首号 + 数量」作废号码。空号码先在前端挡一道，
    // 后端 `chip_batch_void()` 还有第二道（「请填写起始芯片号」）。
    const mat = (materials || []).find(x => String(x.id) === String(mid));
    const chipStart = (mat && mat.category === 'chip')
      ? (document.getElementById('adjChipStart')?.value || '').trim() : '';
    if (mat && mat.category === 'chip' && !chipStart) { TNR_UI.toast('请填写芯片起始号', 'warning'); return; }

    try {
      const res = await TNR_API.adjustStock({material_id: parseInt(mid), quantity: qty, reason: reason, chip_start: chipStart});
      if (res.success) {
        TNR_UI.toast('异动报备已提交，库存已扣减', 'success');
        this.render_material();
      } else {
        TNR_UI.toast(res.message || '提交失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  /* ---------- 芯片库存（第四十六轮：按号码逐颗管理） ---------- */
  async renderMaterialChip(c) {
    c.innerHTML = '<div class="loading-state">加载中...</div>';
    try {
      const q = this._matQuery();
      // ⚠ `getChips` 走 `getData`，已解包返回 `{total, items}` —— 再取 `.data`
      // 恒为 undefined，芯片库存页会显示「暂无芯片记录」。
      const res = await TNR_API.getChips({});
      const all = (res && res.items) || [];
      const total = (res && res.total) || all.length;
      const chips = all.filter(ch => q.ok([ch.number, ch.materialName, ch.batchNo, ch.petCode].join(' ')));
      if (all.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-text">暂无芯片记录</div><div class="empty-state-desc">芯片随物料采购或下发入库后在此显示</div></div>';
        return;
      }
      if (chips.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">没有符合筛选条件的芯片</div></div>';
        return;
      }
      const statusBadge = {
        available: ['badge-success', '可用'],
        in_transit: ['badge-warning', '在途'],
        used: ['badge-cinnabar', '已植入'],
        void: ['badge-default', '作废']
      };
      const rows = chips.map(ch => {
        const [cls, text] = statusBadge[ch.status] || ['badge-default', ch.status];
        return {
          number: '<span class="font-mono fs-sm">' + this.escape(ch.number || '') + '</span>',
          _status: '<span class="badge ' + cls + '">' + text + '</span>',
          material_name: ch.materialName || '—',
          batch_no: ch.batchNo || '—',
          pet_code: ch.petCode || '—',
          _used: ch.usedAt ? this.formatDateTime(ch.usedAt) : '—',
          created_at: ch.createdAt || '',
          _op: '<button class="btn btn-outline btn-sm" data-chiptrace="' + this.escape(ch.number) + '">追溯</button>',
        };
      });
      let html = '';
      if (total > chips.length) {
        html += '<div class="tx-tip inf" style="margin-bottom:var(--sp-3);"><span>ℹ️</span><div>本院共有 <b>' + total + '</b> 颗芯片，当前显示前 ' + chips.length + ' 条。请用筛选条缩小范围。</div></div>';
      }
      html += '<div data-mt="hospital.material.chip"></div>';
      c.innerHTML = html;
      TNR_UI.mountTable('[data-mt="hospital.material.chip"]', { id: 'hospital.material.chip', columns: [
          { title: '芯片号', key: 'number', sortable: false },
          { title: '状态', key: '_status', sortable: false },
          { title: '所属物料', key: 'material_name' },
          { title: '批号', key: 'batch_no' },
          { title: '绑定宠物', key: 'pet_code' },
          { title: '使用时间', key: '_used', sortable: false },
          { title: '入库时间', key: 'created_at' },
          { title: '操作', key: '_op', sortable: false },
        ], data: rows, emptyText: '暂无芯片记录' });
      // 行内「追溯」走事件委托（mountTable 排序/翻页会整体重建 tbody）；
      // 抽屉本体在 TNR_UI.showChipTrace —— 与捕捉点端同一份实现。
      TNR_UI.delegateClick(c, {
        'data-chiptrace': (number) => TNR_UI.showChipTrace(number)
      }, 'HospitalChipRows');
    } catch (e) {
      c.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:var(--sp-6);">'
        + '<div style="font-size:var(--fs-2xl);">⚠️</div>'
        + '<div style="font-weight:600;margin-top:var(--sp-3);">芯片数据加载失败</div>'
        + '<div class="fs-sm text-muted mt-2">' + this.escape(e.message || '') + '</div></div></div>';
    }
  },

  renderMaterialLedger(c, txns) {
    const q = this._matQuery();
    const data = txns.filter(t => q.inRange(t.date)
        && q.ok([t.ledger_no, t.material_name, t.type, t.operator_name].join(' ')))
      .slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (data.length === 0) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无台账记录</div></div>';
      return;

    const typeMap = {'purchase': '采购入库', 'dispatch': '捕捉点下发', 'receive': '签收入库', 'consume': '诊疗消耗', 'adjustment': '库存异动'};
    const typeBadge = {'purchase': 'badge-success', 'dispatch': 'badge-info', 'receive': 'badge-cinnabar', 'consume': 'badge-warning', 'adjustment': 'badge-danger'};
    const rows = data.map(t => {
      const sign = (t.type === 'consume' || t.type === 'adjustment') ? '-' : '+';
      return {

        _typeRaw: t.type,

        from_to: t.from_to || '',
        operator_name: t.operator_name || '',

        { title: '类型', key: '_type', sortable: false },
        { title: '物料', key: 'material_name' },
        { title: '数量', key: '_qty', sortable: false },
        { title: '批号', key: 'batch_no' },
        { title: '来源/去向', key: 'from_to' },
        { title: '操作人', key: 'operator_name' },
        { title: '日期', key: 'date' },

  async confirmMaterialReceive(txnId) {
    TNR_UI.confirm('确认接收该批物料？', '确认入库').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.receiveMaterial(txnId);
        if (res.success) {
          TNR_UI.toast('物料入库成功', 'success');
          this.render_material();
        } else {
          TNR_UI.toast(res.message || '入库失败', 'danger');
        }
      } catch (e) {
        TNR_UI.toast(e.message || '操作失败', 'danger');
      }
    });
  },

  /* ========== 5. 领养信息维护 ========== */
  async render_adoption_info() {
    const page = document.getElementById('page-adoption-info');
    page.innerHTML = '<div class="loading-state">加载中...</div>';
    // 行内按钮统一走事件委托（绑在稳定的页容器上，只绑一次）。
    // 本方法有三条分支（仅有申请 / 仅有领出 / 完整卡片），每条都会重设 page.innerHTML，
    // 绑在按钮上的监听器会随旧节点丢失，故在此一次性声明全部动作。
    TNR_UI.delegateClick(page, {
      'data-review-apply': (id, node) => this.reviewApplication(id, node.dataset.action),
      'data-confirm-claim': (id) => this.confirmClaim(id),
      'data-save-info': (id) => this.saveAdoptionInfo(id),
      'data-publish': (id) => this.publishToHall(id),
      'data-unpublish': (id) => this.unpublishFromHall(id),
      'data-upload-photo': (id, node) => this.uploadPhoto(id, node.dataset.photoField)
    }, 'AdoptionInfo');

    try {
      const [pets, listings, adoptions, appJson] = await Promise.all([
        TNR_API.getHospitalPetsStrict('pending_adopt'),
        TNR_API.getHallListingsStrict(),
        TNR_API.getAdoptionsStrict(),
        TNR_API.get(TNR_API.BASE + 'adoptions/applications/')
      ]);

      // 待审核领养申请（领养人在线提交）
      const applications = appJson.data || [];
      const pendingAppls = applications.filter(a => a.status === 'pending');
      let applHtml = '';
      if (pendingAppls.length > 0) {
        applHtml = '<div id="hospitalApplTable"></div>';
      }
      const applRows = pendingAppls.map(a => ({
        _pet: '<span class="pet-code-chip">' + this.escape(a.pet_code || '') + '</span>',
        applicant_name: a.applicant_name || '',
        applicant_phone: a.applicant_phone || '',
        _qual: this.escape((a.qualification || '').substring(0, 40)),
        applied_at: a.applied_at,
        _actions: '<button class="btn btn-success btn-sm" data-review-apply="' + a.id + '" data-action="approve">通过</button> <button class="btn btn-danger btn-sm" data-review-apply="' + a.id + '" data-action="reject">拒绝</button>',
      }));

      // 待领出确认列表（捕捉点已登记领养，等待医院确认领出）
      const pendingClaims = adoptions.filter(a => a.status === 'pending_claim');
      let claimsHtml = '';
      if (pendingClaims.length > 0) {
        claimsHtml = '<div id="hospitalClaimsTable"></div>';
      }
      const claimRows = pendingClaims.map(a => ({
        ledger_no: a.ledger_no || a.id,
        _pet: '<span class="pet-code-chip">' + this.escape(a.pet_code || '') + '</span>',
        adopter_name: a.adopter_name || '',
        adopter_phone: a.adopter_phone || '',
        created_at: a.created_at,
        _actions: '<button class="btn btn-primary btn-sm" data-confirm-claim="' + a.id + '">确认领出</button>',
      }));

      /* 两个待办列表（待审核申请 / 待领出确认）共用一条筛选条。
         本方法有 3 条分支、每条都重设 page.innerHTML，所以 mountTable 一律走下面两个
         包装函数，避免过滤逻辑在 5 个调用点上各写一遍。 */
      const infoBarHtml = TNR_UI.renderFilterBar([
        { key: 'keyword', label: '搜索', type: 'search', placeholder: '单号 / 宠物编号 / 申请人 / 电话' }
      ], '', { id: 'adoptInfoFilterBar' });
      // 行对象是映射后的展示结构（含 HTML 片段），逐字段拼成 haystack 最省事，
      // 也不会漏列 —— 逐列写死字段名在字段改名后会静默失效。
      //
      // 起止时间：两张表的时间字段**不同**（申请单看 `applied_at`，待领出看领养
      // 登记时间 `created_at`），所以由调用方把要比的值传进来 ——
      // 在里面写死一个字段名，必然有一张表的时间是错的（而且照样返回 200）。
      const infoHit = (r, dateValue) => {
        const v = TNR_UI.getFilterValues(document.getElementById('adoptInfoFilterBar'));
        if (!TNR_UI.inDateRange(dateValue, v.start_date, v.end_date)) return false;
        return !v.keyword
          || Object.keys(r).map(k => r[k]).join(' ').toLowerCase().includes(v.keyword);
      };
      const mountAppl = () => {
        if (pendingAppls.length === 0) return;
        TNR_UI.mountTable('hospitalApplTable', { id: 'hospital.adoption.appl', columns: [
            { title: '宠物编号', key: '_pet', sortable: false },
            { title: '申请人', key: 'applicant_name' },
            { title: '电话', key: 'applicant_phone' },
            { title: '资质说明', key: '_qual', sortable: false },
            { title: '申请时间', key: 'applied_at' },
            { title: '操作', key: '_actions', sortable: false },
          ], data: applRows.filter(r => infoHit(r, r.applied_at)), emptyText: '暂无申请' });
      };
      const mountClaims = () => {
        if (pendingClaims.length === 0) return;
        TNR_UI.mountTable('hospitalClaimsTable', { id: 'hospital.adoption.claims', columns: [
            { title: '领养单号', key: 'ledger_no' },
            { title: '宠物编号', key: '_pet', sortable: false },
            { title: '领养人', key: 'adopter_name' },
            { title: '电话', key: 'adopter_phone' },
            { title: '登记时间', key: 'created_at' },
            { title: '操作', key: '_actions', sortable: false },
          ], data: claimRows.filter(r => infoHit(r, r.created_at)), emptyText: '暂无记录' });
      };

      if (pets.length === 0 && pendingClaims.length === 0) {
        page.innerHTML = infoBarHtml + applHtml + '<div class="empty-state"><div class="empty-state-icon">🐾</div><div class="empty-state-text">暂无待领养动物</div><div class="empty-state-desc">诊疗完成5天后，动物状态将自动变更为「待领养」</div></div>';
        mountAppl();
        return;
      }

      if (pets.length === 0) {
        page.innerHTML = infoBarHtml + claimsHtml + applHtml + '<div class="empty-state"><div class="empty-state-icon">🐾</div><div class="empty-state-text">暂无待领养动物</div><div class="empty-state-desc">诊疗完成5天后，动物状态将自动变更为「待领养」</div></div>';
        mountClaims();
        mountAppl();
        return;
      }

      const html = pets.map(p => {
        const listing = listings.find(l => l.pet && String(l.pet.id) === String(p.id));
        const inHall = listing && listing.is_active;
        const intro = listing ? (listing.intro || '') : (p.description || '');
        const personality = listing ? (listing.personality || '') : '';
        const bodyCondition = listing ? (listing.body_condition || '') : '';

        return '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>' + this.escape(p.code) + ' · ' + this.escape(p.name || '') + '</div>' +
          '<div class="flex gap-2">' + (inHall ? '<span class="badge badge-success">已上架领养大厅</span>' : '<span class="badge badge-warning">未上架</span>') +
          '<span class="badge ' + TNR_API.getPetStatusBadge(p.status) + '">' + TNR_API.getPetStatusText(p.status) + '</span></div></div>' +
          '<div class="card-body">' +
          '<div class="detail-section"><div class="detail-section-title">照片管理（捕捉前/捕捉后/诊疗后）</div>' +
          '<div style="grid-template-columns:repeat(3,1fr);display:grid;gap:var(--sp-3);">' +
          this.renderPhotoSlot(p, 'photo_before', '捕捉前') +
          this.renderPhotoSlot(p, 'photo_after', '捕捉后') +
          this.renderPhotoSlot(p, 'photo_treatment', '诊疗后') +
          '</div></div>' +
          '<div class="detail-section"><div class="detail-section-title">宠物简介</div>' +
          '<div class="form-group"><label class="form-label">简介描述</label><textarea class="form-textarea" id="desc_' + p.id + '" placeholder="请输入宠物简介">' + this.escape(intro) + '</textarea></div>' +
          '<div class="form-row"><div class="form-group"><label class="form-label">性格特点</label><input type="text" class="form-input" id="personality_' + p.id + '" value="' + this.escape(personality) + '" placeholder="如：温顺、亲人" /></div>' +
          '<div class="form-group"><label class="form-label">健康状况</label><input type="text" class="form-input" id="health_' + p.id + '" value="' + this.escape(bodyCondition) + '" placeholder="如：已绝育、已免疫" /></div></div>' +
          '<div class="form-group"><label class="form-label">芯片编号</label><input type="text" class="form-input" value="' + this.escape(p.chip_no || '') + '" readonly /></div>' +
          '</div>' +
          '<div class="detail-section"><div class="detail-section-title">领养状态</div>' + TNR_UI.renderDescList([
            {label: '当前状态', value: '<span class="badge ' + TNR_API.getPetStatusBadge(p.status) + '">' + TNR_API.getPetStatusText(p.status) + '</span>'},
            {label: '领养大厅', value: inHall ? '<span class="badge badge-success">已发布</span>' : '<span class="badge badge-default">未发布</span>'},
            {label: '物种/品种', value: this.escape(p.species || '') + ' / ' + this.escape(p.breed || '')}
          ]) + '</div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;">' +
          '<button class="btn btn-secondary" data-save-info="' + p.id + '">保存资料</button>' +
          (inHall ? '<button class="btn btn-secondary" data-unpublish="' + p.id + '">下架</button>' : '<button class="btn btn-gold" data-publish="' + p.id + '">发布至领养大厅</button>') +
          '</div></div></div>';
      }).join('');

      page.innerHTML = infoBarHtml + claimsHtml + applHtml + html;
      mountClaims();
      mountAppl();
      TNR_UI.bindFilter(() => { mountClaims(); mountAppl(); }, page);
    } catch (e) {
      page.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  renderPhotoSlot(pet, photoField, label) {
    const url = pet[photoField] || '';
    const inner = url ? '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;border-radius:var(--r-lg);" />' : '📷';
    return '<div style="cursor:pointer;" data-upload-photo="' + pet.id + '" data-photo-field="' + photoField + '"><div class="photo-placeholder-lg">' + inner + '</div><div style="text-align:center;font-size:var(--fs-sm);color:var(--ink-muted);margin-top:4px;">' + label + '</div></div>';
  },

  uploadPhoto(petId, photoField) {
    const labels = {photo_before: '捕捉前', photo_after: '捕捉后', photo_treatment: '诊疗后', photo_group: '合照'};
    TNR_UI.modal({
      title: '上传照片（' + (labels[photoField] || '') + '）',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="form-group"><label class="form-label">选择图片文件</label><input type="file" accept="image/*" id="photoFileInput" class="form-input" style="padding:4px;" /></div>' +
          '<div id="photoPreview" style="margin-top:var(--sp-3);"></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="photoUploadBtn">上传</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#photoFileInput').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            bodyEl.querySelector('#photoPreview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;border-radius:var(--r-md);" />';
          };
          reader.readAsDataURL(file);
        });
        bodyEl.querySelector('#photoUploadBtn').onclick = async () => {
          const file = bodyEl.querySelector('#photoFileInput').files[0];
          if (!file) { TNR_UI.toast('请选择图片文件', 'warning'); return; }
          try {
            const res = await TNR_API.uploadPetPhoto(petId, photoField, file);
            if (res.success) {
              TNR_UI.toast('照片上传成功', 'success');
              closeFn();
              this.render_adoption_info();
            } else {
              TNR_UI.toast(res.message || '上传失败', 'danger');
            }
          } catch (e) {
            TNR_UI.toast(e.message || '上传失败', 'danger');
          }
        };
      }
    });
  },
