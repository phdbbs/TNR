{% extends 'portal/hospital_base.html' %}
{% load static %}

{% block title %}宠物医院端 · 流浪动物TNR管理系统{% endblock %}

{% block nav_dashboard %}active{% endblock %}

{% block extra_head %}
{{ block.super }}
<style>
  .photo-placeholder{width:48px;height:48px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light);flex-shrink:0}
  .treatment-item-card{border:2px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:all var(--t-base);background:var(--white)}
  .treatment-item-card.checked{border-color:var(--cinnabar);background:var(--cinnabar-light)}
  .treatment-item-header{display:flex;align-items:center;gap:var(--sp-3)}
  .treatment-item-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:18px}
  .treatment-item-card.checked .treatment-item-icon{background:var(--cinnabar);color:#fff}
  .treatment-item-body{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border-faint)}
  .todo-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);cursor:pointer;transition:background var(--t-fast);border-bottom:1px solid var(--border-faint)}
  .todo-item:hover{background:var(--rice-light)}
  .todo-item:last-child{border-bottom:none}
  .todo-item-icon{width:32px;height:32px;border-radius:var(--r-md);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .todo-item-content{flex:1;min-width:0}
  .todo-item-title{font-size:var(--fs-md);font-weight:500;color:var(--ink-text)}
  .todo-item-desc{font-size:var(--fs-sm);color:var(--ink-muted)}
  .quick-action{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-5);border-radius:var(--r-lg);border:1px solid var(--border-light);cursor:pointer;transition:all var(--t-base);background:var(--white);text-align:center}
  .quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--cinnabar)}
  .quick-action-icon{width:44px;height:44px;border-radius:var(--r-lg);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:22px}
  .quick-action-label{font-size:var(--fs-sm);color:var(--ink-text);font-weight:500}
  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--sp-3)}
  .pet-select-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:2px solid var(--border-light);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast)}
  .pet-select-item:hover{border-color:var(--ink-light)}
  .pet-select-item.selected{border-color:var(--cinnabar);background:var(--cinnabar-light)}
  .stock-bar{height:6px;background:var(--rice-warm);border-radius:var(--r-full);overflow:hidden;margin-top:var(--sp-2)}
  .stock-bar-fill{height:100%;border-radius:var(--r-full);transition:width var(--t-slow)}
  .detail-section{margin-bottom:var(--sp-5)}
  .detail-section-title{font-family:var(--font-display);font-size:var(--fs-md);font-weight:600;color:var(--ink);margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--border-faint);display:flex;align-items:center;gap:var(--sp-2)}
  .detail-section-title::before{content:'';width:3px;height:14px;background:var(--grad-cinnabar);border-radius:2px}
  .empty-state{text-align:center;padding:var(--sp-12) var(--sp-6);color:var(--ink-light)}
  .empty-state-icon{font-size:56px;margin-bottom:var(--sp-4);opacity:0.3}
  .empty-state-text{font-size:var(--fs-lg);margin-bottom:var(--sp-2)}
  .empty-state-desc{font-size:var(--fs-sm)}
  .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
  @media(max-width:768px){.dashboard-grid{grid-template-columns:1fr}}
  .photo-placeholder-lg{width:100%;aspect-ratio:1;border-radius:var(--r-lg);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--ink-light);overflow:hidden}
  .sub-tabs{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
  .sub-tab{padding:var(--sp-2) var(--sp-4);cursor:pointer;border-bottom:2px solid transparent;font-size:var(--fs-md);color:var(--ink-muted);transition:all var(--t-fast)}
  .sub-tab:hover{color:var(--ink)}
  .sub-tab.active{color:var(--cinnabar);border-bottom-color:var(--cinnabar);font-weight:600}
  .loading-state{text-align:center;padding:var(--sp-8);color:var(--ink-light)}

  /* ============================================================
     第四十六轮 v5.1：诊疗三步流程（原型 prototype_hospital_treatment_v5.1）
     ------------------------------------------------------------
     ⚠ 全部选择器都挂在 `#page-treatment` 下。这些类名（`.chip` / `.empty` /
       `.kv` / `.tip` / `.pet-item` …）在原型里是全局的，直接搬进来会**泄漏到
       本门户其它页面**（改一处样式、别处一起变，且不会报错）。加一层页面作用域
       就把影响面钉死在诊疗页内。
     ⚠ 颜色/圆角/间距一律用 `tnr-traditional.css` 的既有令牌，不新造颜色 ——
       否则「同一个端两种风格」，与本轮「样式与原来一致」的要求相反。
     ============================================================ */
  #page-treatment .tx-filter-tabs{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);overflow-x:auto;padding-bottom:2px}
  #page-treatment .tx-ft{border:1px solid var(--border-ink);background:var(--white);color:var(--ink-muted);border-radius:var(--r-full);padding:6px 14px;font-size:var(--fs-base);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all var(--t-fast)}
  #page-treatment .tx-ft .cnt{background:var(--rice-warm);color:var(--ink-muted);border-radius:var(--r-full);font-size:var(--fs-xs);font-weight:700;padding:0 7px;line-height:1.6}
  #page-treatment .tx-ft.active{background:var(--grad-cinnabar);border-color:transparent;color:#fff;font-weight:600;box-shadow:var(--shadow-cinnabar)}
  #page-treatment .tx-ft.active .cnt{background:rgba(255,255,255,.25);color:#fff}

  #page-treatment .tx-pet-item{display:flex;gap:var(--sp-3);align-items:center;background:var(--white);border:1px solid var(--border-light);border-radius:var(--r-xl);box-shadow:var(--shadow-sm);padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);cursor:pointer;transition:all var(--t-fast)}
  #page-treatment .tx-pet-item:hover{border-color:var(--cinnabar);box-shadow:var(--shadow-md)}
  #page-treatment .tx-pet-item .ico{width:46px;height:46px;border-radius:var(--r-lg);background:var(--rice-warm);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px}
  #page-treatment .tx-pet-item .info{flex:1;min-width:0}
  #page-treatment .tx-pet-item .l1{font-weight:600;font-size:var(--fs-md);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
  #page-treatment .tx-pet-item .l2{font-size:var(--fs-sm);color:var(--ink-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #page-treatment .tx-pet-item .go{flex:none;color:var(--ink-light);font-size:var(--fs-lg)}
  #page-treatment .tx-empty{text-align:center;color:var(--ink-light);font-size:var(--fs-base);padding:var(--sp-8) 0;line-height:1.9}

  #page-treatment .tx-flow-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap}
  #page-treatment .tx-flow-head .who{font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;color:var(--ink)}
  #page-treatment .tx-flow-head .meta{font-size:var(--fs-sm);color:var(--ink-light)}
  #page-treatment .tx-steps{display:flex;align-items:flex-start;background:var(--white);border:1px solid var(--border-light);border-radius:var(--r-xl);padding:var(--sp-3) var(--sp-2) 10px;margin-bottom:var(--sp-4);box-shadow:var(--shadow-sm)}
  #page-treatment .tx-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;cursor:pointer}
  #page-treatment .tx-step .dot{width:27px;height:27px;border-radius:var(--r-full);background:var(--rice-warm);color:var(--ink-light);display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);font-weight:700;flex:none;transition:all var(--t-base)}
  #page-treatment .tx-step .lb{font-size:var(--fs-xs);color:var(--ink-light);text-align:center;line-height:1.3}
  #page-treatment .tx-step::after{content:'';position:absolute;top:13px;left:calc(50% + 17px);right:calc(-50% + 17px);height:2px;background:var(--border-light)}
  #page-treatment .tx-step:last-child::after{display:none}
  #page-treatment .tx-step.done .dot{background:var(--bamboo-green);color:#fff}
  #page-treatment .tx-step.done .lb{color:var(--bamboo-green)}
  #page-treatment .tx-step.done::after{background:var(--bamboo-green)}
  #page-treatment .tx-step.cur .dot{background:var(--grad-cinnabar);color:#fff;box-shadow:var(--shadow-cinnabar)}
  #page-treatment .tx-step.cur .lb{color:var(--cinnabar);font-weight:700}
  #page-treatment .tx-step.lock{cursor:not-allowed;opacity:.55}

  #page-treatment .tx-fld{margin-bottom:var(--sp-3)}
  #page-treatment .tx-fld:last-child{margin-bottom:0}
  #page-treatment .tx-fld>label{display:block;font-size:var(--fs-sm);color:var(--ink-muted);margin-bottom:5px;font-weight:500}
  #page-treatment .tx-fld>label .req{color:var(--cinnabar);margin-left:2px}
  #page-treatment .tx-fld>label .auto{font-size:var(--fs-xs);color:var(--bamboo-green);background:var(--bamboo-light);border-radius:var(--r-full);padding:0 6px;margin-left:5px;font-weight:600}
  /* 绝育手术病历行（第四十七轮并入三步流程） */
  #page-treatment .tx-rec-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
  #page-treatment .tx-rec-sum{flex:1;min-width:180px;font-size:var(--fs-sm);color:var(--ink-light);background:var(--rice-light);border:1px dashed var(--border-ink);border-radius:var(--r-md);padding:7px 11px}
  #page-treatment .tx-rec-sum.on{color:var(--ink-text);border-style:solid;background:var(--white)}
  #page-treatment .tx-inp,#page-treatment .tx-sel,#page-treatment .tx-tar{width:100%;padding:8px 11px;border:1px solid var(--border-ink);border-radius:var(--r-md);background:var(--white);color:var(--ink-text);font-size:var(--fs-md);min-height:38px;outline:none;transition:border var(--t-fast)}
  #page-treatment .tx-inp:focus,#page-treatment .tx-sel:focus,#page-treatment .tx-tar:focus{border-color:var(--cinnabar);box-shadow:0 0 0 3px rgba(195,39,43,.1)}
  #page-treatment .tx-inp[readonly],#page-treatment .tx-inp:disabled,#page-treatment .tx-sel:disabled,#page-treatment .tx-tar:disabled{background:var(--rice-light);color:var(--ink-muted)}
  #page-treatment .tx-tar{min-height:74px;resize:vertical;line-height:1.6}
  #page-treatment .tx-row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  #page-treatment .tx-row3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
  #page-treatment .tx-unit{position:relative}
  #page-treatment .tx-unit .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:var(--fs-sm);color:var(--ink-light);pointer-events:none}
  #page-treatment .tx-unit .tx-inp{padding-right:38px}
  @media(max-width:560px){
    #page-treatment .tx-row3{grid-template-columns:1fr 1fr}
    #page-treatment .tx-row3>.tx-fld:nth-child(3){grid-column:1/-1}
  }

  #page-treatment .tx-chips{display:flex;flex-wrap:wrap;gap:7px}
  #page-treatment .tx-chip{border:1px solid var(--border-ink);background:var(--white);color:var(--ink-text);border-radius:var(--r-full);padding:5px 12px;font-size:var(--fs-sm);cursor:pointer;transition:all var(--t-fast);min-height:32px;display:inline-flex;align-items:center;user-select:none}
  #page-treatment .tx-chip.active{background:var(--cinnabar-light);border-color:var(--cinnabar);color:var(--cinnabar);font-weight:600}
  #page-treatment .tx-chip.active.ok{background:var(--bamboo-light);border-color:var(--bamboo-green);color:var(--bamboo-green)}
  #page-treatment .tx-chip.active.warn{background:var(--autumn-light);border-color:var(--autumn-gold);color:#8a6a1f}
  #page-treatment .tx-chip.disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
  #page-treatment .tx-chip.qk{min-height:30px;padding:3px 11px;font-size:var(--fs-sm)}
  #page-treatment .tx-seg{display:inline-flex;border:1px solid var(--border-ink);border-radius:var(--r-md);overflow:hidden;flex:none}
  #page-treatment .tx-seg button{border:none;background:var(--white);color:var(--ink-muted);font-size:var(--fs-sm);padding:5px 10px;cursor:pointer;transition:all var(--t-fast);border-left:1px solid var(--border-light)}
  #page-treatment .tx-seg button:first-child{border-left:none}
  #page-treatment .tx-seg button.on-neg{background:var(--bamboo-green);color:#fff;font-weight:600}
  #page-treatment .tx-seg button.on-pos{background:var(--rouge);color:#fff;font-weight:600}
  #page-treatment .tx-seg button.on-none{background:var(--rice-warm);color:var(--ink-muted);font-weight:600}

  #page-treatment .tx-kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  #page-treatment .tx-kv .k{font-size:var(--fs-xs);color:var(--ink-light)}
  #page-treatment .tx-kv .v{font-size:var(--fs-base);color:var(--ink-text);font-weight:500;margin-top:1px}
  #page-treatment .tx-kv .full{grid-column:1/-1}
  @media(max-width:560px){ #page-treatment .tx-kv{grid-template-columns:1fr} }

  #page-treatment .tx-tip{display:flex;gap:var(--sp-2);align-items:flex-start;font-size:var(--fs-sm);line-height:1.55;padding:8px 11px;border-radius:var(--r-md);margin:9px 0}
  #page-treatment .tx-tip.inf{background:var(--azurite-light);color:#1c4f80}
  #page-treatment .tx-tip.wrn{background:var(--autumn-light);color:#8a6a1f}
  #page-treatment .tx-tip.suc{background:var(--bamboo-light);color:#3f5c37}

  #page-treatment .tx-item-card{border:1px solid var(--border-light);border-radius:var(--r-xl);background:var(--white);margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow-xs)}
  #page-treatment .tx-item-card.collapsed .tx-item-b{display:none}
  #page-treatment .tx-item-card.filled{border-color:var(--bamboo-green)}
  #page-treatment .tx-item-card.filled .tx-item-h{background:var(--bamboo-light)}
  #page-treatment .tx-item-card.half{border-color:var(--rouge)}
  #page-treatment .tx-item-card.half .tx-item-h{background:var(--rouge-light)}
  #page-treatment .tx-item-h{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--rice-light);border-bottom:1px solid var(--border-light);cursor:pointer;user-select:none}
  #page-treatment .tx-item-card.collapsed .tx-item-h{border-bottom:none}
  #page-treatment .tx-item-h .ic{font-size:18px;flex:none}
  #page-treatment .tx-item-h .nm{flex:1;min-width:0;font-weight:600;font-size:var(--fs-md)}
  #page-treatment .tx-item-h .nm small{display:block;font-weight:400;color:var(--ink-light);font-size:var(--fs-xs);margin-top:1px}
  #page-treatment .tx-item-h .arr{flex:none;color:var(--ink-light);font-size:var(--fs-lg);transition:transform var(--t-base)}
  #page-treatment .tx-item-card.open .tx-item-h .arr{transform:rotate(90deg)}
  #page-treatment .tx-item-b{padding:var(--sp-3)}
  #page-treatment .tx-date-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  #page-treatment .tx-date-row .tx-inp{flex:0 0 165px;min-width:0}
  #page-treatment .tx-sec-head{display:flex;align-items:center;gap:var(--sp-2);padding:2px 2px 10px;font-family:var(--font-display);font-size:var(--fs-lg);font-weight:600;color:var(--ink)}
  #page-treatment .tx-sec-head .bar{width:3px;height:15px;background:var(--grad-cinnabar);border-radius:2px;flex:none}
  #page-treatment .tx-sec-head .hint{margin-left:auto;font-family:var(--font-body);font-size:var(--fs-sm);font-weight:400;color:var(--ink-light)}
  #page-treatment .tx-rx-list{display:flex;flex-direction:column;gap:7px;margin-top:9px}
  #page-treatment .tx-rx-row{display:flex;align-items:center;gap:9px;background:var(--rice-light);border:1px solid var(--border-light);border-radius:var(--r-md);padding:6px 9px}
  #page-treatment .tx-rx-row .nm{flex:1;min-width:0;font-size:var(--fs-base);font-weight:500}
  #page-treatment .tx-rx-row .nm small{display:block;font-weight:400;color:var(--ink-light);font-size:var(--fs-xs)}
  #page-treatment .tx-rx-row .qty{flex:none;font-size:var(--fs-sm);color:var(--cinnabar);font-weight:700;background:var(--cinnabar-light);border-radius:var(--r-full);padding:2px 9px}
  #page-treatment .tx-rx-row .del{flex:none;width:26px;height:26px;border:none;background:var(--rouge-light);color:var(--rouge);border-radius:var(--r-md);cursor:pointer;font-size:var(--fs-md);display:flex;align-items:center;justify-content:center}
  #page-treatment .tx-rx-empty{font-size:var(--fs-sm);color:var(--ink-light);padding:8px 0;text-align:center}
  #page-treatment .tx-tpl-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  #page-treatment .tx-tpl-row .t{font-size:var(--fs-xs);border:1px dashed var(--border-ink);border-radius:var(--r-full);padding:3px 9px;color:var(--ink-muted);cursor:pointer;background:var(--rice-light)}
  #page-treatment .tx-sign-strip{display:flex;align-items:center;gap:10px;background:var(--rice-light);border:1px dashed var(--border-ink);border-radius:var(--r-lg);padding:9px 11px;margin-top:9px}
  #page-treatment .tx-sign-strip .stamp{width:44px;height:44px;border:2px solid var(--rouge);border-radius:50%;color:var(--rouge);flex:none;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;text-align:center;line-height:1.1;transform:rotate(-9deg);font-family:var(--font-display);padding:2px}
  #page-treatment .tx-sign-strip .sd{flex:1;min-width:0}
  #page-treatment .tx-sign-strip .sd .n{font-size:var(--fs-base);font-weight:600}
  #page-treatment .tx-sign-strip .sd .d{font-size:var(--fs-xs);color:var(--ink-light);font-family:var(--font-mono);margin-top:1px}

  #page-treatment .tx-exec-row{display:flex;align-items:center;gap:11px;border:1px solid var(--border-light);border-radius:var(--r-lg);padding:11px 12px;margin-bottom:9px;background:var(--white)}
  #page-treatment .tx-exec-row.done{border-color:var(--bamboo-green);background:var(--bamboo-light)}
  #page-treatment .tx-exec-row .ic{font-size:19px;flex:none}
  #page-treatment .tx-exec-row .info{flex:1;min-width:0}
  #page-treatment .tx-exec-row .info .nm{font-size:var(--fs-md);font-weight:600}
  #page-treatment .tx-exec-row .info .sub{font-size:var(--fs-sm);color:var(--ink-light);margin-top:2px}
  #page-treatment .tx-exec-row .info .sub b{color:var(--cinnabar);font-weight:600}
  #page-treatment .tx-exec-row .act{flex:none}

  #page-treatment .tx-disposal-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  @media(max-width:560px){ #page-treatment .tx-disposal-grid{grid-template-columns:1fr} }
  #page-treatment .tx-dsp{border:1px solid var(--border-ink);border-radius:var(--r-lg);padding:var(--sp-3);cursor:pointer;background:var(--white);transition:all var(--t-fast);display:flex;gap:10px;align-items:flex-start}
  #page-treatment .tx-dsp.active{border-color:var(--cinnabar);background:var(--cinnabar-light);box-shadow:var(--shadow-sm)}
  #page-treatment .tx-dsp .ic{font-size:20px;flex:none}
  #page-treatment .tx-dsp .tx{flex:1;min-width:0}
  #page-treatment .tx-dsp .tx .n{font-size:var(--fs-md);font-weight:600;color:var(--ink-text)}
  #page-treatment .tx-dsp .tx .d{font-size:var(--fs-xs);color:var(--ink-light);margin-top:2px}
  #page-treatment .tx-dsp.active .tx .n{color:var(--cinnabar)}

  #page-treatment .tx-bottom-bar{position:sticky;bottom:0;background:rgba(245,240,232,.94);backdrop-filter:blur(8px);border-top:1px solid var(--border-light);padding:var(--sp-3) 0 var(--sp-1);display:flex;gap:10px;margin-top:var(--sp-4);z-index:40}
  #page-treatment .tx-bottom-bar .btn{flex:1}
  #page-treatment .tx-bottom-bar .btn-ghost{flex:0 0 110px}

  /* 交接单详情（第四十八轮）：逐只勾选 → 可部分签收 */
  .xfer-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-2) 0 var(--sp-2);font-weight:600;color:var(--ink-text)}
  .xfer-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
  .xfer-pet{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--r-md);background:var(--white);cursor:pointer;transition:all var(--t-fast)}
  .xfer-pet:hover{border-color:var(--border-ink)}
  .xfer-pet.on{background:var(--bamboo-light);border-color:var(--bamboo-green)}
  .xfer-pet input{flex:none;width:16px;height:16px;accent-color:var(--bamboo-green)}
  .xfer-ph{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-size:16px}
  .xfer-info{flex:1;min-width:0}
  .xfer-code{font-weight:500;color:var(--ink-text)}
  .xfer-meta{font-size:var(--fs-sm);color:var(--ink-muted);margin-top:2px}

  /* 出院（第四十八轮）：去向选择 + 单据表单 */
  .dsp-choice{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
  @media(max-width:560px){ .dsp-choice{grid-template-columns:1fr} }
  .dsp-opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;
    border:1px solid var(--border-ink);border-radius:var(--r-lg);background:var(--white);
    cursor:pointer;transition:all var(--t-fast);width:100%}
  .dsp-opt:hover{border-color:var(--cinnabar);background:var(--cinnabar-light)}
  .dsp-opt .ic{font-size:22px;flex:none}
  .dsp-opt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .dsp-opt .tx b{font-size:var(--fs-md);color:var(--ink-text)}
  .dsp-opt .tx i{font-style:normal;font-size:var(--fs-sm);color:var(--ink-muted)}
  .dsp-opt .go{color:var(--ink-light);flex:none}
  .dsp-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-3)}
  @media(max-width:560px){ .dsp-form{grid-template-columns:1fr} }
  .dsp-fld{display:flex;flex-direction:column;gap:6px}
  .dsp-fld.full{grid-column:1 / -1}
  .dsp-fld label{font-size:var(--fs-sm);color:var(--ink-muted);font-weight:500}
  .dsp-fld .req{color:var(--cinnabar);margin-left:2px}
  .dsp-chips{display:flex;gap:8px;flex-wrap:wrap}
  .dsp-chips span{padding:7px 14px;border:1px solid var(--border-ink);border-radius:var(--r-full);
    font-size:var(--fs-sm);cursor:pointer;background:var(--white);transition:all var(--t-fast)}
  .dsp-chips span.on{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff}
  .dsp-actions{display:flex;justify-content:flex-end;gap:var(--sp-3);margin-top:var(--sp-4)}

  /* 出院管理页（第四十八轮）：左侧去向模块 + 右侧搜索条件 + 动物维度列表。
     `align-items:flex-start` 不能省 —— 否则左侧栏会被拉成与右侧等高，
     sticky 的包含块变成整列，模块按钮跟着列表一起滚走。 */
  #page-discharge .dsp-layout{display:flex;gap:var(--sp-4);align-items:flex-start}
  #page-discharge .dsp-side{flex:none;width:190px;display:flex;flex-direction:column;gap:8px;
    position:sticky;top:0}
  #page-discharge .dsp-mod{display:flex;gap:10px;align-items:flex-start;width:100%;
    padding:11px 12px;border:1px solid var(--border-ink);border-radius:var(--r-lg);
    background:var(--white);cursor:pointer;text-align:left;font-family:inherit;
    transition:all var(--t-fast)}
  #page-discharge .dsp-mod:hover{border-color:var(--cinnabar)}
  #page-discharge .dsp-mod.active{border-color:var(--cinnabar);background:var(--cinnabar-light);
    box-shadow:var(--shadow-sm)}
  #page-discharge .dsp-mod .ic{font-size:18px;flex:none;line-height:1.2}
  #page-discharge .dsp-mod .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  #page-discharge .dsp-mod .tx .n{font-size:var(--fs-base);font-weight:600;color:var(--ink-text)}
  #page-discharge .dsp-mod .tx .d{font-size:var(--fs-xs);color:var(--ink-light);line-height:1.4}
  #page-discharge .dsp-mod.active .tx .n{color:var(--cinnabar)}
  #page-discharge .dsp-mod .cnt{flex:none;align-self:flex-start;font-size:var(--fs-xs);font-weight:700;
    color:var(--cinnabar);background:var(--cinnabar-light);border-radius:var(--r-full);padding:1px 7px}
  #page-discharge .dsp-mod.active .cnt{background:var(--white)}
  #page-discharge .dsp-main{flex:1;min-width:0}
  #page-discharge .dsp-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
  @media(max-width:900px){
    #page-discharge .dsp-layout{flex-direction:column}
    #page-discharge .dsp-side{width:100%;position:static;flex-direction:row;flex-wrap:wrap}
    #page-discharge .dsp-mod{flex:1 1 46%}
  }
</style>
{% endblock %}

{% block content %}
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<div class="admin-content" id="adminContent">
  <div class="page-view active" id="page-dashboard"></div>
  <div class="page-view" id="page-receive"></div>
  <div class="page-view" id="page-treatment"></div>
  <div class="page-view" id="page-discharge"></div>
  <div class="page-view" id="page-material"></div>
  <div class="page-view" id="page-adoption-info"></div>
  <div class="page-view" id="page-euthanasia"></div>
  <div class="page-view" id="page-ledger"></div>
  <div class="page-view" id="page-profile"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>window.TNR_USER = {{ user_data|safe }};</script>
<script src="{% static 'js/tnr-api.js' %}?v=20261018a"></script>
<script>
/* ====================================================
   宠物医院端 SPA · 全部业务逻辑（TNR_API 异步调用）
   ==================================================== */

/* 办结去向的图标与说明（第四十六轮 v5.1）。
   ⚠ 只放**展示**信息：去向的**合法取值**由后端
     `Treatment.DISPOSAL_CHOICES` 通过 `options.disposals` 下发，
     前端不另写一份清单 —— 两边各写一份必然漂移（后端加了去向、
     前端下拉里没有，界面上就是「这个去向选不了」且不报错）。 */
const TX_DISPOSAL_ICON = {
  pending_adopt: '🎗️', released: '🌳', owner_returned: '🏠',
  euthanized: '🕯️', dead: '⚰️'
};
const TX_DISPOSAL_DESC = {
  pending_adopt: '信息进入领养大厅', released: '待转运可选',
  owner_returned: '联系主人领回', euthanized: '需另开安乐死单',
  dead: '需另开无害化单'
};

const Hospital = {
  titles: {
    'dashboard': '首页看板',
    'receive': '动物交接管理',
    'treatment': '诊疗业务管理',
    'discharge': '出院管理',
    'material': '物料库存管理',
    'adoption-info': '领养信息维护',
    'euthanasia': '安乐死处置',
    'ledger': '单据台账',
    'profile': '个人中心'
  },

  state: {
    currentPage: 'dashboard',
    receiveTab: 'pending',
    // 诊疗页三个子页签：flow（v5.1 三步流程）/ list（诊疗记录）/ quick（旧口径快速登记）
    treatmentTab: 'flow',
    materialTab: 'pending',
    ledgerTab: 'transfer',
    // 诊疗看板的筛选标签（第四十八轮五态）：
    // checking 待检 / pending_diagnose 待诊 / treating 诊疗中 /
    // pending_discharge 待出院 / discharged 已出院
    treatmentFilter: 'checking',
    // 出院模块的左侧子模块：adopt 领养 / dead 死亡（含安乐死）/ owner 领回 / release 放归
    dischargeTab: 'adopt',
    // 诊疗看板数据（`/api/business/treatments/board/` 的响应体）
    treatmentBoard: null,
    // 当前诊疗流程会话：{ detail, draft, step, maxStep, open }
    // 非空 = 正在看某只动物的流程；null = 停在看板
    treatmentFlow: null,
    treatmentPetId: null,
    // 首页看板「数据概览」的统计区间（任意起止）。空串 = 不限。
    dashStart: '',
    dashEnd: ''
  },

  /* ========== 初始化 ========== */
  init() {
    this.bindSidebarNav();
    TNR_UI.initPortalShell();
    this.navigate('dashboard');
  },

  bindSidebarNav() {
    const navItems = document.querySelectorAll('.portal-sidebar-nav .nav-item[data-nav]');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const page = item.dataset.nav;
        if (page) {
          navItems.forEach(x => x.classList.remove('active'));
          item.classList.add('active');
          this.navigate(page);
        }
      });
    });
  },

  navigate(pageId) {
    this.state.currentPage = pageId;
    document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + pageId);
    if (page) {
      page.classList.add('active');
      page.innerHTML = '<div class="loading-state">加载中...</div>';
    }
    const titleEl = document.querySelector('.portal-topbar-title');
    if (titleEl) titleEl.textContent = this.titles[pageId] || '';
    const renderer = this['render_' + pageId.replace(/-/g, '_')];
    if (renderer) renderer.call(this);
  },

  navigateTo(pageId) {
    const el = document.querySelector('.nav-item[data-nav="' + pageId + '"]');
    if (el) el.click();
  },

  /* ========== 辅助方法 ========== */
  currentUser() { return TNR_API.getCurrentUser(); },
  getHospitalId() { const u = this.currentUser(); return u ? u.institution_id : null; },
  getHospitalName() { const u = this.currentUser(); return u ? (u.institution_name || u.name) : ''; },

  /* ⚠ 一律委托公共实现，不要在这里再写第二份。
     原来这两处是**裸截断** `substr(0, 10)` / `substr(0, 16)` —— 而后端
     `serialize_instance` 对 `DateTimeField` 用 `isoformat()`，`USE_TZ=True` 下是
     **UTC 带偏移**（`2026-09-22T06:05:50+00:00`）。裸截断 = 直接显示 UTC：
     转运台账 / 诊疗详情的时间**差 8 小时**；UTC ≥ 16:00（本地已跨日）时**日期差一天**。
     公共实现走 `new Date()` 按浏览器本地时区换算，是对的。
     实测（TZ=Asia/Shanghai，输入 `2026-09-22T20:30:00+00:00`）：
       旧 `formatDateTime` → `2026-09-22 20:30`；公共 → `2026-09-23 04:30`。 */
  formatDate(iso) { return TNR_UI.formatDate(iso); },

  formatDateTime(iso) { return TNR_UI.formatDateTime(iso); },

  parsePetCodes(codes) {
    if (!codes) return [];
    if (Array.isArray(codes)) return codes;
    return String(codes).split(',').map(c => c.trim()).filter(Boolean);
  },

  escape(s) { return TNR_UI.escape(s); },

  transferStatusBadge(s) {
    const m = {'pending': ['待签收', 'badge-warning'], 'partial': ['部分签收', 'badge-info'], 'received': ['已签收', 'badge-success'], 'rejected': ['已驳回', 'badge-danger'], 'void': ['已撤回', 'badge-default']};
    const v = m[s] || [s, 'badge-default'];
    return '<span class="badge ' + v[1] + '">' + v[0] + '</span>';
  },

  treatmentStatusBadge(s) {
    const m = {'completed': ['已完成', 'badge-success'], 'in_progress': ['进行中', 'badge-info']};
    const v = m[s] || [s, 'badge-default'];
    return '<span class="badge ' + v[1] + '">' + v[0] + '</span>';
  },

  /* ========== 1. 首页看板 ========== */
  async render_dashboard() {
    try {
      const [transfers, pets, materials, txns, treatments, euthanasia] = await Promise.all([
        TNR_API.getTransfersStrict(),
        TNR_API.getHospitalPetsStrict(),
        TNR_API.getMaterialsStrict(),
        TNR_API.getMaterialTransactionsStrict(),
        TNR_API.getTreatmentsStrict(),
        TNR_API.getEuthanasiaStrict()
      ]);

      // 待签收 = pending + partial（部分签收的单还有剩余动物没到）
      const pendRecv = transfers.filter(t => t.status === 'pending' || t.status === 'partial').length;
      const pendTreat = pets.filter(p => p.status === 'in_treatment').length;
      const stockWarn = materials.filter(m => (m.hospital_stock || 0) <= (m.safety_stock || 0)).length;
      const pendAdopt = pets.filter(p => p.status === 'pending_adopt').length;
      const pendingDisp = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]'));

      const todoItems = [];
      transfers.filter(t => t.status === 'pending' || t.status === 'partial').forEach(t => {
        const done = this.parsePetCodes(t.received_codes).length;
        const total = t.pet_count || 0;
        todoItems.push({icon: '📥',
          title: (t.status === 'partial' ? '待续签转运单 ' : '待接收转运单 ') + (t.ledger_no || ''),
          desc: '来源：' + (t.from_shelter_name || '') + ' · '
            + (t.status === 'partial' ? '已签收 ' + done + '/' + total : total + '只动物'),
          nav: 'receive'});
      });
      pets.filter(p => p.status === 'in_treatment').forEach(p => {
        todoItems.push({icon: '🔬', title: '待诊疗：' + (p.code || ''), desc: (p.name || '') + ' · ' + (p.species || '') + ' · ' + (p.breed || ''), nav: 'treatment'});
      });
      pendingDisp.forEach(t => {
        todoItems.push({icon: '📦', title: '待接收物料：' + (t.material_name || ''), desc: '数量：' + (t.quantity || 0) + (t.unit || ''), nav: 'material'});
      });
      pets.filter(p => p.status === 'pending_adopt').forEach(p => {
        todoItems.push({icon: '🐾', title: '待领养资料维护：' + (p.code || ''), desc: (p.name || '') + ' · 请完善照片和简介', nav: 'adoption-info'});
      });

      /* —— 数据概览：带「统计区间」（任意起止）。
       *
       * 改动前这一页**完全没有时间维度**：4 张卡片全是「当前状态」计数，
       * 只增不减的任务数看不出「这周干了多少」。现在补一层按区间加总的业务量，
       * 原 4 张当前态卡片保留、并明确标注「不受统计区间影响」——
       * 两者混在一起而不标注，用户会以为「待接收」也是区间内的数字。
       *
       * ⚠ 卡片标题上的区间文字与下面的实际过滤**共用同一个 `win`**：
       * 两处各算一遍必然漂移，而漂移在界面上看不出来（标题写「最近一周」、
       * 数字却是全部时间）。 */
      const win = { start: this.state.dashStart || '', end: this.state.dashEnd || '' };
      const inR = (v) => TNR_UI.inDateRange(v, win.start, win.end);
      const rangeText = (win.start || win.end)
        ? ((win.start || '最早') + ' ~ ' + (win.end || '至今'))
        : '全部时间';
      // 交接单：有签收时间就按签收时间（「这段时间接收了多少」），否则退到创建时间。
      const recvInRange = transfers.filter(t => inR(t.received_at || t.created_at)).length;
      const treatInRange = treatments.filter(t => inR(t.created_at)).length;
      const consumeInRange = txns
        .filter(t => t.type === 'consume' && inR(t.date || t.created_at))
        .reduce((s, t) => s + (t.quantity || 0), 0);
      const euthInRange = euthanasia.filter(e => inR(e.euthanized_at || e.created_at)).length;

      let html = '';
      html += '<div class="card mb-4"><div class="card-header" style="flex-wrap:wrap;gap:var(--sp-2);">'
        + '<div class="card-title"><span class="card-title-bar"></span>数据概览</div>'
        + '<div class="flex gap-2" style="flex-wrap:wrap;align-items:center;">'
        + '<span class="fs-sm text-muted">开始日期</span>'
        + '<input type="date" class="form-input" id="hdashStart" style="width:auto;" value="' + win.start + '">'
        + '<span class="fs-sm text-muted">结束日期</span>'
        + '<input type="date" class="form-input" id="hdashEnd" style="width:auto;" value="' + win.end + '">'
        + '<button type="button" class="btn btn-secondary btn-sm" data-hdash-range="week">最近一周</button>'
        + '<button type="button" class="btn btn-secondary btn-sm" data-hdash-range="month">最近一月</button>'
        + '<button type="button" class="btn btn-secondary btn-sm" data-hdash-range="all">全部</button>'
        + '</div></div><div class="card-body">';
      html += '<div class="fs-sm text-muted mb-3">业务量统计区间：' + rangeText
        + '（下方「当前状态」为实时值，不受统计区间影响）</div>';
      html += '<div class="stat-grid">';
      html += '<div class="stat-card blue"><div class="stat-card-icon">📥</div><div><div class="stat-card-value">' + recvInRange + '</div><div class="stat-card-label">接收交接单（' + rangeText + '）</div></div></div>';
      html += '<div class="stat-card"><div class="stat-card-icon">🔬</div><div><div class="stat-card-value">' + treatInRange + '</div><div class="stat-card-label">诊疗记录（' + rangeText + '）</div></div></div>';
      html += '<div class="stat-card gold"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">' + consumeInRange + '</div><div class="stat-card-label">物料消耗（' + rangeText + '）</div></div></div>';
      html += '<div class="stat-card rouge"><div class="stat-card-icon">⚖️</div><div><div class="stat-card-value">' + euthInRange + '</div><div class="stat-card-label">安乐死处置（' + rangeText + '）</div></div></div>';
      html += '</div>';
      html += '</div></div>';

      html += '<div class="fs-sm text-muted mb-3">当前状态（实时值，不受统计区间影响）</div>';
      html += '<div class="stat-grid">';
      html += '<div class="stat-card"><div class="stat-card-icon">📥</div><div><div class="stat-card-value">' + pendRecv + '</div><div class="stat-card-label">待接收动物</div></div></div>';
      html += '<div class="stat-card blue"><div class="stat-card-icon">🔬</div><div><div class="stat-card-value">' + pendTreat + '</div><div class="stat-card-label">待诊疗任务</div></div></div>';
      html += '<div class="stat-card gold"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">' + stockWarn + '</div><div class="stat-card-label">库存预警</div></div></div>';
      html += '<div class="stat-card green"><div class="stat-card-icon">🐾</div><div><div class="stat-card-value">' + pendAdopt + '</div><div class="stat-card-label">待领养资料待维护</div></div></div>';
      html += '</div>';

      html += '<div class="dashboard-grid">';
      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待办任务</div></div><div class="card-body-flush">';
      if (todoItems.length === 0) {
        html += '<div class="empty-state" style="padding:var(--sp-8);"><div class="empty-state-icon">✓</div><div class="empty-state-text">暂无待办任务</div></div>';
      } else {
        todoItems.forEach(t => {
          html += '<div class="todo-item" data-todo="' + t.nav + '">';
          html += '<div class="todo-item-icon">' + t.icon + '</div>';
          html += '<div class="todo-item-content"><div class="todo-item-title">' + this.escape(t.title) + '</div><div class="todo-item-desc">' + this.escape(t.desc) + '</div></div>';
          html += '<span style="color:var(--ink-light);font-size:14px;">›</span></div>';
        });
      }
      html += '</div></div>';

      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>快捷操作</div></div><div class="card-body"><div class="quick-grid">';
      const actions = [
        {icon: '📥', label: '动物交接', page: 'receive'},
        {icon: '🔬', label: '诊疗操作', page: 'treatment'},
        {icon: '📦', label: '物料管理', page: 'material'},
        {icon: '🐾', label: '领养维护', page: 'adoption-info'},
        {icon: '📊', label: '单据台账', page: 'ledger'},
        {icon: '⚰️', label: '安乐死处置', page: 'euthanasia'}
      ];
      actions.forEach(a => {
        html += '<div class="quick-action" data-quick="' + a.page + '"><div class="quick-action-icon">' + a.icon + '</div><div class="quick-action-label">' + a.label + '</div></div>';
      });
      html += '</div></div></div>';
      html += '</div>';

      html += '<div class="card mt-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>库存概览</div></div><div class="card-body">';
      html += this.renderStockOverview(materials);
      html += '</div></div>';

      document.getElementById('page-dashboard').innerHTML = html;

      document.querySelectorAll('[data-todo]').forEach(el => {
        el.addEventListener('click', () => this.navigateTo(el.dataset.todo));
      });
      document.querySelectorAll('[data-quick]').forEach(el => {
        el.addEventListener('click', () => this.navigateTo(el.dataset.quick));
      });

      // ---- 数据概览：统计区间交互 ----
      const hFmt = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
        + '-' + String(d.getDate()).padStart(2, '0');
      document.querySelectorAll('#page-dashboard [data-hdash-range]').forEach(btn => {
        btn.addEventListener('click', () => {
          const today = new Date();
          const kind = btn.dataset.hdashRange;
          if (kind === 'all') {
            this.state.dashStart = '';
            this.state.dashEnd = '';
          } else {
            const days = kind === 'week' ? 6 : 29;
            this.state.dashStart = hFmt(new Date(today.getTime() - days * 86400000));
            this.state.dashEnd = hFmt(today);
          }
          this.render_dashboard();
        });
      });
      const hDashStartEl = document.getElementById('hdashStart');
      const hDashEndEl = document.getElementById('hdashEnd');
      const applyHDash = () => {
        this.state.dashStart = (hDashStartEl.value || '').trim();
        this.state.dashEnd = (hDashEndEl.value || '').trim();
        // 起止填反不静默变成 0 —— 明确提示，区间文字本身也会照原样显示。
        if (this.state.dashStart && this.state.dashEnd
            && this.state.dashStart > this.state.dashEnd) {
          TNR_UI.toast('开始日期晚于结束日期，该区间内不会有记录', 'warning');
        }
        this.render_dashboard();
      };
      [hDashStartEl, hDashEndEl].forEach(inp => {
        if (!inp) return;
        inp.addEventListener('change', applyHDash);
        inp.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') { ev.preventDefault(); applyHDash(); }
        });
      });
    } catch (e) {
      document.getElementById('page-dashboard').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div><div class="empty-state-desc">' + this.escape(e.message) + '</div></div>';
    }
  },

  renderStockOverview(materials) {
    return materials.map(m => {
      const stock = m.hospital_stock || 0;
      const safety = m.safety_stock || 1;
      const pct = Math.min(100, (stock / (safety * 2)) * 100);
      const isLow = stock < safety;
      const color = isLow ? 'var(--rouge)' : (stock < safety * 1.5 ? 'var(--autumn-gold)' : 'var(--bamboo-green)');
      return '<div style="display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-faint);">' +
        '<div style="flex:1;"><div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px;">' +
        '<span style="font-weight:500;">' + this.escape(m.name) + '</span>' +
        '<span class="badge ' + (isLow ? 'badge-danger' : 'badge-default') + '">' + TNR_API.getMaterialCategoryText(m.category) + '</span>' +
        (isLow ? '<span class="badge badge-danger">库存不足</span>' : '') + '</div>' +
        '<div class="stock-bar"><div class="stock-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div></div>' +
        '<div style="text-align:right;min-width:100px;"><div style="font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;color:' + color + ';">' + stock +
        '<span style="font-size:var(--fs-sm);color:var(--ink-muted);font-weight:400;"> / ' + safety + (m.unit || '') + '</span></div>' +
        '<div style="font-size:var(--fs-xs);color:var(--ink-light);">当前 / 安全库存</div></div></div>';
    }).join('');
  },

  /* ========== 2. 动物交接管理 ========== */
  async render_receive() {
    try {
      const transfers = await TNR_API.getTransfersStrict();
      // 「待签收」= pending + partial：部分签收的单还有剩余动物没到，
      // 仍然要出现在待办里，否则医院会以为这张单已经处理完了。
      const pend = transfers.filter(t => t.status === 'pending' || t.status === 'partial').length;
      const recv = transfers.filter(t => t.status === 'received').length;
      const rej = transfers.filter(t => t.status === 'rejected').length;
      const vd = transfers.filter(t => t.status === 'void').length;

      let html = '<div class="tabs">' +
        '<div class="tab-item ' + (this.state.receiveTab === 'pending' ? 'active' : '') + '" data-rtab="pending">待签收 (' + pend + ')</div>' +
        '<div class="tab-item ' + (this.state.receiveTab === 'received' ? 'active' : '') + '" data-rtab="received">已签收 (' + recv + ')</div>' +
        '<div class="tab-item ' + (this.state.receiveTab === 'rejected' ? 'active' : '') + '" data-rtab="rejected">已驳回 (' + rej + ')</div>' +
        '<div class="tab-item ' + (this.state.receiveTab === 'void' ? 'active' : '') + '" data-rtab="void">已撤回 (' + vd + ')</div>' +
        '</div>' +
        // 四个状态标签页共用一条筛选条，位置紧跟 .tabs（CSS 里 .tabs 钉 top:0、.filter-bar 钉 top:46px）。
        TNR_UI.renderFilterBar([
          { key: 'keyword', label: '搜索', type: 'search', placeholder: '交接单号 / 宠物编号 / 来源捕捉点' },
          { key: 'start_date', label: '开始日期', type: 'date' },
          { key: 'end_date', label: '结束日期', type: 'date' }
        ], '', { id: 'receiveFilterBar' }) +
        '<div id="receiveTabContent"></div>';

      document.getElementById('page-receive').innerHTML = html;

      document.querySelectorAll('#page-receive [data-rtab]').forEach(el => {
        el.addEventListener('click', () => {
          this.state.receiveTab = el.dataset.rtab;
          document.querySelectorAll('#page-receive .tab-item').forEach(t => {
            t.classList.toggle('active', t.dataset.rtab === this.state.receiveTab);
          });
          this.renderReceiveTab(transfers);
        });
      });

      this._receiveCache = transfers;
      this.renderReceiveTab(transfers);
      TNR_UI.bindFilter(() => this.renderReceiveTab(this._receiveCache || []),
        document.getElementById('page-receive'));
    } catch (e) {
      document.getElementById('page-receive').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async renderReceiveTab(allTransfers) {
    const tab = this.state.receiveTab;
    // 「待签收」包含部分签收的单：还剩动物没到，仍是待办。
    const transfers = allTransfers.filter(t => tab === 'pending'
      ? (t.status === 'pending' || t.status === 'partial')
      : t.status === tab);
    const c = document.getElementById('receiveTabContent');
    if (!c) return;

    if (transfers.length === 0) {
      const labels = {pending: '待签收', received: '已签收', rejected: '已驳回', void: '已撤回'};
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">暂无数据</div><div class="empty-state-desc">暂无' + (labels[this.state.receiveTab] || '') + '的交接单</div></div>';
      return;
    }

    let pets = [];
    try { pets = await TNR_API.getHospitalPets(); } catch(e) { pets = []; }

    const rows = transfers.map(t => {
      const codes = this.parsePetCodes(t.pet_codes);
      const petInfo = codes.map(code => {
        const p = pets.find(x => x.code === code);
        if (!p) return '<div style="display:flex;align-items:center;gap:var(--sp-2);padding:4px 0;"><div class="photo-placeholder">🐾</div><div><div style="font-weight:500;">' + this.escape(code) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">未知</div></div></div>';
        return '<div style="display:flex;align-items:center;gap:var(--sp-2);padding:4px 0;"><div class="photo-placeholder">🐾</div><div><div style="font-weight:500;">' + this.escape(p.code) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + this.escape(p.name || '') + ' · ' + this.escape(p.species || '') + ' · ' + this.escape(p.breed || '') + ' · ' + this.escape(p.gender || '') + '</div></div></div>';
      }).join('');

      // 所有状态统一「查看详情」——签收 / 驳回 / 部分签收都在详情里做。
      // 原先行内直接给「确认签收」按钮，医院看不到这单到底送来了几只、
      // 分别是谁，只能凭单号盲签；部分签收更是不可能（只有整单一个动作）。
      const actions = '<button class="btn btn-secondary btn-sm" data-detail="' + t.id + '">查看详情</button>'
        + (t.status === 'pending' || t.status === 'partial'
          ? '<button class="btn btn-success btn-sm" data-detail-go="' + t.id + '">去签收</button>' : '');

      const doneCount = this.parsePetCodes(t.received_codes).length;
      const totalCount = this.parsePetCodes(t.pet_codes).length || t.pet_count || 0;
      const statusCell = this.transferStatusBadge(t.status)
        + (t.status === 'partial'
          ? '<div class="fs-sm text-muted">已签收 ' + doneCount + '/' + totalCount + '</div>' : '');

      return {
        _ledger: '<div style="font-weight:500;">' + this.escape(t.ledger_no || '') + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">' + this.formatDateTime(t.created_at) + '</div>',
        ledger_no: t.ledger_no || '',
        created_at: t.created_at,
        petInfo: petInfo || '<span class="text-muted">—</span>',
        from_shelter_name: t.from_shelter_name || '',
        pet_count: t.pet_count || 0,
        pet_count_num: t.pet_count || 0,
        status: statusCell,
        status_raw: t.status,
        _actions: '<div class="flex gap-2">' + actions + '</div>',
      };
    });

    const bar = document.getElementById('receiveFilterBar');
    const v = TNR_UI.getFilterValues(bar);
    const shown = rows.filter(r => {
      // ⚠ `created_at` 是 DateTimeField，后端序列化成 **UTC 带偏移**的串；
      // 统一交给 `TNR_UI.inDateRange` 按**本地日期**比较（裸 `.slice(0,10)` 会把
      // 北京时间 00:00–08:00 的记录算到前一天）。
      if (!TNR_UI.inDateRange(r.created_at, v.start_date, v.end_date)) return false;
      if (!v.keyword) return true;
      // 行是映射后的展示结构（含 HTML 片段），逐字段拼 haystack，避免漏列。
      return Object.keys(r).map(k => r[k]).join(' ').toLowerCase().includes(v.keyword);
    });

    TNR_UI.mountTable(c, { id: 'hospital.receive', columns: [
        { title: '交接单号', key: '_ledger', sortable: false },
        { title: '宠物信息', key: 'petInfo', sortable: false },
        { title: '来源捕捉点', key: 'from_shelter_name' },
        { title: '数量', key: 'pet_count_num', align: 'center' },
        { title: '状态', key: 'status', sortable: false },
        { title: '操作', key: '_actions', sortable: false },
      ], data: shown, emptyText: '暂无待交接动物' });

    TNR_UI.delegateClick(c, {
      'data-detail': (id) => this.viewTransferDetail(id),
      'data-detail-go': (id) => this.viewTransferDetail(id),
    });
  },

  /* 交接单详情：先看清「送来了什么」，再决定签收多少。
     列表页的行内只有单号与数量，医院没法据此判断该不该签 —— 实际到货
     可能少几只、也可能多了只没登记的病猫。详情里逐只列出（带档案信息与
     签收状态），勾选本次实际收到的即可**部分签收**。 */
  async viewTransferDetail(transferId) {
    const all = this._receiveCache || [];
    const t = all.find(x => String(x.id) === String(transferId));
    if (!t) { TNR_UI.toast('交接单不存在或列表已刷新，请重试', 'warning'); return; }
    let pets = [];
    try { pets = await TNR_API.getHospitalPets(); } catch (e) { pets = []; }

    const codes = this.parsePetCodes(t.pet_codes);
    const doneCodes = this.parsePetCodes(t.received_codes);
    const canSign = t.status === 'pending' || t.status === 'partial';
    const pendingCount = codes.length - doneCodes.length;

    const rows = codes.map(code => {
      const p = pets.find(x => x.code === code) || {};
      const isDone = doneCodes.indexOf(code) >= 0;
      const meta = [p.name, p.species, p.breed, p.gender]
        .filter(Boolean).map(x => this.escape(x)).join(' · ') || '档案信息待补全';
      return '<label class="xfer-pet' + (isDone ? ' on' : '') + '">'
        + '<input type="checkbox" data-code="' + this.escape(code) + '"'
        + (isDone || !canSign ? ' disabled' : '') + (isDone ? ' checked' : '') + '>'
        + '<div class="xfer-ph">🐾</div>'
        + '<div class="xfer-info"><div class="xfer-code">' + this.escape(code) + '</div>'
        + '<div class="xfer-meta">' + meta + '</div></div>'
        + (isDone ? '<span class="badge badge-success">已签收</span>'
                  : '<span class="badge badge-warning">待签收</span>')
        + '</label>';
    }).join('');

    const info = '<div class="tx-kv" style="margin-bottom:12px;">'
      + '<div><div class="k">交接单号</div><div class="v">' + this.escape(t.ledger_no || '—') + '</div></div>'
      + '<div><div class="k">来源捕捉点</div><div class="v">' + this.escape(t.from_shelter_name || '—') + '</div></div>'
      + '<div><div class="k">接收医院</div><div class="v">' + this.escape(t.to_hospital_name || '—') + '</div></div>'
      + '<div><div class="k">发出时间</div><div class="v">' + this.formatDateTime(t.created_at) + '</div></div>'
      + '<div><div class="k">状态</div><div class="v">' + this.transferStatusBadge(t.status) + '</div></div>'
      + '<div><div class="k">动物数量</div><div class="v">' + codes.length + ' 只（已签收 ' + doneCodes.length + '）</div></div>'
      + '</div>'
      + (t.note ? '<div class="tx-tip inf"><span>📝</span><div>备注：' + this.escape(t.note) + '</div></div>' : '')
      + (t.status === 'rejected' ? '<div class="tx-tip wrn"><span>⚠</span><div>驳回理由：' + this.escape(t.reject_reason || '—') + '</div></div>' : '')
      + (t.status === 'void' ? '<div class="tx-tip wrn"><span>⚠</span><div>捕捉点已撤回该交接单。</div></div>' : '');

    TNR_UI.modal({
      title: '交接单详情 · ' + this.escape(t.ledger_no || ''),
      size: 'lg',
      body: info
        + '<div class="xfer-head"><span>动物清单</span>'
        + (canSign ? '<span class="text-muted fs-sm">勾选本次实际收到的动物，可以只签收一部分</span>' : '')
        + '</div>'
        + '<div class="xfer-list">' + (rows || '<div class="tx-empty">本单没有动物</div>') + '</div>',
      actions: canSign
        ? '<button class="btn btn-secondary" data-action="close">取消</button>'
          + (pendingCount > 0
            ? '<button class="btn btn-danger" id="xferRejectBtn">驳回剩余 ' + pendingCount + ' 只</button>' : '')
          + '<button class="btn btn-success" id="xferSignBtn" disabled>请勾选要签收的动物</button>'
        : '<button class="btn btn-primary" data-action="close">关闭</button>',
      onShow: (overlay) => {
        // ⚠ `TNR_UI.modal` 的 `onShow(overlay)` **不传** closeFn，
        // 这里自己拿「关闭」按钮来收口（直接 `overlay.remove()` 会留下
        // 未解绑的 Esc 监听，多开几次详情就叠一堆）。
        const closeModal = () => {
          const btn = overlay.querySelector('[data-action="close"]');
          if (btn) btn.click(); else overlay.remove();
        };
        const signBtn = overlay.querySelector('#xferSignBtn');
        const rejectBtn = overlay.querySelector('#xferRejectBtn');
        const boxes = Array.prototype.slice.call(overlay.querySelectorAll('input[data-code]'));
        const sync = () => {
          if (!signBtn) return;
          const n = boxes.filter(b => b.checked && !b.disabled).length;
          signBtn.disabled = n === 0;
          signBtn.textContent = n ? '确认签收已选 ' + n + ' 只' : '请勾选要签收的动物';
        };
        boxes.forEach(b => b.addEventListener('change', sync));
        sync();
        if (signBtn) signBtn.onclick = () => {
          const picked = boxes.filter(b => b.checked && !b.disabled)
            .map(b => b.dataset.code);
          if (!picked.length) { TNR_UI.toast('请至少勾选一只动物', 'warning'); return; }
          closeModal();
          this.confirmReceive(t.id, picked);
        };
        if (rejectBtn) rejectBtn.onclick = () => {
          closeModal();
          this.rejectTransfer(t.id);
        };
      }
    });
  },

  async confirmReceive(transferId, codes) {
    const n = (codes || []).length;
    TNR_UI.confirm('确认签收选中的 ' + n + ' 只动物？签收后它们将变更为「待诊疗」，'
      + '本单未勾选的动物仍留在待签收。', '确认签收').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.receiveTransfer(transferId, codes);
        if (res.success) {
          TNR_UI.toast(res.message || '签收成功，宠物已进入待诊疗状态', 'success');
          this.render_receive();
        } else {
          TNR_UI.toast(res.message || '签收失败', 'danger');
        }
      } catch (e) {
        TNR_UI.toast(e.message || '操作失败', 'danger');
      }
    });
  },

  rejectTransfer(transferId) {
    TNR_UI.modal({
      title: '驳回转运单',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="form-group"><label class="form-label">驳回理由<span class="req">*</span></label><textarea class="form-textarea" id="rejectReasonInput" placeholder="请填写驳回理由" required></textarea></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-danger" id="confirmRejectBtn">确认驳回</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#confirmRejectBtn').onclick = async () => {
          const r = bodyEl.querySelector('#rejectReasonInput').value.trim();
          if (!r) { TNR_UI.toast('请填写驳回理由', 'warning'); return; }
          try {
            const res = await TNR_API.rejectTransfer(transferId, r);
            if (res.success) {
              TNR_UI.toast('已驳回该转运单', 'success');
              closeFn();
              this.render_receive();
            } else {
              TNR_UI.toast(res.message || '驳回失败', 'danger');
            }
          } catch (e) {
            TNR_UI.toast(e.message || '操作失败', 'danger');
          }
        };
      }
    });
  },

  viewRejectReason(transferId, transfers) {
    const t = transfers.find(x => String(x.id) === String(transferId));
    TNR_UI.modal({
      title: '驳回理由',
      body: '<div style="padding:var(--sp-3);background:var(--rouge-light);border-radius:var(--r-md);font-size:var(--fs-md);color:var(--ink-text);line-height:1.8;">' + this.escape(t ? (t.reject_reason || '无') : '无') + '</div>',
      actions: '<button class="btn btn-primary" data-modal-close>关闭</button>'
    });
  },

  /* ========== 3. 诊疗业务管理（第四十七轮 v5.2 三步流程） ==========
   *
   * 两个子页签：
   *   flow —— v5.2 口径：看板（待接诊 / 诊疗中 / 诊疗完毕）→ 点动物进三步流程
   *   list —— 诊疗记录（原有列表，保留）
   *
   * ⚠ 第四十七轮删掉了旧口径「快速登记」页签（一次性提交整单并当场扣库存，
   *   字段口径与 v5.1 三步流程不一致）。删之前先把它的**唯一独有价值** ——
   *   绝育手术病历（手术日期 / 主刀 / 麻醉 / 诊断 / 手术过程 / 恢复）——
   *   并进了三步流程的「绝育」项目卡片；`treatment_create` 接口一并移除，
   *   否则会变成「接口存在、界面没接」的半截功能。病历的读写现在统一走
   *   `services_treatment.save_sterilization()`。
   *
   * 事件一律走 `TNR_UI.delegateClick`（绑在 `#page-treatment` 这个**稳定容器**上）：
   * 视图每次都是整体重渲染 `innerHTML`，直接绑在子节点上的监听器会随旧节点一起
   * 被丢弃，表现为「点按钮没反应，且控制台干干净净」。
   */
  async render_treatment() {
    const page = document.getElementById('page-treatment');
    const TABS = [['flow', '诊疗流程'], ['list', '诊疗记录']];
    page.innerHTML = '<div class="sub-tabs">' + TABS.map(([k, t]) =>
      '<div class="sub-tab ' + (this.state.treatmentTab === k ? 'active' : '') +
      '" data-act="ttab" data-v="' + k + '">' + t + '</div>').join('') +
      '</div><div id="treatmentContent"></div>';

    TNR_UI.delegateClick(page, { 'data-act': (v, el) => this.onTreatmentAct(v, el) }, 'treatment');
    this.bindTreatmentInputs(page);
    this.renderTreatmentContent();
  },

  renderTreatmentContent() {
    if (this.state.treatmentTab === 'list') this.renderTreatmentList();
    else this.renderTreatmentFlow();
  },

  /* 输入事件同样要委托。
     处置项目卡里的日期 / 芯片号 / 备注是**边输边存**的，而卡片会被
     `refreshItemCard()` 局部重建 —— 每次重建都重绑一遍必然漏掉某条路径，
     漏掉的表现是「改了值，保存时还是旧的」，且不报错。 */
  bindTreatmentInputs(page) {
    if (this._txInputBound) return;
    this._txInputBound = true;
    const handler = (e) => this.onTreatmentInput(e.target);
    page.addEventListener('input', handler);
    page.addEventListener('change', handler);
  },

  /* ==================== 诊疗看板 ==================== */
  async renderTreatmentFlow() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    if (this.state.treatmentFlow) { this.renderFlowView(); return; }
    c.innerHTML = '<div class="loading-state">加载中...</div>';
    try {
      // 两条都是**严格读**（失败抛错）。用静默读的话，403/500 会被渲染成
      // 「该分类下暂无动物」—— 把「加载失败」伪装成「没有数据」，
      // 操作员会以为真的没病人。
      const [board, materials] = await Promise.all([
        TNR_API.getTreatmentBoard(),
        TNR_API.getMaterialsStrict()
      ]);
      this.state.treatmentBoard = board;
      this._txMaterials = materials || [];
      this.renderBoard();
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div>'
        + '<div class="empty-state-text">诊疗看板加载失败</div>'
        + '<div class="empty-state-desc">' + this.escape(e.message || '请稍后重试') + '</div></div>';
    }
  },

  txBoardRows(kind) {
    const board = this.state.treatmentBoard || {};
    return board[kind] || [];
  },

  txStageBadge(row) {
    const stage = row.board_stage || (
      row.is_disposed ? 'discharged'
        : (row.done_at ? 'pending_discharge'
          : (row.diagnosed_at ? 'treating'
            : (row.checked_at ? 'pending_diagnose' : 'checking'))));
    const map = {
      checking: ['待检', 'badge-warning'],
      pending_diagnose: ['待诊', 'badge-info'],
      treating: ['诊疗中', 'badge-info'],
      pending_discharge: ['待出院', 'badge-warning'],
      discharged: ['已出院', 'badge-success']
    };
    const m = map[stage] || [stage, 'badge-default'];
    return '<span class="badge ' + m[1] + '">' + m[0] + '</span>'
      + (stage === 'discharged' && row.disposal_label
        ? '<div class="fs-sm text-muted">' + this.escape(row.disposal_label) + '</div>' : '');
  },

  renderBoard() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    // 五态（与后端 `_board_stage()` 一一对应）
    const FILTERS = [
      { k: 'checking', t: '待检', tip: '已交接、尚未提交检查单' },
      { k: 'pending_diagnose', t: '待诊', tip: '检查已提交、尚未下诊断' },
      { k: 'treating', t: '诊疗中', tip: '已下诊断、尚未治疗完成' },
      { k: 'pending_discharge', t: '待出院', tip: '诊疗完成、等待办结出院' },
      { k: 'discharged', t: '已出院', tip: '已办结出院' }
    ];
    let html = '<div class="tx-filter-tabs">';
    FILTERS.forEach(f => {
      html += '<button class="tx-ft ' + (this.state.treatmentFilter === f.k ? 'active' : '') + '"'
        + ' data-act="tx-filter" data-v="' + f.k + '" title="' + this.escape(f.tip) + '">'
        + f.t + ' <span class="cnt">' + this.txBoardRows(f.k).length + '</span></button>';
    });
    html += '<button class="btn btn-sm btn-secondary" data-act="tx-refresh"'
      + ' style="margin-left:auto;flex:none;">刷新</button></div>';

    // 统一布局（第四十八轮）：**左侧状态模块 + 右侧搜索条件 + 列表**。
    // 搜索条与表格容器的顺序不能反 —— 先写进 DOM 再 mountTable，
    // 否则选择器查不到元素，表格会静默不渲染。
    html += TNR_UI.renderFilterBar([
      { key: 'keyword', label: '搜索', type: 'search', placeholder: '宠物编号 / 名称 / 品种 / 转运单' },
      { key: 'start_date', label: '入院开始', type: 'date' },
      { key: 'end_date', label: '入院结束', type: 'date' }
    ], '', { id: 'txBoardFilterBar' });
    html += '<div id="txBoardTable"></div>';
    c.innerHTML = html;

    this.renderBoardTable();
    TNR_UI.bindFilter(() => this.renderBoardTable(), c);
  },

  renderBoardTable() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    const rows = this.txBoardRows(this.state.treatmentFilter);
    const bar = document.getElementById('txBoardFilterBar');
    const v = TNR_UI.getFilterValues(bar);
    const shown = rows.filter(r => {
      // `receive_date` 是纯日期串（`_intake_info` 已 isoformat），
      // 与筛选条的 YYYY-MM-DD 同口径，不需要再走时区换算。
      if (!TNR_UI.inDateRange(r.receive_date, v.start_date, v.end_date)) return false;
      if (!v.keyword) return true;
      return [r.pet_code, r.pet_name, r.species, r.breed, r.transfer_no, r.shelter]
        .join(' ').toLowerCase().indexOf(v.keyword) !== -1;
    });

    // 每个状态对应**唯一一个**操作 —— 用户不用猜「这一步该点哪个按钮」。
    const ACTION = {
      checking: ['检查', 'check'],
      pending_diagnose: ['诊断', 'diagnose'],
      treating: ['治疗', 'treat'],
      pending_discharge: ['出院', 'discharge'],
      discharged: ['查看', 'view']
    };
    const data = shown.map(r => {
      const act = ACTION[r.board_stage] || ['查看', 'view'];
      const attr = [r.species, r.gender, r.breed, r.color]
        .filter(Boolean).map(x => this.escape(x)).join(' · ') || '—';
      return {
        _pet: '<div style="font-weight:500;">' + this.escape(r.pet_code) + ' · '
          + this.escape(r.pet_name || '未命名') + '</div>'
          + '<div class="fs-sm text-muted">' + attr + '</div>',
        _intake: '<div>' + this.escape(r.transfer_no || '—') + '</div>'
          + '<div class="fs-sm text-muted">' + this.escape(r.shelter || '—') + ' · '
          + (r.receive_date ? this.formatDate(r.receive_date) : '—') + '</div>',
        _status: this.txStageBadge(r),
        _actions: '<button class="btn btn-sm '
          + (r.board_stage === 'discharged' ? 'btn-secondary' : 'btn-primary') + '"'
          + ' data-txact="' + act[1] + '" data-v="' + r.pet_id + '"'
          + ' data-tid="' + (r.treatment_id || '') + '">' + act[0] + '</button>',
        pet_code: r.pet_code,
        pet_name: r.pet_name || '',
        receive_date: r.receive_date || '',
      };
    });

    TNR_UI.mountTable('#txBoardTable', {
      id: 'hospital.treatment.board',
      columns: [
        { title: '动物', key: '_pet', sortable: false },
        { title: '来源 / 入院', key: '_intake', sortable: false },
        { title: '状态', key: '_status', sortable: false },
        { title: '操作', key: '_actions', sortable: false, align: 'right' },
      ],
      data: data,
      emptyText: '该状态下暂无动物'
    });

    TNR_UI.delegateClick(c, {
      'data-txact': (kind, el) => this.onTxRowAction(kind, el)
    });
  },

  onTxRowAction(kind, el) {
    const petId = el.dataset.v;
    const tid = el.dataset.tid || '';
    if (kind === 'discharge') { this.openDischargeChoice(petId, tid); return; }
    const step = { check: 1, diagnose: 2, treat: 3 }[kind] || undefined;
    this.openTreatmentFlow(petId, tid, step);
  },

  /* ==================== 出院（第四十八轮） ====================
   * 四类去向：领养 / 死亡（含安乐死）/ 领回 / 放归。
   *
   * 流程顺序是**先开单据、再办结诊疗单**，不能反过来：
   * 单据接口都要求动物还在院（`in_treatment` / `pending_adopt`），
   * 先办结会把它改成终态，单据立刻 400「当前状态不可办理」。
   *
   * 办结诊疗单时一律 `defer_pet_status: true` —— 动物状态由**单据**接管。
   * 否则：
   *   - 领养单刚把动物置成 `pending_claim`（待领出），办结又写成
   *     `pending_adopt`（待领养），动物会「回到待领养」；
   *   - 放归单是两段流程（转运回小区 → 放归回捕捉地），办结就写
   *     `released` 会让还在车上的动物在台账上已经「已放归」。
   */
  openDischargeChoice(petId, tid) {
    const OPTS = [
      { k: 'adopt', ic: '🏠', n: '领养', d: '开具领养单，动物由领养人领走' },
      { k: 'dead', ic: '🕯️', n: '死亡（含安乐死）', d: '安乐死，或死亡后的无害化处理' },
      { k: 'owner', ic: '🔁', n: '领回', d: '主人到场认领并领回' },
      { k: 'release', ic: '🌿', n: '放归', d: '先转运回原小区，再放归回捕捉地' }
    ];
    TNR_UI.modal({
      title: '办理出院 · 选择去向',
      size: 'lg',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="dsp-choice">' + OPTS.map(o =>
          '<button type="button" class="dsp-opt" data-dsp="' + o.k + '">'
          + '<span class="ic">' + o.ic + '</span>'
          + '<span class="tx"><b>' + o.n + '</b><i>' + o.d + '</i></span>'
          + '<span class="go">›</span></button>').join('') + '</div>';
        bodyEl.querySelectorAll('[data-dsp]').forEach(btn => {
          btn.onclick = () => {
            closeFn();
            this.openDischargeForm(btn.dataset.dsp, petId, tid);
          };
        });
      }
    });
  },

  openDischargeForm(kind, petId, tid) {
    const DEF = {
      adopt: {
        title: '开具领养单',
        hint: '保存后立即确认领出，动物状态变为「已领养」。',
        fields: [
          { k: 'adopter_name', l: '领养人姓名', req: true },
          { k: 'adopter_phone', l: '联系电话', req: true },
          { k: 'adopter_id_card', l: '身份证号' },
          { k: 'adopter_address', l: '住址', full: true },
          { k: 'adopted_at', l: '领养日期', type: 'date' }
        ]
      },
      dead: {
        title: '死亡 / 安乐死登记',
        hint: '安乐死与「死亡 / 无害化」是两种处置方式，台账分开记。',
        chips: { k: 'kind', l: '处置方式', opts: [['euthanasia', '安乐死'], ['dead', '死亡 / 无害化']] },
        fields: [
          { k: 'reason', l: '原因', req: true, full: true },
          { k: 'condition', l: '动物状况', full: true },
          { k: 'euthanized_at', l: '处置日期', type: 'date' }
        ]
      },
      owner: {
        title: '主人领回',
        hint: '核对主人身份与联系方式后办理；领回后动物状态变为「已领回」。',
        fields: [
          { k: 'owner_name', l: '主人姓名', req: true },
          { k: 'owner_phone', l: '联系电话' },
          { k: 'owner_id_card', l: '身份证号' },
          { k: 'owner_address', l: '住址', full: true },
          { k: 'reason', l: '领回原因', full: true },
          { k: 'return_time', l: '领回时间', type: 'date' }
        ]
      },
      release: {
        title: '发起放归',
        hint: '放归分两段：医院先把动物「转运回原小区」，再由小区接收人确认'
          + '「放归回捕捉地」。小区名称可留空 —— 系统按捕捉单登记的小区自动带出。',
        fields: [
          { k: 'community_name', l: '原小区名称（留空自动带出）', full: true },
          { k: 'receiver_name', l: '小区接收人' },
          { k: 'receiver_phone', l: '接收人电话' }
        ]
      }
    }[kind];
    if (!DEF) return;

    const chipsHTML = DEF.chips
      ? '<div class="dsp-fld full"><label>' + DEF.chips.l + '<span class="req">*</span></label>'
        + '<div class="dsp-chips" data-f="' + DEF.chips.k + '">'
        + DEF.chips.opts.map(([v, t], i) =>
          '<span class="' + (i === 0 ? 'on' : '') + '" data-v="' + v + '">' + t + '</span>').join('')
        + '</div></div>'
      : '';
    const fieldsHTML = DEF.fields.map(f =>
      '<div class="dsp-fld' + (f.full ? ' full' : '') + '">'
      + '<label>' + f.l + (f.req ? '<span class="req">*</span>' : '') + '</label>'
      + '<input class="form-input" type="' + (f.type === 'date' ? 'date' : 'text') + '"'
      + ' data-f="' + f.k + '">'
      + '</div>').join('');

    TNR_UI.modal({
      title: DEF.title,
      size: 'lg',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="tx-tip inf"><span>ℹ</span><div>' + DEF.hint + '</div></div>'
          + '<div class="dsp-form">' + chipsHTML + fieldsHTML + '</div>'
          + '<div class="dsp-actions">'
          + '<button type="button" class="btn btn-secondary" data-close>取消</button>'
          + '<button type="button" class="btn btn-primary" id="dspSubmit">确认办理</button>'
          + '</div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelectorAll('.dsp-chips span').forEach(sp => {
          sp.onclick = () => {
            sp.parentElement.querySelectorAll('span').forEach(x => x.classList.remove('on'));
            sp.classList.add('on');
          };
        });
        bodyEl.querySelector('#dspSubmit').onclick = () => {
          const payload = {};
          bodyEl.querySelectorAll('[data-f]').forEach(el => {
            payload[el.dataset.f] = (el.value || '').trim();
          });
          const chip = bodyEl.querySelector('.dsp-chips span.on');
          if (chip) payload[chip.parentElement.dataset.f] = chip.dataset.v;
          for (const f of (DEF.fields || [])) {
            if (f.req && !payload[f.k]) {
              TNR_UI.toast('请填写「' + f.l + '」', 'warning');
              return;
            }
          }
          closeFn();
          this.submitDischarge(kind, petId, tid, payload);
        };
      }
    });
  },

  async submitDischarge(kind, petId, tid, payload) {
    const body = Object.assign({ pet_id: Number(petId) }, payload);
    try {
      let res;
      if (kind === 'adopt') {
        res = await TNR_API.registerAdoption(body);
        TNR_UI.assertOk(res, '开具领养单失败');
        // 医院现场出院 = 领养人当场领走，直接确认领出。
        const claim = await TNR_API.confirmAdoptionClaim(res.data.id, {});
        TNR_UI.assertOk(claim, '领养单已开，但确认领出失败');
      } else if (kind === 'dead') {
        res = await TNR_API.createEuthanasia(body);
        TNR_UI.assertOk(res, '登记失败');
      } else if (kind === 'owner') {
        res = await TNR_API.createOwnerReturn(body);
        TNR_UI.assertOk(res, '办理领回失败');
      } else {
        res = await TNR_API.createRelease(body);
        TNR_UI.assertOk(res, '发起放归失败');
      }

      // 办结诊疗单：只记去向，动物状态交给单据（见上面的说明）
      if (tid) {
        const disposal = {
          adopt: 'pending_adopt',
          dead: payload.kind === 'dead' ? 'dead' : 'euthanized',
          owner: 'owner_returned',
          release: 'released'
        }[kind];
        const disposed = await TNR_API.treatmentDispose(tid, disposal, { defer_pet_status: true });
        TNR_UI.assertOk(disposed, '单据已开，但办结诊疗单失败');
      }

      TNR_UI.toast('出院办理成功', 'success');
      /* 刷新**当前所在的页面**：同一个表单既能从诊疗看板（待出院行）打开，
         也能从出院管理页打开。写死 `render_treatment()` 会让出院页上的
         操作完成后跳到诊疗页 —— 用户点了「办理领养」，结果被弹回诊疗看板。 */
      if (this.state.currentPage === 'discharge') {
        this.render_discharge();
      } else if (this.state.treatmentFlow) {
        this.state.treatmentFlow = null;
        this.renderTreatmentFlow();
      } else {
        this.render_treatment();
      }
    } catch (e) {
      TNR_UI.toast(e.message || '办理失败', 'danger');
    }
  },

  /* ==================== 三步流程 ==================== */
  /* 点看板动物进流程。
     `treatmentId` 有值时直接开**那张**单（看板行自带 tid，已办结的单也能查看）；
     没有（孤儿宠物，尚未开单）才走 `openTreatment()` 现场新建。 */
  async openTreatmentFlow(petId, treatmentId, step) {
    const c = document.getElementById('treatmentContent');
    if (c) c.innerHTML = '<div class="loading-state">正在进入诊疗流程...</div>';
    try {
      let detail;
      if (treatmentId) {
        // ⚠ `getData` 已经解包（返回 `data.data`），失败会 throw —— 不能再查
        // `res.success`，那永远是 undefined，会把正常响应误判成失败。
        detail = await TNR_API.getData('/api/business/treatments/' + treatmentId + '/');
      } else {
        const res = await TNR_API.openTreatment(petId);
        // `_post` 失败**不抛异常**（业务错误是 200 + success:false），
        // 不过一遍 assertOk 的话 catch 是死代码，界面会谎报成功。
        TNR_UI.assertOk(res, '进入诊疗流程失败');
        detail = res.data;
      }
      // `step` = 从列表行「检查 / 诊断 / 治疗」直接落到对应步骤；
      // 不传时按 stage 派生（已出院 → 1，只读查看）。
      this.startTreatmentFlow(detail, step);
    } catch (e) {
      TNR_UI.toast(e.message || '进入诊疗流程失败', 'danger');
      this.state.treatmentFlow = null;
      this.renderTreatmentFlow();
    }
  },

  /* 用服务端返回的诊疗单详情重建本地草稿。
     `stepOverride` 用于「保存后停在原步骤」/「提交后前进到下一步」；
     不传时按 `stage` 派生（checking→1 / treating→2 / done→3）。 */
  startTreatmentFlow(detail, stepOverride) {
    if (!detail) return;
    const pet = detail.pet || {};
    const draft = {
      species: pet.species || '', gender: pet.gender || '',
      breed: pet.breed || '', color: pet.color || '', weight: pet.weight || '',
      temperature: detail.temperature === null || detail.temperature === undefined
        ? '' : String(detail.temperature),
      temperatureFlag: detail.temperature_flag || '',
      commonFindings: (detail.common_findings_list || []).slice(),
      commonOther: detail.common_other || '',
      commonOtherOn: !!detail.common_other,
      infectious: Object.assign({}, detail.infectious || {}),
      skinMucosa: detail.skin_mucosa || '',
      skinOther: detail.skin_other || '',
      checkNote: detail.check_note || '',
      advice: detail.advice || '',
      disposal: detail.disposal || '',
      // 绝育手术病历（第四十七轮并入）。六个旧口径列由 `detail` 原样带回，
      // 前端只用一套键名（与服务端 `STERILIZATION_FIELDS` 对齐）。
      sterilization: {
        surgery_date: detail.sterilization_surgery_date || '',
        surgeon: detail.sterilization_surgeon || '',
        anesthesia: detail.sterilization_anesthesia || '',
        diagnosis: detail.sterilization_diagnosis || '',
        procedure: detail.sterilization_procedure || '',
        recovery: detail.sterilization_recovery || ''
      },
      items: {}
    };
    const byKey = {};
    (detail.items || []).forEach(it => { byKey[it.item_key] = it; });
    ((detail.options || {}).items || []).forEach(meta => {
      const it = byKey[meta.key];
      draft.items[meta.key] = {
        id: it ? it.id : null,
        plannedDate: it ? (it.planned_date || '') : '',
        chipNo: it ? (it.chip_no || '') : '',
        notes: it ? (it.notes || '') : '',
        rxOther: it ? (it.rx_other || '') : '',
        vetName: it ? (it.vet_name || '') : (detail.vet_name || ''),
        vetLicense: it ? (it.vet_license || '') : (detail.vet_license || ''),
        isDone: it ? !!it.is_done : false,
        doneAt: it ? (it.done_at || '') : '',
        isMust: it ? !!it.is_must : false,
        rx: it ? (it.rx || []).map(r => r.material_id) : []
      };
    });
    // 折叠态：默认全折叠；已填过内容的自动展开，便于回看
    const open = {};
    Object.keys(draft.items).forEach(k => {
      const p = draft.items[k];
      if (p.rx.length || String(p.rxOther).trim() || String(p.chipNo).trim()) open[k] = true;
    });

    const derived = detail.stage === 'done' ? 3 : (detail.stage === 'treating' ? 2 : 1);
    const step = stepOverride || derived;
    this.state.treatmentFlow = {
      detail: detail, draft: draft, step: step,
      maxStep: Math.max(derived, step), open: open
    };
    this.renderTreatmentContent();
  },

  renderFlowView() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    const f = this.state.treatmentFlow;
    if (!f) { this.renderTreatmentFlow(); return; }
    const detail = f.detail || {};
    const pet = detail.pet || {};
    const STEPS = ['诊疗前检查', '医嘱与处方', '执行与办结'];
    const attr = [pet.species, pet.gender, pet.breed, pet.color]
      .filter(Boolean).map(x => this.escape(x)).join(' · ');

    let html = '<div class="tx-flow-head">'
      + '<button class="btn btn-sm btn-secondary" data-act="tx-back">‹ 返回看板</button>'
      + '<span class="who">' + this.escape(detail.pet_code || '') + ' · '
      + this.escape(pet.name || '未命名') + '</span>'
      + '<span class="meta">' + attr + '</span>'
      + TNR_UI.printDocBtn('treatment', detail.id, '打印诊疗单')
      + '</div>';

    // 已办结 = 只读查看：办结时间与去向是这张单的历史事实，改不得。
    // 提示条放在头部下面、步骤条上面，避免和步骤条视觉打架。
    if (detail.is_disposed) {
      const dspList = (detail.options || {}).disposals || [];
      const dspSel = dspList.find(x => x.key === detail.disposal) || {};
      html += '<div class="tx-tip suc"><span>✅</span><div>'
        + '<b>该诊疗单已办结，仅可查看、不可编辑。</b>'
        + (detail.disposed_at ? '办结时间 ' + this.escape(TNR_UI.formatDate(detail.disposed_at)) + '，' : '')
        + '去向：' + this.escape(dspSel.label || detail.disposal || '—') + '。</div></div>';
    }

    html += '<div class="tx-steps">';
    STEPS.forEach((s, i) => {
      const n = i + 1;
      let cls = n === f.step ? 'cur' : (n < f.step ? 'done' : '');
      if (n > f.maxStep) cls += ' lock';
      html += '<div class="tx-step ' + cls + '" data-act="tx-step" data-v="' + n + '">'
        + '<div class="dot">' + (n < f.step ? '✓' : n) + '</div>'
        + '<div class="lb">' + s + '</div></div>';
    });
    html += '</div>';

    html += '<div>' + (f.step === 1 ? this.step1HTML()
      : (f.step === 2 ? this.step2HTML() : this.step3HTML())) + '</div>';
    html += '<div class="tx-bottom-bar">' + this.bottomBarHTML() + '</div>';
    c.innerHTML = html;

    const scrollBox = document.getElementById('adminContent');
    if (scrollBox) scrollBox.scrollTop = 0;
    window.scrollTo(0, 0);
  },

  /* ---------- 步骤 1：诊疗前检查 ---------- */
  step1HTML() {
    const f = this.state.treatmentFlow;
    const d = f.draft;
    const detail = f.detail || {};
    const pet = detail.pet || {};
    const opts = detail.options || {};
    const tests = opts.infectious_tests || [];
    const results = opts.test_results || [];
    const intake = detail.intake || {};
    // 只读的两种情况（第四十八轮）：
    //   ① 已办结 —— 办结时间与去向是历史事实，改不得；
    //   ② 检查单**已提交** —— 返回第 1 步只能看，不能改。
    //      检查结果是医嘱与诊断的依据，事后静默改写会让「医嘱基于什么
    //      体检结论下的」失去凭据。服务端 `apply_check()` 同样拒绝二次修改。
    const locked = !!detail.is_disposed || !!detail.checked_at;
    const dis = locked ? ' disabled' : '';

    let h = '<div class="card mb-5"><div class="card-header">'
      + '<div class="card-title"><span class="card-title-bar"></span>基础信息</div>'
      + '<div class="text-muted fs-sm">转运档案带出 · 可修改</div></div><div class="card-body">';

    h += '<div class="tx-row3">'
      + '<div class="tx-fld"><label>种类<span class="req">*</span></label>'
      + '<select class="tx-sel" data-inp="species"' + dis + '>'
      + ['猫', '狗'].map(s => '<option' + (d.species === s ? ' selected' : '') + '>' + s + '</option>').join('')
      + '</select></div>'
      + '<div class="tx-fld"><label>公母</label><select class="tx-sel" data-inp="gender"' + dis + '>'
      + ['公', '母'].map(s => '<option' + (d.gender === s ? ' selected' : '') + '>' + s + '</option>').join('')
      + '</select></div>'
      + '<div class="tx-fld"><label>品种</label><input class="tx-inp" data-inp="breed" value="'
      + this.escape(d.breed) + '"' + dis + '></div>'
      + '</div>';

    h += '<div class="tx-row2">'
      + '<div class="tx-fld"><label>体重（kg）</label><div class="tx-unit">'
      + '<input class="tx-inp" data-inp="weight" value="' + this.escape(d.weight) + '"' + dis + '>'
      + '<span class="u">kg</span></div></div>'
      + '<div class="tx-fld"><label>毛色</label><input class="tx-inp" data-inp="color" value="'
      + this.escape(d.color) + '"' + dis + '></div>'
      + '</div>';

    h += '<div class="tx-kv" style="margin-top:6px;">'
      + '<div><div class="k">档案编号</div><div class="v">' + this.escape(detail.pet_code || '—') + '</div></div>'
      + '<div><div class="k">来源捕捉点</div><div class="v">' + this.escape(intake.shelter || '—') + '</div></div>'
      + '<div><div class="k">转运单号</div><div class="v">' + this.escape(intake.transfer_no || '—') + '</div></div>'
      + '<div><div class="k">接收日期</div><div class="v">' + this.formatDate(intake.receive_date) + '</div></div>'
      + '</div>';

    if (!locked) {
      h += '<div class="tx-tip wrn"><span>✎</span><div>以上为动物基础属性，'
        + '修改后写回档案并留痕（记录操作人与时间）。</div></div>';
    } else if (detail.checked_at && !detail.is_disposed) {
      h += '<div class="tx-tip suc"><span>✓</span><div><b>检查单已提交</b>，'
        + '本步内容仅可查看、不可修改（提交时间 '
        + this.formatDateTime(detail.checked_at) + '）。</div></div>';
    }
    h += '</div></div>';

    /* 体检项目 */
    h += '<div class="card mb-5"><div class="card-header">'
      + '<div class="card-title"><span class="card-title-bar"></span>体检项目</div>'
      + '<div class="text-muted fs-sm">带 * 为提交必填</div></div><div class="card-body">';

    h += '<div class="tx-fld"><label>1. 体温检测<span class="req">*</span></label>'
      + '<div class="tx-chips">'
