      TNR_UI.toast(e.message || '加载失败', 'danger');
    }
  },

  /* ========== 4. 物料库存管理 ========== */
  async render_material() {
    const page = document.getElementById('page-material');

    let txns = [];
    try { txns = await TNR_API.getMaterialTransactions(); } catch(e) {}
    const pending = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]')).length;
    const adjustments = txns.filter(t => t.type === 'adjustment').length;

    page.innerHTML = '<div class="tabs">' +
      '<div class="tab-item ' + (this.state.materialTab === 'pending' ? 'active' : '') + '" data-mtab="pending">待接收物料 (' + pending + ')</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'stock' ? 'active' : '') + '" data-mtab="stock">实时库存</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'adjustment' ? 'active' : '') + '" data-mtab="adjustment">库存异动 (' + adjustments + ')</div>' +
      '<div class="tab-item ' + (this.state.materialTab === 'ledger' ? 'active' : '') + '" data-mtab="ledger">出入库台账 (' + txns.length + ')</div>' +
      '</div><div id="materialTabContent"></div>';

    page.querySelectorAll('[data-mtab]').forEach(el => {
      el.addEventListener('click', () => {
        this.state.materialTab = el.dataset.mtab;
        page.querySelectorAll('.tab-item').forEach((t, i) => {
          t.classList.toggle('active', ['pending','stock','adjustment','ledger'][i] === this.state.materialTab);
        });
        this.renderMaterialTab(txns);
      });
    });

    this.renderMaterialTab(txns);
  },

  async renderMaterialTab(txns) {
    const c = document.getElementById('materialTabContent');
    if (!c) return;
    if (this.state.materialTab === 'pending') this.renderMaterialPending(c, txns);
    else if (this.state.materialTab === 'stock') this.renderMaterialStock(c);
    else if (this.state.materialTab === 'adjustment') this.renderMaterialAdjustment(c, txns);
    else if (this.state.materialTab === 'ledger') this.renderMaterialLedger(c, txns);
  },

  renderMaterialPending(c, txns) {
    const dispatches = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]'));
    if (dispatches.length === 0) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">暂无待接收物料</div><div class="empty-state-desc">所有下发的物料已确认接收</div></div>';
      return;
    }
    const rows = dispatches.map(t => {
      return '<tr><td><div style="font-weight:500;">' + this.escape(t.material_name || '') + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">' + this.escape(t.ledger_no || '') + '</div></td>' +
        '<td>' + (t.quantity || 0) + ' ' + this.escape(t.unit || '') + '</td>' +
        '<td>' + this.escape(t.batch_no || '—') + '</td>' +
        '<td>' + this.escape(t.operator_name || '') + '</td>' +
        '<td>' + this.formatDate(t.date) + '</td>' +
        '<td><button class="btn btn-success btn-sm" data-mreceive="' + t.id + '">确认入库</button></td></tr>';
    }).join('');
    c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>物料名称</th><th>数量</th><th>批号</th><th>下发方</th><th>下发日期</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    c.querySelectorAll('[data-mreceive]').forEach(btn => {
      btn.addEventListener('click', () => this.confirmMaterialReceive(btn.dataset.mreceive));
    });
  },

  async renderMaterialStock(c) {
    c.innerHTML = '<div class="loading-state">加载中...</div>';
    try {
      const materials = await TNR_API.getMaterials();
      if (materials.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><div class="empty-state-text">暂无物料</div></div>';
        return;
      }
      const cards = materials.map(m => {
        const stock = m.hospital_stock || 0;
        const safety = m.safety_stock || 1;
        const isLow = stock < safety;
        const pct = Math.min(100, (stock / (safety * 2)) * 100);
        const color = isLow ? 'var(--rouge)' : (stock < safety * 1.5 ? 'var(--autumn-gold)' : 'var(--bamboo-green)');
        return '<div class="card"><div class="card-body"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3);">' +
          '<div><div style="font-weight:600;font-size:var(--fs-lg);">' + this.escape(m.name) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + TNR_API.getMaterialCategoryText(m.category) + ' · ' + this.escape(m.specification || '') + '</div></div>' +
          '<span class="badge ' + (isLow ? 'badge-danger' : 'badge-success') + '">' + (isLow ? '库存不足' : '正常') + '</span></div>' +
          '<div style="display:flex;align-items:center;gap:var(--sp-4);"><div style="flex:1;">' +
          '<div class="stock-bar"><div class="stock-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
          '<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:var(--fs-xs);color:var(--ink-light);"><span>当前库存</span><span>安全库存</span></div></div>' +
          '<div style="text-align:right;"><div style="font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;color:' + color + ';">' + stock + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">/ ' + safety + ' ' + this.escape(m.unit || '') + '</div></div></div>' +
          '<div class="desc-list mt-4"><div class="desc-item"><div class="desc-label">供应商</div><div class="desc-value">' + this.escape(m.supplier || '—') + '</div></div>' +
          '<div class="desc-item"><div class="desc-label">批号</div><div class="desc-value">' + this.escape(m.batch_no || '—') + '</div></div>' +
          '<div class="desc-item"><div class="desc-label">有效期</div><div class="desc-value">' + this.formatDate(m.expiry_date) + '</div></div></div></div></div>';
      }).join('');
      c.innerHTML = '<div class="stat-grid">' + cards + '</div>';
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async renderMaterialAdjustment(c, txns) {
    let materials = [];
    try { materials = await TNR_API.getMaterials(); } catch(e) {}

    const adj = txns.filter(t => t.type === 'adjustment');
    let adjHtml = '<div class="empty-state" style="padding:var(--sp-6);"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无异动记录</div></div>';
    if (adj.length > 0) {
      const rows = adj.map(t => {
        return '<tr><td>' + this.escape(t.material_name || '') + '</td><td>' + this.escape(t.note || '—') + '</td><td>' + (t.quantity || 0) + ' ' + this.escape(t.unit || '') + '</td><td>' + this.formatDate(t.date) + '</td><td>' + this.escape(t.operator_name || '') + '</td></tr>';
      }).join('');
      adjHtml = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>物料</th><th>原因</th><th>数量</th><th>日期</th><th>操作人</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    c.innerHTML = '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>库存异动报备</div></div><div class="card-body">' +
      '<div class="form-section"><div class="form-section-header"><div class="form-section-header-icon">📝</div><div class="form-section-title">新增异动报备</div></div><div class="form-section-body">' +
      '<div class="form-row"><div class="form-group"><label class="form-label">物料<span class="req">*</span></label><select class="form-select" id="adjMaterial"><option value="">请选择</option>' +
      materials.map(m => '<option value="' + m.id + '">' + this.escape(m.name) + ' (当前:' + (m.hospital_stock || 0) + (m.unit || '') + ')</option>').join('') +
      '</select></div><div class="form-group"><label class="form-label">数量<span class="req">*</span></label><input type="number" class="form-input" id="adjQty" value="1" min="1" /></div></div>' +
      '<div class="form-group"><label class="form-label">原因说明<span class="req">*</span></label><textarea class="form-textarea" id="adjReason" placeholder="请说明异动原因（过期/破损/盘亏等）"></textarea></div>' +
      '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-primary" id="adjSubmitBtn">提交报备</button></div></div></div></div></div>' +
      '<div class="card mt-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>异动记录</div></div><div class="card-body-flush">' + adjHtml + '</div></div>';

    c.querySelector('#adjSubmitBtn')?.addEventListener('click', () => this.saveStockAdjustment(materials));
  },

  async saveStockAdjustment(materials) {
    const mid = document.getElementById('adjMaterial').value;
    const qty = parseInt(document.getElementById('adjQty').value);
    const reason = document.getElementById('adjReason').value.trim();
    if (!mid) { TNR_UI.toast('请选择物料', 'warning'); return; }
    if (!qty || qty <= 0) { TNR_UI.toast('请输入有效数量', 'warning'); return; }
    if (!reason) { TNR_UI.toast('请填写原因说明', 'warning'); return; }

    try {
      const res = await TNR_API.adjustStock({material_id: parseInt(mid), quantity: qty, reason: reason});
      if (res.success) {
        TNR_UI.toast('异动报备已提交，库存已扣减', 'success');
        this.render_material();
      } else {
        TNR_UI.toast(res.message || '提交失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  renderMaterialLedger(c, txns) {
    const data = txns.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    if (data.length === 0) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无台账记录</div></div>';
      return;
    }
    const typeMap = {'purchase': '采购入库', 'dispatch': '捕捉点下发', 'consume': '诊疗消耗', 'adjustment': '库存异动'};
    const typeBadge = {'purchase': 'badge-success', 'dispatch': 'badge-info', 'consume': 'badge-warning', 'adjustment': 'badge-danger'};
    const rows = data.map(t => {
      const sign = (t.type === 'consume' || t.type === 'adjustment') ? '-' : '+';
      return '<tr><td><div style="font-weight:500;">' + this.escape(t.ledger_no || '') + '</div></td>' +
        '<td><span class="badge ' + (typeBadge[t.type] || 'badge-default') + '">' + (typeMap[t.type] || t.type) + '</span></td>' +
        '<td>' + this.escape(t.material_name || '') + '</td>' +
        '<td>' + sign + (t.quantity || 0) + ' ' + this.escape(t.unit || '') + '</td>' +
        '<td>' + this.escape(t.batch_no || '—') + '</td>' +
        '<td>' + this.escape(t.from_to || '') + '</td>' +
        '<td>' + this.escape(t.operator_name || '') + '</td>' +
        '<td>' + this.formatDate(t.date) + '</td></tr>';
    }).join('');
    c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>类型</th><th>物料</th><th>数量</th><th>批号</th><th>来源/去向</th><th>操作人</th><th>日期</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  },

  async confirmMaterialReceive(txnId) {
    TNR_UI.confirm('确认接收该批物料？', '确认入库').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.receiveMaterial(txnId);
        if (res.success) {
          TNR_UI.toast('物料入库成功', 'success');
          this.render_material();
        } else {
          TNR_UI.toast(res.message || '入库失败', 'danger');
        }
      } catch (e) {
        TNR_UI.toast(e.message || '操作失败', 'danger');
      }
    });
  },

  /* ========== 5. 领养信息维护 ========== */
  async render_adoption_info() {
    const page = document.getElementById('page-adoption-info');
    page.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const [pets, listings, adoptions, appJson] = await Promise.all([
        TNR_API.getHospitalPets('pending_adopt'),
        TNR_API.getHallListings(),
        TNR_API.getAdoptions(),
        TNR_API.get(TNR_API.BASE + 'adoptions/applications/')
      ]);

      // 待审核领养申请（领养人在线提交）
      const applications = appJson.data || [];
      const pendingAppls = applications.filter(a => a.status === 'pending');
      let applHtml = '';
      if (pendingAppls.length > 0) {
        applHtml = '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待审核领养申请</div><span class="badge badge-cinnabar">' + pendingAppls.length + ' 条待处理</span></div><div class="card-body" style="padding:0;"><div class="table-wrapper"><table class="table"><thead><tr><th>宠物编号</th><th>申请人</th><th>电话</th><th>资质说明</th><th>申请时间</th><th>操作</th></tr></thead><tbody>';
        pendingAppls.forEach(a => {
          applHtml += '<tr><td><span class="pet-code-chip">' + this.escape(a.pet_code || '') + '</span></td><td>' + this.escape(a.applicant_name || '') + '</td><td>' + this.escape(a.applicant_phone || '') + '</td><td style="max-width:220px;">' + this.escape((a.qualification || '').substring(0, 40)) + '</td><td>' + this.escape((a.applied_at || '').substring(0, 16)) + '</td><td><button class="btn btn-success btn-sm" data-review-apply="' + a.id + '" data-action="approve">通过</button> <button class="btn btn-danger btn-sm" data-review-apply="' + a.id + '" data-action="reject">拒绝</button></td></tr>';
        });
        applHtml += '</tbody></table></div></div></div>';
      }

      // 待领出确认列表（捕捉点已登记领养，等待医院确认领出）
      const pendingClaims = adoptions.filter(a => a.status === 'pending_claim');
      let claimsHtml = '';
      if (pendingClaims.length > 0) {
        claimsHtml = '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待领出确认</div><span class="badge badge-cinnabar">' + pendingClaims.length + ' 条待处理</span></div><div class="card-body" style="padding:0;"><div class="table-wrapper"><table class="table"><thead><tr><th>领养单号</th><th>宠物编号</th><th>领养人</th><th>电话</th><th>登记时间</th><th>操作</th></tr></thead><tbody>';
        pendingClaims.forEach(a => {
          claimsHtml += '<tr><td><span class="font-mono fs-sm">' + this.escape(a.ledger_no || a.id) + '</span></td><td><span class="pet-code-chip">' + this.escape(a.pet_code || '') + '</span></td><td>' + this.escape(a.adopter_name || '') + '</td><td>' + this.escape(a.adopter_phone || '') + '</td><td>' + this.escape((a.created_at || '').substring(0, 16)) + '</td><td><button class="btn btn-primary btn-sm" data-confirm-claim="' + a.id + '">确认领出</button></td></tr>';
        });
        claimsHtml += '</tbody></table></div></div></div>';
      }

      if (pets.length === 0 && pendingClaims.length === 0) {
        page.innerHTML = applHtml + '<div class="empty-state"><div class="empty-state-icon">🐾</div><div class="empty-state-text">暂无待领养动物</div><div class="empty-state-desc">诊疗完成5天后，动物状态将自动变更为「待领养」</div></div>';
        page.querySelectorAll('[data-review-apply]').forEach(btn => {
          btn.addEventListener('click', () => this.reviewApplication(btn.dataset.reviewApply, btn.dataset.action));
        });
        return;
      }

      if (pets.length === 0) {
        page.innerHTML = claimsHtml + applHtml + '<div class="empty-state"><div class="empty-state-icon">🐾</div><div class="empty-state-text">暂无待领养动物</div><div class="empty-state-desc">诊疗完成5天后，动物状态将自动变更为「待领养」</div></div>';
        // 绑定确认领出按钮
        page.querySelectorAll('[data-confirm-claim]').forEach(btn => {
          btn.addEventListener('click', () => this.confirmClaim(btn.dataset.confirmClaim));
        });
        page.querySelectorAll('[data-review-apply]').forEach(btn => {
          btn.addEventListener('click', () => this.reviewApplication(btn.dataset.reviewApply, btn.dataset.action));
        });
        return;
      }

      const html = pets.map(p => {
        const listing = listings.find(l => l.pet && String(l.pet.id) === String(p.id));
        const inHall = listing && listing.is_active;
        const intro = listing ? (listing.intro || '') : (p.description || '');
        const personality = listing ? (listing.personality || '') : '';
        const bodyCondition = listing ? (listing.body_condition || '') : '';

        return '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>' + this.escape(p.code) + ' · ' + this.escape(p.name || '') + '</div>' +
          '<div class="flex gap-2">' + (inHall ? '<span class="badge badge-success">已上架领养大厅</span>' : '<span class="badge badge-warning">未上架</span>') +
          '<span class="badge ' + TNR_API.getPetStatusBadge(p.status) + '">' + TNR_API.getPetStatusText(p.status) + '</span></div></div>' +
          '<div class="card-body">' +
          '<div class="detail-section"><div class="detail-section-title">照片管理（捕捉前/捕捉后/诊疗后）</div>' +
          '<div style="grid-template-columns:repeat(3,1fr);display:grid;gap:var(--sp-3);">' +
          this.renderPhotoSlot(p, 'photo_before', '捕捉前') +
          this.renderPhotoSlot(p, 'photo_after', '捕捉后') +
          this.renderPhotoSlot(p, 'photo_treatment', '诊疗后') +
          '</div></div>' +
          '<div class="detail-section"><div class="detail-section-title">宠物简介</div>' +
          '<div class="form-group"><label class="form-label">简介描述</label><textarea class="form-textarea" id="desc_' + p.id + '" placeholder="请输入宠物简介">' + this.escape(intro) + '</textarea></div>' +
          '<div class="form-row"><div class="form-group"><label class="form-label">性格特点</label><input type="text" class="form-input" id="personality_' + p.id + '" value="' + this.escape(personality) + '" placeholder="如：温顺、亲人" /></div>' +
          '<div class="form-group"><label class="form-label">健康状况</label><input type="text" class="form-input" id="health_' + p.id + '" value="' + this.escape(bodyCondition) + '" placeholder="如：已绝育、已免疫" /></div></div>' +
          '<div class="form-group"><label class="form-label">芯片编号</label><input type="text" class="form-input" value="' + this.escape(p.chip_no || '') + '" readonly /></div>' +
          '</div>' +
          '<div class="detail-section"><div class="detail-section-title">领养状态</div>' + TNR_UI.renderDescList([
            {label: '当前状态', value: '<span class="badge ' + TNR_API.getPetStatusBadge(p.status) + '">' + TNR_API.getPetStatusText(p.status) + '</span>'},
            {label: '领养大厅', value: inHall ? '<span class="badge badge-success">已发布</span>' : '<span class="badge badge-default">未发布</span>'},
            {label: '物种/品种', value: this.escape(p.species || '') + ' / ' + this.escape(p.breed || '')}
          ]) + '</div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;">' +
          '<button class="btn btn-secondary" data-save-info="' + p.id + '">保存资料</button>' +
          (inHall ? '<button class="btn btn-secondary" data-unpublish="' + p.id + '">下架</button>' : '<button class="btn btn-gold" data-publish="' + p.id + '">发布至领养大厅</button>') +
          '</div></div></div>';
      }).join('');

      page.innerHTML = claimsHtml + applHtml + html;

      page.querySelectorAll('[data-confirm-claim]').forEach(btn => {
        btn.addEventListener('click', () => this.confirmClaim(btn.dataset.confirmClaim));
      });
      page.querySelectorAll('[data-review-apply]').forEach(btn => {
        btn.addEventListener('click', () => this.reviewApplication(btn.dataset.reviewApply, btn.dataset.action));
      });
      page.querySelectorAll('[data-save-info]').forEach(btn => {
        btn.addEventListener('click', () => this.saveAdoptionInfo(btn.dataset.saveInfo));
      });
      page.querySelectorAll('[data-publish]').forEach(btn => {
        btn.addEventListener('click', () => this.publishToHall(btn.dataset.publish));
      });
      page.querySelectorAll('[data-unpublish]').forEach(btn => {
        btn.addEventListener('click', () => this.unpublishFromHall(btn.dataset.unpublish));
      });
      page.querySelectorAll('[data-upload-photo]').forEach(btn => {
        btn.addEventListener('click', () => this.uploadPhoto(btn.dataset.uploadPhoto, btn.dataset.photoField));
      });
    } catch (e) {
      page.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  renderPhotoSlot(pet, photoField, label) {
    const url = pet[photoField] || '';
    const inner = url ? '<img src="' + url + '" style="width:100%;height:100%;object-fit:cover;border-radius:var(--r-lg);" />' : '📷';
    return '<div style="cursor:pointer;" data-upload-photo="' + pet.id + '" data-photo-field="' + photoField + '"><div class="photo-placeholder-lg">' + inner + '</div><div style="text-align:center;font-size:var(--fs-sm);color:var(--ink-muted);margin-top:4px;">' + label + '</div></div>';
  },

  uploadPhoto(petId, photoField) {
    const labels = {photo_before: '捕捉前', photo_after: '捕捉后', photo_treatment: '诊疗后', photo_group: '合照'};
    TNR_UI.modal({
      title: '上传照片（' + (labels[photoField] || '') + '）',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="form-group"><label class="form-label">选择图片文件</label><input type="file" accept="image/*" id="photoFileInput" class="form-input" style="padding:4px;" /></div>' +
          '<div id="photoPreview" style="margin-top:var(--sp-3);"></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="photoUploadBtn">上传</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#photoFileInput').addEventListener('change', e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = ev => {
            bodyEl.querySelector('#photoPreview').innerHTML = '<img src="' + ev.target.result + '" style="width:100%;border-radius:var(--r-md);" />';
          };
          reader.readAsDataURL(file);
        });
        bodyEl.querySelector('#photoUploadBtn').onclick = async () => {
          const file = bodyEl.querySelector('#photoFileInput').files[0];
          if (!file) { TNR_UI.toast('请选择图片文件', 'warning'); return; }
          try {
            const res = await TNR_API.uploadPetPhoto(petId, photoField, file);
            if (res.success) {
              TNR_UI.toast('照片上传成功', 'success');
              closeFn();
              this.render_adoption_info();
            } else {
              TNR_UI.toast(res.message || '上传失败', 'danger');
            }
          } catch (e) {
            TNR_UI.toast(e.message || '上传失败', 'danger');
          }
        };
      }
    });
  },

  async confirmClaim(adoptionId) {
    TNR_UI.confirm('确认该领养人已到院领出动物？<br>确认后领养流程完成，宠物状态变为「已领养」。', '确认领出').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.confirmAdoptionClaim(adoptionId);
        TNR_UI.toast(res.message || '领出确认成功', 'success');
        this.render_adoption_info();
      } catch (e) {
        TNR_UI.toast('确认失败：' + e.message, 'danger');
      }
    });
  },

  async reviewApplication(applicationId, action) {
    const label = action === 'approve' ? '通过' : '拒绝';
    TNR_UI.confirm('确认' + label + '该领养申请？', '审核申请').then(async ok => {
      if (!ok) return;
      try {
        const reviewNote = action === 'reject' ? (window.prompt('请输入拒绝原因：') || '') : '';
        const res = await TNR_API.post(TNR_API.BASE + 'adoptions/applications/' + applicationId + '/review/', {
          action,
          review_note: reviewNote
        });
        TNR_UI.toast(res.message || '审核完成', 'success');
        this.render_adoption_info();
      } catch (e) {
        TNR_UI.toast('审核失败：' + e.message, 'danger');
      }
    });
  },

  async saveAdoptionInfo(petId) {
    const intro = document.getElementById('desc_' + petId).value.trim();
    const personality = document.getElementById('personality_' + petId).value.trim();
    const bodyCondition = document.getElementById('health_' + petId).value.trim();

    try {
      const res = await TNR_API.editAdoptionInfo(petId, {intro, personality, body_condition: bodyCondition});
      if (res.success) {
        TNR_UI.toast('领养资料保存成功', 'success');
      } else {
        TNR_UI.toast(res.message || '保存失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async publishToHall(petId) {
    try {
      const res = await TNR_API.editAdoptionInfo(petId, {is_active: true});
      if (res.success) {
        TNR_UI.toast('已发布至领养大厅', 'success');
        this.render_adoption_info();
      } else {
        TNR_UI.toast(res.message || '发布失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async unpublishFromHall(petId) {
    try {
      const res = await TNR_API.editAdoptionInfo(petId, {is_active: false});
      if (res.success) {
        TNR_UI.toast('已从领养大厅下架', 'success');
        this.render_adoption_info();
      } else {
        TNR_UI.toast(res.message || '下架失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  /* ========== 6. 安乐死处置 ========== */
  async render_euthanasia() {
    const page = document.getElementById('page-euthanasia');
    page.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const [eligiblePets, records] = await Promise.all([
        TNR_API.getHospitalPets(),
        TNR_API.getEuthanasia()
      ]);

      const eligible = eligiblePets.filter(p => p.status === 'in_treatment' || p.status === 'pending_adopt');

      let html = '<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>新增安乐死处置</div></div><div class="card-body">' +
        '<div class="form-hint" style="padding:var(--sp-3);background:var(--rouge-light);border-radius:var(--r-md);color:var(--rouge);font-size:var(--fs-sm);margin-bottom:var(--sp-4);">⚠️ 安乐死处置为不可逆操作，请确认后谨慎执行。处置完成后将登记遗体移交记录并扣减活体库存。</div>' +
        '<div class="form-row"><div class="form-group"><label class="form-label">选择动物<span class="req">*</span></label><select class="form-select" id="euthPetSelect"><option value="">请选择</option>' +
        eligible.map(p => '<option value="' + p.id + '">' + this.escape(p.code) + ' · ' + this.escape(p.name || '') + ' (' + TNR_API.getPetStatusText(p.status) + ')</option>').join('') +
        '</select></div><div class="form-group"><label class="form-label">处置日期<span class="req">*</span></label><input type="date" class="form-input" id="euthDate" value="' + new Date().toISOString().substr(0, 10) + '" /></div></div>' +
        '<div class="form-group"><label class="form-label">安乐死原因<span class="req">*</span></label><select class="form-select" id="euthReason"><option value="严重疾病">严重疾病</option><option value="严重外伤">严重外伤</option><option value="攻击性过强">攻击性过强</option><option value="无法救治">无法救治</option><option value="其他">其他</option></select></div>' +
        '<div class="form-group"><label class="form-label">动物状况描述<span class="req">*</span></label><textarea class="form-textarea" id="euthCondition" placeholder="请详细描述动物状况及处置原因"></textarea></div>' +
        '<div style="display:flex;justify-content:flex-end;"><button class="btn btn-danger" id="euthSubmitBtn">提交安乐死处置</button></div></div></div>';

      /* 记录列表 */
      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>安乐死处置记录</div></div><div class="card-body-flush">';
      if (records.length === 0) {
        html += '<div class="empty-state" style="padding:var(--sp-6);"><div class="empty-state-icon">⚰️</div><div class="empty-state-text">暂无处置记录</div></div>';
      } else {
        const rows = records.map(e => {
          return '<tr><td><div style="font-weight:500;">' + this.escape(e.pet_code || '') + '</div></td>' +
            '<td>' + this.escape(e.reason || '') + '</td>' +
            '<td>' + this.formatDate(e.euthanized_at) + '</td>' +
            '<td>' + (e.body_received ? '<span class="badge badge-success">已移交</span>' : '<span class="badge badge-warning">未移交</span>') + '</td>' +
            '<td>' + this.escape(e.operator_name || '') + '</td>' +
            '<td><button class="btn-link" data-view-euth="' + e.id + '">详情</button></td></tr>';
        }).join('');
        html += '<div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>原因</th><th>处置日期</th><th>遗体移交</th><th>操作人</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }
      html += '</div></div>';

      page.innerHTML = html;

      page.querySelector('#euthSubmitBtn')?.addEventListener('click', () => this.saveEuthanasia());
      page.querySelectorAll('[data-view-euth]').forEach(btn => {
        btn.addEventListener('click', () => this.viewEuthanasiaDetail(btn.dataset.viewEuth, records));
      });
    } catch (e) {
      page.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async saveEuthanasia() {
    const petId = document.getElementById('euthPetSelect').value;
    const date = document.getElementById('euthDate').value;
    const reason = document.getElementById('euthReason').value;
    const condition = document.getElementById('euthCondition').value.trim();

    if (!petId) { TNR_UI.toast('请选择动物', 'warning'); return; }
    if (!date) { TNR_UI.toast('请选择处置日期', 'warning'); return; }
    if (!condition) { TNR_UI.toast('请填写动物状况描述', 'warning'); return; }

    TNR_UI.confirm('确认对该动物执行安乐死处置？此操作不可逆。', '确认安乐死处置').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.createEuthanasia({pet_id: parseInt(petId), reason, condition, euthanized_at: date});
        if (res.success) {
          TNR_UI.toast('安乐死处置已登记，动物状态已更新', 'success');
          this.render_euthanasia();
        } else {
          TNR_UI.toast(res.message || '登记失败', 'danger');
        }
      } catch (e) {
        TNR_UI.toast(e.message || '操作失败', 'danger');
      }
    });
  },

  viewEuthanasiaDetail(id, records) {
    const e = records.find(x => String(x.id) === String(id));
    if (!e) return;
    const html = '<div class="detail-section"><div class="detail-section-title">处置信息</div>' + TNR_UI.renderDescList([
      {label: '宠物编号', value: this.escape(e.pet_code || '')},
      {label: '处置日期', value: this.formatDate(e.euthanized_at)},
      {label: '原因', value: this.escape(e.reason || '')},
      {label: '动物状况', value: this.escape(e.condition || ''), full: true},
      {label: '遗体移交', value: e.body_received ? '<span class="badge badge-success">已移交</span>' : '<span class="badge badge-warning">未移交</span>'},
      {label: '移交日期', value: this.formatDate(e.body_received_at)},
      {label: '操作人', value: this.escape(e.operator_name || '')},
      {label: '单据编号', value: this.escape(e.ledger_no || '')}
    ]) + '</div>';
    TNR_UI.drawer({title: '安乐死处置详情 · ' + this.escape(e.pet_code), body: html});
  },

  /* ========== 7. 单据台账 ========== */
  async render_ledger() {
    const page = document.getElementById('page-ledger');
    page.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const [transfers, treatments, txns, euthanasia] = await Promise.all([
        TNR_API.getTransfers(),
        TNR_API.getTreatments(),
        TNR_API.getMaterialTransactions(),
        TNR_API.getEuthanasia()
      ]);

      page.innerHTML = '<div class="tabs">' +
        '<div class="tab-item ' + (this.state.ledgerTab === 'transfer' ? 'active' : '') + '" data-ltab="transfer">交接台账 (' + transfers.length + ')</div>' +
        '<div class="tab-item ' + (this.state.ledgerTab === 'treatment' ? 'active' : '') + '" data-ltab="treatment">诊疗台账 (' + treatments.length + ')</div>' +
        '<div class="tab-item ' + (this.state.ledgerTab === 'material' ? 'active' : '') + '" data-ltab="material">物料台账 (' + txns.length + ')</div>' +
        '<div class="tab-item ' + (this.state.ledgerTab === 'euthanasia' ? 'active' : '') + '" data-ltab="euthanasia">安乐死台账 (' + euthanasia.length + ')</div>' +
        '</div><div id="ledgerTabContent"></div>';

      page.querySelectorAll('[data-ltab]').forEach(el => {
        el.addEventListener('click', () => {
          this.state.ledgerTab = el.dataset.ltab;
          page.querySelectorAll('.tab-item').forEach((t, i) => {
            t.classList.toggle('active', ['transfer','treatment','material','euthanasia'][i] === this.state.ledgerTab);
          });
          this.renderLedgerTab(transfers, treatments, txns, euthanasia);
        });
      });

      this.renderLedgerTab(transfers, treatments, txns, euthanasia);
    } catch (e) {
      page.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  renderLedgerTab(transfers, treatments, txns, euthanasia) {
    const c = document.getElementById('ledgerTabContent');
    if (!c) return;
    const tab = this.state.ledgerTab;

    if (tab === 'transfer') {
      const data = transfers.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      if (data.length === 0) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无交接台账</div></div>'; return; }
      const rows = data.map(t => {
        const codes = this.parsePetCodes(t.pet_codes);
        return '<tr><td>' + this.escape(t.ledger_no || '') + '</td><td>' + this.formatDateTime(t.created_at) + '</td><td>' + this.escape(t.from_shelter_name || '') + '</td><td>' + (t.pet_count || 0) + '</td><td>' + this.escape(codes.join(', ')) + '</td><td>' + this.transferStatusBadge(t.status) + '</td><td>' + this.formatDate(t.received_at) + '</td></tr>';
      }).join('');
      c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>创建时间</th><th>来源捕捉点</th><th>动物数量</th><th>宠物编号</th><th>状态</th><th>接收时间</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else if (tab === 'treatment') {
      const data = treatments.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
      if (data.length === 0) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无诊疗台账</div></div>'; return; }
      const rows = data.map(t => {
        const items = [];
        if (t.items_sterilization) items.push('绝育');
        if (t.items_vaccine) items.push('疫苗');
        if (t.items_deworming) items.push('驱虫');
        if (t.items_chip) items.push('芯片');
        return '<tr><td>' + this.escape(t.pet_code || '') + '</td><td>' + (items.join('、') || '—') + '</td><td>' + this.escape(t.hospital_name || '') + '</td><td>' + this.escape(t.sterilization_surgeon || t.operator_name || '—') + '</td><td>' + this.formatDateTime(t.created_at) + '</td><td>' + this.treatmentStatusBadge(t.status) + '</td></tr>';
      }).join('');
      c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>诊疗项目</th><th>医院</th><th>医生</th><th>日期</th><th>状态</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else if (tab === 'material') {
      const data = txns.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (data.length === 0) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无物料台账</div></div>'; return; }
      const typeMap = {'purchase': '采购入库', 'dispatch': '捕捉点下发', 'consume': '诊疗消耗', 'adjustment': '库存异动'};
      const typeBadge = {'purchase': 'badge-success', 'dispatch': 'badge-info', 'consume': 'badge-warning', 'adjustment': 'badge-danger'};
      const rows = data.map(t => {
        const sign = (t.type === 'consume' || t.type === 'adjustment') ? '-' : '+';
        return '<tr><td>' + this.escape(t.ledger_no || '') + '</td><td><span class="badge ' + (typeBadge[t.type] || 'badge-default') + '">' + (typeMap[t.type] || t.type) + '</span></td><td>' + this.escape(t.material_name || '') + '</td><td>' + sign + (t.quantity || 0) + ' ' + this.escape(t.unit || '') + '</td><td>' + this.formatDate(t.date) + '</td><td>' + this.escape(t.operator_name || '') + '</td></tr>';
      }).join('');
      c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>类型</th><th>物料</th><th>数量</th><th>日期</th><th>操作人</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    } else if (tab === 'euthanasia') {
      const data = euthanasia.slice().sort((a, b) => (b.euthanized_at || '').localeCompare(a.euthanized_at || ''));
      if (data.length === 0) { c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">暂无安乐死台账</div></div>'; return; }
      const rows = data.map(e => {
        return '<tr><td>' + this.escape(e.ledger_no || '') + '</td><td>' + this.escape(e.pet_code || '') + '</td><td>' + this.escape(e.reason || '') + '</td><td>' + this.formatDate(e.euthanized_at) + '</td><td>' + (e.body_received ? '<span class="badge badge-success">已移交</span>' : '<span class="badge badge-warning">未移交</span>') + '</td><td>' + this.escape(e.operator_name || '') + '</td></tr>';
      }).join('');
      c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>单据编号</th><th>宠物编号</th><th>原因</th><th>处置日期</th><th>遗体移交</th><th>操作人</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    }
  },

  /* ========== 8. 个人中心 ========== */
  render_profile() {
    const u = this.currentUser();
    if (!u) return;
    const page = document.getElementById('page-profile');
    page.innerHTML = '<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>账户信息</div></div><div class="card-body">' +
      TNR_UI.renderDescList([
        {label: '用户名', value: this.escape(u.username || '')},
        {label: '姓名', value: this.escape(u.name || '')},
        {label: '所属机构', value: this.escape(u.institution_name || '—')},
        {label: '机构类型', value: '宠物医院'},
        {label: '角色', value: this.escape(u.role_display || '医院操作员')},
        {label: '所属区县', value: this.escape(u.district_name || '—')},
        {label: '联系电话', value: this.escape(u.phone || '—')},
        {label: '用户ID', value: this.escape(String(u.id || ''))}
      ]) + '</div></div>' +
      '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>系统说明</div></div><div class="card-body">' +
      '<div style="font-size:var(--fs-sm);color:var(--ink-muted);line-height:1.8;">' +
      '· 医院端负责动物接收、诊疗操作、物料管理、领养信息维护及安乐死处置。<br>' +
      '· 诊疗完成后5天，系统自动将动物状态变更为「待领养」。<br>' +
      '· 领养出库登记由捕捉点端完成，医院端仅维护领养大厅信息。<br>' +
      '· 物料库存联动：疫苗/驱虫/芯片在诊疗时自动扣减医院库存。<br>' +
      '· 如需修改密码，请联系系统管理员。' +
      '</div></div></div>';
  }
};

/* === 启动 === */
Hospital.init();
</script>
{% endblock %}
