{% extends 'portal/hospital_base.html' %}
{% load static %}

{% block title %}宠物医院端 · 流浪动物TNR管理系统{% endblock %}

{% block nav_dashboard %}active{% endblock %}

{% block extra_head %}
{{ block.super }}
<style>
  .photo-placeholder{width:48px;height:48px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-light);flex-shrink:0}
  .treatment-item-card{border:2px solid var(--border-light);border-radius:var(--r-lg);padding:var(--sp-4);cursor:pointer;transition:all var(--t-base);background:var(--white)}
  .treatment-item-card.checked{border-color:var(--cinnabar);background:var(--cinnabar-light)}
  .treatment-item-header{display:flex;align-items:center;gap:var(--sp-3)}
  .treatment-item-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:18px}
  .treatment-item-card.checked .treatment-item-icon{background:var(--cinnabar);color:#fff}
  .treatment-item-body{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border-faint)}
  .todo-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);cursor:pointer;transition:background var(--t-fast);border-bottom:1px solid var(--border-faint)}
  .todo-item:hover{background:var(--rice-light)}
  .todo-item:last-child{border-bottom:none}
  .todo-item-icon{width:32px;height:32px;border-radius:var(--r-md);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .todo-item-content{flex:1;min-width:0}
  .todo-item-title{font-size:var(--fs-md);font-weight:500;color:var(--ink-text)}
  .todo-item-desc{font-size:var(--fs-sm);color:var(--ink-muted)}
  .quick-action{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);padding:var(--sp-5);border-radius:var(--r-lg);border:1px solid var(--border-light);cursor:pointer;transition:all var(--t-base);background:var(--white);text-align:center}
  .quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--cinnabar)}
  .quick-action-icon{width:44px;height:44px;border-radius:var(--r-lg);background:var(--cinnabar-light);color:var(--cinnabar);display:flex;align-items:center;justify-content:center;font-size:22px}
  .quick-action-label{font-size:var(--fs-sm);color:var(--ink-text);font-weight:500}
  .quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--sp-3)}
  .pet-select-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border:2px solid var(--border-light);border-radius:var(--r-md);cursor:pointer;transition:all var(--t-fast)}
  .pet-select-item:hover{border-color:var(--ink-light)}
  .pet-select-item.selected{border-color:var(--cinnabar);background:var(--cinnabar-light)}
  .stock-bar{height:6px;background:var(--rice-warm);border-radius:var(--r-full);overflow:hidden;margin-top:var(--sp-2)}
  .stock-bar-fill{height:100%;border-radius:var(--r-full);transition:width var(--t-slow)}
  .detail-section{margin-bottom:var(--sp-5)}
  .detail-section-title{font-family:var(--font-display);font-size:var(--fs-md);font-weight:600;color:var(--ink);margin-bottom:var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--border-faint);display:flex;align-items:center;gap:var(--sp-2)}
  .detail-section-title::before{content:'';width:3px;height:14px;background:var(--grad-cinnabar);border-radius:2px}
  .empty-state{text-align:center;padding:var(--sp-12) var(--sp-6);color:var(--ink-light)}
  .empty-state-icon{font-size:56px;margin-bottom:var(--sp-4);opacity:0.3}
  .empty-state-text{font-size:var(--fs-lg);margin-bottom:var(--sp-2)}
  .empty-state-desc{font-size:var(--fs-sm)}
  .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
  @media(max-width:768px){.dashboard-grid{grid-template-columns:1fr}}
  .photo-placeholder-lg{width:100%;aspect-ratio:1;border-radius:var(--r-lg);background:var(--rice-warm);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--ink-light);overflow:hidden}
  .sub-tabs{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);border-bottom:1px solid var(--border-light)}
  .sub-tab{padding:var(--sp-2) var(--sp-4);cursor:pointer;border-bottom:2px solid transparent;font-size:var(--fs-md);color:var(--ink-muted);transition:all var(--t-fast)}
  .sub-tab:hover{color:var(--ink)}
  .sub-tab.active{color:var(--cinnabar);border-bottom-color:var(--cinnabar);font-weight:600}
  .loading-state{text-align:center;padding:var(--sp-8);color:var(--ink-light)}
</style>
{% endblock %}

{% block content %}
<input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

<div class="admin-content" id="adminContent">
  <div class="page-view active" id="page-dashboard"></div>
  <div class="page-view" id="page-receive"></div>
  <div class="page-view" id="page-treatment"></div>
  <div class="page-view" id="page-material"></div>
  <div class="page-view" id="page-adoption-info"></div>
  <div class="page-view" id="page-euthanasia"></div>
  <div class="page-view" id="page-ledger"></div>
  <div class="page-view" id="page-profile"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>window.TNR_USER = {{ user_data|safe }};</script>
<script src="{% static 'js/tnr-api.js' %}"></script>
<script>
/* ====================================================
   宠物医院端 SPA · 全部业务逻辑（TNR_API 异步调用）
   ==================================================== */

const Hospital = {
  titles: {
    'dashboard': '首页看板',
    'receive': '动物交接管理',
    'treatment': '诊疗业务管理',
    'material': '物料库存管理',
    'adoption-info': '领养信息维护',
    'euthanasia': '安乐死处置',
    'ledger': '单据台账',
    'profile': '个人中心'
  },

  state: {
    currentPage: 'dashboard',
    receiveTab: 'pending',
    treatmentTab: 'operate',
    materialTab: 'pending',
    ledgerTab: 'transfer',
    treatmentPetId: null,
    treatmentData: { items: {}, sterilization: null, vaccine: null, deworming: null, chip: null }
  },

  /* ========== 初始化 ========== */
  init() {
    this.bindSidebarNav();
    this.navigate('dashboard');
  },

  bindSidebarNav() {
    const navItems = document.querySelectorAll('.portal-sidebar-nav .nav-item[data-nav]');
    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const page = item.dataset.nav;
        if (page) {
          navItems.forEach(x => x.classList.remove('active'));
          item.classList.add('active');
          this.navigate(page);
        }
      });
    });
  },

  navigate(pageId) {
    this.state.currentPage = pageId;
    document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + pageId);
    if (page) {
      page.classList.add('active');
      page.innerHTML = '<div class="loading-state">加载中...</div>';
    }
    const titleEl = document.querySelector('.portal-topbar-title');
    if (titleEl) titleEl.textContent = this.titles[pageId] || '';
    const renderer = this['render_' + pageId.replace(/-/g, '_')];
    if (renderer) renderer.call(this);
  },

  navigateTo(pageId) {
    const el = document.querySelector('.nav-item[data-nav="' + pageId + '"]');
    if (el) el.click();
  },

  /* ========== 辅助方法 ========== */
  currentUser() { return TNR_API.getCurrentUser(); },
  getHospitalId() { const u = this.currentUser(); return u ? u.institution_id : null; },
  getHospitalName() { const u = this.currentUser(); return u ? (u.institution_name || u.name) : ''; },

  formatDate(iso) {
    if (!iso) return '—';
    const s = String(iso);
    if (s.length >= 10) return s.substr(0, 10);
    return s;
  },

  formatDateTime(iso) {
    if (!iso) return '—';
    const s = String(iso);
    if (s.length >= 16) return s.substr(0, 16).replace('T', ' ');
    return this.formatDate(iso);
  },

  parsePetCodes(codes) {
    if (!codes) return [];
    if (Array.isArray(codes)) return codes;
    return String(codes).split(',').map(c => c.trim()).filter(Boolean);
  },

  escape(s) { return TNR_UI.escape(s); },

  transferStatusBadge(s) {
    const m = {'pending': ['待接收', 'badge-warning'], 'received': ['已接收', 'badge-success'], 'rejected': ['已驳回', 'badge-danger']};
    const v = m[s] || [s, 'badge-default'];
    return '<span class="badge ' + v[1] + '">' + v[0] + '</span>';
  },

  treatmentStatusBadge(s) {
    const m = {'completed': ['已完成', 'badge-success'], 'in_progress': ['进行中', 'badge-info']};
    const v = m[s] || [s, 'badge-default'];
    return '<span class="badge ' + v[1] + '">' + v[0] + '</span>';
  },

  /* ========== 1. 首页看板 ========== */
  async render_dashboard() {
    try {
      const [transfers, pets, materials, txns] = await Promise.all([
        TNR_API.getTransfers(),
        TNR_API.getHospitalPets(),
        TNR_API.getMaterials(),
        TNR_API.getMaterialTransactions()
      ]);

      const pendRecv = transfers.filter(t => t.status === 'pending').length;
      const pendTreat = pets.filter(p => p.status === 'in_treatment').length;
      const stockWarn = materials.filter(m => (m.hospital_stock || 0) <= (m.safety_stock || 0)).length;
      const pendAdopt = pets.filter(p => p.status === 'pending_adopt').length;
      const pendingDisp = txns.filter(t => t.type === 'dispatch' && !(t.note || '').includes('[已签收]'));

      const todoItems = [];
      transfers.filter(t => t.status === 'pending').forEach(t => {
        todoItems.push({icon: '📥', title: '待接收转运单 ' + (t.ledger_no || ''), desc: '来源：' + (t.from_shelter_name || '') + ' · ' + (t.pet_count || 0) + '只动物', nav: 'receive'});
      });
      pets.filter(p => p.status === 'in_treatment').forEach(p => {
        todoItems.push({icon: '🔬', title: '待诊疗：' + (p.code || ''), desc: (p.name || '') + ' · ' + (p.species || '') + ' · ' + (p.breed || ''), nav: 'treatment'});
      });
      pendingDisp.forEach(t => {
        todoItems.push({icon: '📦', title: '待接收物料：' + (t.material_name || ''), desc: '数量：' + (t.quantity || 0) + (t.unit || ''), nav: 'material'});
      });
      pets.filter(p => p.status === 'pending_adopt').forEach(p => {
        todoItems.push({icon: '🐾', title: '待领养资料维护：' + (p.code || ''), desc: (p.name || '') + ' · 请完善照片和简介', nav: 'adoption-info'});
      });

      let html = '';
      html += '<div class="stat-grid">';
      html += '<div class="stat-card"><div class="stat-card-icon">📥</div><div><div class="stat-card-value">' + pendRecv + '</div><div class="stat-card-label">待接收动物</div></div></div>';
      html += '<div class="stat-card blue"><div class="stat-card-icon">🔬</div><div><div class="stat-card-value">' + pendTreat + '</div><div class="stat-card-label">待诊疗任务</div></div></div>';
      html += '<div class="stat-card gold"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">' + stockWarn + '</div><div class="stat-card-label">库存预警</div></div></div>';
      html += '<div class="stat-card green"><div class="stat-card-icon">🐾</div><div><div class="stat-card-value">' + pendAdopt + '</div><div class="stat-card-label">待领养资料待维护</div></div></div>';
      html += '</div>';

      html += '<div class="dashboard-grid">';
      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待办任务</div></div><div class="card-body-flush">';
      if (todoItems.length === 0) {
        html += '<div class="empty-state" style="padding:var(--sp-8);"><div class="empty-state-icon">✓</div><div class="empty-state-text">暂无待办任务</div></div>';
      } else {
        todoItems.forEach(t => {
          html += '<div class="todo-item" data-todo="' + t.nav + '">';
          html += '<div class="todo-item-icon">' + t.icon + '</div>';
          html += '<div class="todo-item-content"><div class="todo-item-title">' + this.escape(t.title) + '</div><div class="todo-item-desc">' + this.escape(t.desc) + '</div></div>';
          html += '<span style="color:var(--ink-light);font-size:14px;">›</span></div>';
        });
      }
      html += '</div></div>';

      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>快捷操作</div></div><div class="card-body"><div class="quick-grid">';
      const actions = [
        {icon: '📥', label: '动物交接', page: 'receive'},
        {icon: '🔬', label: '诊疗操作', page: 'treatment'},
        {icon: '📦', label: '物料管理', page: 'material'},
        {icon: '🐾', label: '领养维护', page: 'adoption-info'},
        {icon: '📊', label: '单据台账', page: 'ledger'},
        {icon: '⚰️', label: '安乐死处置', page: 'euthanasia'}
      ];
      actions.forEach(a => {
        html += '<div class="quick-action" data-quick="' + a.page + '"><div class="quick-action-icon">' + a.icon + '</div><div class="quick-action-label">' + a.label + '</div></div>';
      });
      html += '</div></div></div>';
      html += '</div>';

      html += '<div class="card mt-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>库存概览</div></div><div class="card-body">';
      html += this.renderStockOverview(materials);
      html += '</div></div>';

      document.getElementById('page-dashboard').innerHTML = html;

      document.querySelectorAll('[data-todo]').forEach(el => {
        el.addEventListener('click', () => this.navigateTo(el.dataset.todo));
      });
      document.querySelectorAll('[data-quick]').forEach(el => {
        el.addEventListener('click', () => this.navigateTo(el.dataset.quick));
      });
    } catch (e) {
      document.getElementById('page-dashboard').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div><div class="empty-state-desc">' + this.escape(e.message) + '</div></div>';
    }
  },

  renderStockOverview(materials) {
    return materials.map(m => {
      const stock = m.hospital_stock || 0;
      const safety = m.safety_stock || 1;
      const pct = Math.min(100, (stock / (safety * 2)) * 100);
      const isLow = stock < safety;
      const color = isLow ? 'var(--rouge)' : (stock < safety * 1.5 ? 'var(--autumn-gold)' : 'var(--bamboo-green)');
      return '<div style="display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-faint);">' +
        '<div style="flex:1;"><div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px;">' +
        '<span style="font-weight:500;">' + this.escape(m.name) + '</span>' +
        '<span class="badge ' + (isLow ? 'badge-danger' : 'badge-default') + '">' + TNR_API.getMaterialCategoryText(m.category) + '</span>' +
        (isLow ? '<span class="badge badge-danger">库存不足</span>' : '') + '</div>' +
        '<div class="stock-bar"><div class="stock-bar-fill" style="width:' + pct + '%;background:' + color + ';"></div></div></div>' +
        '<div style="text-align:right;min-width:100px;"><div style="font-family:var(--font-display);font-size:var(--fs-xl);font-weight:700;color:' + color + ';">' + stock +
        '<span style="font-size:var(--fs-sm);color:var(--ink-muted);font-weight:400;"> / ' + safety + (m.unit || '') + '</span></div>' +
        '<div style="font-size:var(--fs-xs);color:var(--ink-light);">当前 / 安全库存</div></div></div>';
    }).join('');
  },

  /* ========== 2. 动物交接管理 ========== */
  async render_receive() {
    try {
      const transfers = await TNR_API.getTransfers();
      const pend = transfers.filter(t => t.status === 'pending').length;
      const recv = transfers.filter(t => t.status === 'received').length;
      const rej = transfers.filter(t => t.status === 'rejected').length;

      let html = '<div class="tabs">' +
        '<div class="tab-item ' + (this.state.receiveTab === 'pending' ? 'active' : '') + '" data-rtab="pending">待接收 (' + pend + ')</div>' +
        '<div class="tab-item ' + (this.state.receiveTab === 'received' ? 'active' : '') + '" data-rtab="received">已接收 (' + recv + ')</div>' +
        '<div class="tab-item ' + (this.state.receiveTab === 'rejected' ? 'active' : '') + '" data-rtab="rejected">已驳回 (' + rej + ')</div>' +
        '</div><div id="receiveTabContent"></div>';

      document.getElementById('page-receive').innerHTML = html;

      document.querySelectorAll('#page-receive [data-rtab]').forEach(el => {
        el.addEventListener('click', () => {
          this.state.receiveTab = el.dataset.rtab;
          document.querySelectorAll('#page-receive .tab-item').forEach((t, i) => {
            t.classList.toggle('active', ['pending','received','rejected'][i] === this.state.receiveTab);
          });
          this.renderReceiveTab(transfers);
        });
      });

      this.renderReceiveTab(transfers);
    } catch (e) {
      document.getElementById('page-receive').innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async renderReceiveTab(allTransfers) {
    const transfers = allTransfers.filter(t => t.status === this.state.receiveTab);
    const c = document.getElementById('receiveTabContent');
    if (!c) return;

    if (transfers.length === 0) {
      const labels = {pending: '待接收', received: '已接收', rejected: '已驳回'};
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">暂无数据</div><div class="empty-state-desc">暂无' + (labels[this.state.receiveTab] || '') + '的交接单</div></div>';
      return;
    }

    let pets = [];
    try { pets = await TNR_API.getHospitalPets(); } catch(e) { pets = []; }

    const rows = transfers.map(t => {
      const codes = this.parsePetCodes(t.pet_codes);
      const petInfo = codes.map(code => {
        const p = pets.find(x => x.code === code);
        if (!p) return '<div style="display:flex;align-items:center;gap:var(--sp-2);padding:4px 0;"><div class="photo-placeholder">🐾</div><div><div style="font-weight:500;">' + this.escape(code) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">未知</div></div></div>';
        return '<div style="display:flex;align-items:center;gap:var(--sp-2);padding:4px 0;"><div class="photo-placeholder">🐾</div><div><div style="font-weight:500;">' + this.escape(p.code) + '</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + this.escape(p.name || '') + ' · ' + this.escape(p.species || '') + ' · ' + this.escape(p.breed || '') + ' · ' + this.escape(p.gender || '') + '</div></div></div>';
      }).join('');

      let actions = '';
      if (t.status === 'pending') {
        actions = '<button class="btn btn-success btn-sm" data-receive="' + t.id + '">确认签收</button><button class="btn btn-danger btn-sm" data-reject="' + t.id + '">驳回</button>';
      } else if (t.status === 'rejected') {
        actions = '<button class="btn btn-secondary btn-sm" data-view-reject="' + t.id + '">查看驳回理由</button>';
      }

      return '<tr><td><div style="font-weight:500;">' + this.escape(t.ledger_no || '') + '</div><div style="font-size:var(--fs-xs);color:var(--ink-light);">' + this.formatDateTime(t.created_at) + '</div></td>' +
        '<td>' + (petInfo || '<span class="text-muted">—</span>') + '</td>' +
        '<td>' + this.escape(t.from_shelter_name || '') + '</td>' +
        '<td>' + (t.pet_count || 0) + '</td>' +
        '<td>' + this.transferStatusBadge(t.status) + '</td>' +
        '<td><div class="flex gap-2">' + actions + '</div></td></tr>';
    }).join('');

    c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>交接单号</th><th>宠物信息</th><th>来源捕捉点</th><th>数量</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

    c.querySelectorAll('[data-receive]').forEach(btn => {
      btn.addEventListener('click', () => this.confirmReceive(btn.dataset.receive));
    });
    c.querySelectorAll('[data-reject]').forEach(btn => {
      btn.addEventListener('click', () => this.rejectTransfer(btn.dataset.reject));
    });
    c.querySelectorAll('[data-view-reject]').forEach(btn => {
      btn.addEventListener('click', () => this.viewRejectReason(btn.dataset.viewReject, allTransfers));
    });
  },

  async confirmReceive(transferId) {
    TNR_UI.confirm('确认签收该转运单？签收后宠物状态将变更为「待诊疗」。', '确认签收').then(async ok => {
      if (!ok) return;
      try {
        const res = await TNR_API.receiveTransfer(transferId);
        if (res.success) {
          TNR_UI.toast('签收成功，宠物已进入待诊疗状态', 'success');
          this.render_receive();
        } else {
          TNR_UI.toast(res.message || '签收失败', 'danger');
        }
      } catch (e) {
        TNR_UI.toast(e.message || '操作失败', 'danger');
      }
    });
  },

  rejectTransfer(transferId) {
    TNR_UI.modal({
      title: '驳回转运单',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML = '<div class="form-group"><label class="form-label">驳回理由<span class="req">*</span></label><textarea class="form-textarea" id="rejectReasonInput" placeholder="请填写驳回理由" required></textarea></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-danger" id="confirmRejectBtn">确认驳回</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#confirmRejectBtn').onclick = async () => {
          const r = bodyEl.querySelector('#rejectReasonInput').value.trim();
          if (!r) { TNR_UI.toast('请填写驳回理由', 'warning'); return; }
          try {
            const res = await TNR_API.rejectTransfer(transferId, r);
            if (res.success) {
              TNR_UI.toast('已驳回该转运单', 'success');
              closeFn();
              this.render_receive();
            } else {
              TNR_UI.toast(res.message || '驳回失败', 'danger');
            }
          } catch (e) {
            TNR_UI.toast(e.message || '操作失败', 'danger');
          }
        };
      }
    });
  },

  viewRejectReason(transferId, transfers) {
    const t = transfers.find(x => String(x.id) === String(transferId));
    TNR_UI.modal({
      title: '驳回理由',
      body: '<div style="padding:var(--sp-3);background:var(--rouge-light);border-radius:var(--r-md);font-size:var(--fs-md);color:var(--ink-text);line-height:1.8;">' + this.escape(t ? (t.reject_reason || '无') : '无') + '</div>',
      actions: '<button class="btn btn-primary" data-modal-close>关闭</button>'
    });
  },

  /* ========== 3. 诊疗业务管理 ========== */
  async render_treatment() {
    const page = document.getElementById('page-treatment');
    let html = '<div class="sub-tabs">' +
      '<div class="sub-tab ' + (this.state.treatmentTab === 'operate' ? 'active' : '') + '" data-ttab="operate">诊疗操作</div>' +
      '<div class="sub-tab ' + (this.state.treatmentTab === 'list' ? 'active' : '') + '" data-ttab="list">诊疗记录</div>' +
      '</div><div id="treatmentContent"></div>';
    page.innerHTML = html;

    page.querySelectorAll('[data-ttab]').forEach(el => {
      el.addEventListener('click', () => {
        this.state.treatmentTab = el.dataset.ttab;
        page.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        this.renderTreatmentContent();
      });
    });

    this.renderTreatmentContent();
  },

  async renderTreatmentContent() {
    if (this.state.treatmentTab === 'operate') {
      this.renderTreatmentOperate();
    } else {
      this.renderTreatmentList();
    }
  },

  async renderTreatmentOperate() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const pets = await TNR_API.getHospitalPets('in_treatment');
      if (pets.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔬</div><div class="empty-state-text">暂无待诊疗动物</div><div class="empty-state-desc">请先在「动物交接管理」中确认接收转运单</div><button class="btn btn-primary mt-4" data-nav-btn="receive">前往动物交接管理</button></div>';
        c.querySelector('[data-nav-btn]')?.addEventListener('click', () => this.navigateTo('receive'));
        return;
      }

      const selectedPet = pets.find(p => String(p.id) === String(this.state.treatmentPetId)) || pets[0];
      this.state.treatmentPetId = selectedPet.id;

      let html = '<div class="card mb-5"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>选择诊疗动物</div></div><div class="card-body"><div style="display:grid;gap:var(--sp-2);">';
      pets.forEach(p => {
        html += '<div class="pet-select-item ' + (String(p.id) === String(selectedPet.id) ? 'selected' : '') + '" data-pet="' + p.id + '">' +
          '<div class="photo-placeholder">🐾</div>' +
          '<div style="flex:1;"><div style="font-weight:500;">' + this.escape(p.code) + ' · ' + this.escape(p.name || '') + '</div>' +
          '<div style="font-size:var(--fs-sm);color:var(--ink-muted);">' + this.escape(p.species || '') + ' · ' + this.escape(p.breed || '') + ' · ' + this.escape(p.gender || '') + ' · ' + this.escape(p.age || '') + '</div></div>' +
          '<span class="badge badge-info">' + TNR_API.getPetStatusText(p.status) + '</span></div>';
      });
      html += '</div></div></div><div id="treatmentFormArea"></div>';
      c.innerHTML = html;

      c.querySelectorAll('[data-pet]').forEach(el => {
        el.addEventListener('click', () => {
          this.state.treatmentPetId = el.dataset.pet;
          this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
          this.renderTreatmentOperate();
        });
      });

      this.renderTreatmentForm(selectedPet);
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async renderTreatmentForm(pet) {

      (td.items.sterilization ? '<div class="treatment-item-body">' + (td.sterilization ?
        '<div style="display:flex;align-items:center;gap:var(--sp-3);"><span style="font-size:var(--fs-sm);color:var(--ink-muted);">手术日期：' + esc(td.sterilization.surgery_date || '—') + ' · 医生：' + esc(td.sterilization.surgeon || '—') + '</span><button class="btn btn-outline btn-sm" data-ster-modal>修改病历</button></div>'
        : '<button class="btn btn-outline btn-sm" data-ster-modal>填写病历</button>') + '</div>' : '') +

    html += '<div class="treatment-item-card ' + (td.items.vaccine ? 'checked' : '') + '" data-toggle="vaccine" style="margin-bottom:var(--sp-3);"><div class="treatment-item-header">' +

      (td.items.vaccine ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">疫苗类型</label><select class="form-select" id="vaccineSelect"><option value="">请选择</option>' +

        '</select></div><div class="form-group" style="margin:0;"><label class="form-label">批号</label><input type="text" class="form-input" id="vaccineBatch" value="' + (td.vaccine ? esc(td.vaccine.batch_no || '') : '') + '" readonly /></div></div>' +
        '<div class="form-group" style="margin:var(--sp-2) 0 0;"><label class="form-label">接种日期</label><input type="date" class="form-input" id="vaccineDate" value="' + (td.vaccine ? td.vaccine.date : new Date().toISOString().substr(0, 10)) + '" /></div></div>' : '') +
      '</div>';

    /* 驱虫 */
    html += '<div class="treatment-item-card ' + (td.items.deworming ? 'checked' : '') + '" data-toggle="deworming" style="margin-bottom:var(--sp-3);"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.deworming ? 'checked' : '') + ' data-check="deworming" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +

      (td.items.deworming ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">驱虫药类型</label><select class="form-select" id="dewormerSelect"><option value="">请选择</option>' +
        dewormers.map(d => '<option value="' + d.id + '" ' + (td.deworming && String(td.deworming.material_id) === String(d.id) ? 'selected' : '') + ' ' + ((d.hospital_stock || 0) <= 0 ? 'disabled' : '') + '>' + esc(d.name) + ' (库存:' + (d.hospital_stock || 0) + (d.unit || '') + ')</option>').join('') +
        '</select></div><div class="form-group" style="margin:0;"><label class="form-label">批号</label><input type="text" class="form-input" id="dewormerBatch" value="' + (td.deworming ? esc(td.deworming.batch_no || '') : '') + '" readonly /></div></div>' +
        '<div class="form-group" style="margin:var(--sp-2) 0 0;"><label class="form-label">用药日期</label><input type="date" class="form-input" id="dewormerDate" value="' + (td.deworming ? td.deworming.date : new Date().toISOString().substr(0, 10)) + '" /></div></div>' : '') +
      '</div>';

    /* 芯片 */
    html += '<div class="treatment-item-card ' + (td.items.chip ? 'checked' : '') + '" data-toggle="chip"><div class="treatment-item-header">' +
      '<input type="checkbox" ' + (td.items.chip ? 'checked' : '') + ' data-check="chip" style="width:18px;height:18px;accent-color:var(--cinnabar);cursor:pointer;" />' +
      '<div class="treatment-item-icon">📡</div><div style="flex:1;"><div style="font-weight:500;">芯片植入</div><div style="font-size:var(--fs-sm);color:var(--ink-muted);">输入可用芯片编号，绑定宠物档案，库存-1，芯片永久不可复用</div></div></div>' +
      (td.items.chip ? '<div class="treatment-item-body"><div class="form-row"><div class="form-group" style="margin:0;"><label class="form-label">芯片编号<span class="req">*</span></label><input type="text" class="form-input" id="chipInput" value="' + (td.chip ? esc(td.chip.chip_no || '') : '') + '" placeholder="请输入可用芯片编号" /></div>' +
        '<div class="form-group" style="margin:0;"><label class="form-label">植入日期</label><input type="date" class="form-input" id="chipDate" value="' + (td.chip ? td.chip.date : new Date().toISOString().substr(0, 10)) + '" /></div></div></div>' : '') +
      '</div>';

    html += '</div></div>';

    /* 操作按钮 */
    html += '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;"><button class="btn btn-secondary" data-reset>重置</button><button class="btn btn-primary" data-save>保存诊疗记录</button></div>';
    html += '</div></div>';

    area.innerHTML = html;

    /* 绑定事件 */
    area.querySelectorAll('[data-toggle]').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        const item = card.dataset.toggle;
        const cb = card.querySelector('input[type="checkbox"]');
        const checked = !cb.checked;
        cb.checked = checked;
        this.state.treatmentData.items[item] = checked;
        if (!checked) {
          if (item === 'sterilization') this.state.treatmentData.sterilization = null;
          if (item === 'vaccine') this.state.treatmentData.vaccine = null;
          if (item === 'deworming') this.state.treatmentData.deworming = null;
          if (item === 'chip') this.state.treatmentData.chip = null;
        }
        this.renderTreatmentForm(pet);
      });
    });

    area.querySelectorAll('[data-check]').forEach(cb => {
      cb.addEventListener('change', e => {
        e.stopPropagation();
        const item = cb.dataset.check;
        this.state.treatmentData.items[item] = cb.checked;
        if (!cb.checked) {
          if (item === 'sterilization') this.state.treatmentData.sterilization = null;
          if (item === 'vaccine') this.state.treatmentData.vaccine = null;
          if (item === 'deworming') this.state.treatmentData.deworming = null;
          if (item === 'chip') this.state.treatmentData.chip = null;
        }
        this.renderTreatmentForm(pet);
      });
    });

      e.stopPropagation();
      this.openSterilizationModal(pet);
    });

    area.querySelector('[data-reset]')?.addEventListener('click', () => {
      this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
      this.renderTreatmentForm(pet);
    });

    area.querySelector('[data-save]')?.addEventListener('click', () => this.saveTreatment(pet));

    /* 疫苗/驱虫选择联动 */
    const vSel = area.querySelector('#vaccineSelect');
    if (vSel) vSel.addEventListener('change', () => {
      const mid = vSel.value;
      if (!mid) { this.state.treatmentData.vaccine = null; return; }
      const mat = materials.find(m => String(m.id) === String(mid));
      if (mat) {
        this.state.treatmentData.vaccine = {material_id: mid, type: mat.name, batch_no: mat.batch_no, date: area.querySelector('#vaccineDate')?.value || new Date().toISOString().substr(0, 10), quantity: 1};
        const bEl = area.querySelector('#vaccineBatch');
        if (bEl) bEl.value = mat.batch_no || '';
      }
    });

    const dSel = area.querySelector('#dewormerSelect');
    if (dSel) dSel.addEventListener('change', () => {
      const mid = dSel.value;
      if (!mid) { this.state.treatmentData.deworming = null; return; }
      const mat = materials.find(m => String(m.id) === String(mid));
      if (mat) {
        this.state.treatmentData.deworming = {material_id: mid, type: mat.name, batch_no: mat.batch_no, date: area.querySelector('#dewormerDate')?.value || new Date().toISOString().substr(0, 10), quantity: 1};
        const bEl = area.querySelector('#dewormerBatch');
        if (bEl) bEl.value = mat.batch_no || '';
      }
    });
  },

  openSterilizationModal(pet) {
    const td = this.state.treatmentData, ex = td.sterilization || {};
    TNR_UI.modal({
      title: '绝育手术病历档案',
      body: (bodyEl, closeFn) => {
        bodyEl.innerHTML =
          '<div class="form-row"><div class="form-group"><label class="form-label">手术日期<span class="req">*</span></label><input type="date" class="form-input" id="sterSurgeryDate" value="' + (ex.surgery_date || new Date().toISOString().substr(0, 10)) + '" /></div>' +
          '<div class="form-group"><label class="form-label">主刀医生<span class="req">*</span></label><input type="text" class="form-input" id="sterSurgeon" value="' + this.escape(ex.surgeon || '') + '" placeholder="请输入医生姓名" /></div></div>' +
          '<div class="form-group"><label class="form-label">诊断<span class="req">*</span></label><textarea class="form-textarea" id="sterDiagnosis" placeholder="请输入诊断信息">' + this.escape(ex.diagnosis || '') + '</textarea></div>' +
          '<div class="form-group"><label class="form-label">麻醉方式<span class="req">*</span></label><select class="form-select" id="sterAnesthesia"><option value="吸入麻醉" ' + (ex.anesthesia === '吸入麻醉' ? 'selected' : '') + '>吸入麻醉</option><option value="注射麻醉" ' + (ex.anesthesia === '注射麻醉' ? 'selected' : '') + '>注射麻醉</option><option value="复合麻醉" ' + (ex.anesthesia === '复合麻醉' ? 'selected' : '') + '>复合麻醉</option></select></div>' +
          '<div class="form-group"><label class="form-label">手术过程<span class="req">*</span></label><textarea class="form-textarea" id="sterProcedure" placeholder="请描述手术过程">' + this.escape(ex.procedure || '') + '</textarea></div>' +
          '<div class="form-group"><label class="form-label">恢复情况<span class="req">*</span></label><textarea class="form-textarea" id="sterRecovery" placeholder="请描述术后恢复情况">' + this.escape(ex.recovery || '') + '</textarea></div>' +
          '<div style="display:flex;gap:var(--sp-3);justify-content:flex-end;margin-top:var(--sp-4);"><button class="btn btn-secondary" data-close>取消</button><button class="btn btn-primary" id="sterSaveBtn">保存病历</button></div>';
        bodyEl.querySelector('[data-close]').onclick = closeFn;
        bodyEl.querySelector('#sterSaveBtn').onclick = () => {
          const d = {
            surgery_date: bodyEl.querySelector('#sterSurgeryDate').value,
            surgeon: bodyEl.querySelector('#sterSurgeon').value.trim(),
            diagnosis: bodyEl.querySelector('#sterDiagnosis').value.trim(),
            anesthesia: bodyEl.querySelector('#sterAnesthesia').value,
            procedure: bodyEl.querySelector('#sterProcedure').value.trim(),
            recovery: bodyEl.querySelector('#sterRecovery').value.trim()
          };
          if (!d.surgery_date || !d.surgeon || !d.diagnosis || !d.procedure || !d.recovery) { TNR_UI.toast('请填写所有必填项', 'warning'); return; }
          this.state.treatmentData.sterilization = d;
          TNR_UI.toast('病历档案已保存', 'success');
          closeFn();
          this.renderTreatmentForm(pet);
        };
      }
    });
  },

  async saveTreatment(pet) {
    const td = this.state.treatmentData;
    const items = td.items;
    if (!items.sterilization && !items.vaccine && !items.deworming && !items.chip) { TNR_UI.toast('请至少选择一项诊疗项目', 'warning'); return; }
    if (items.sterilization && !td.sterilization) { TNR_UI.toast('请填写绝育手术病历', 'warning'); return; }

    const area = document.getElementById('treatmentFormArea');
    if (!area) return;

    if (items.vaccine) {
      const vSel = area.querySelector('#vaccineSelect');
      if (!vSel || !vSel.value) { TNR_UI.toast('请选择疫苗类型', 'warning'); return; }
      const vDate = area.querySelector('#vaccineDate')?.value || new Date().toISOString().substr(0, 10);
      const mat = await TNR_API.getMaterials().then(ms => ms.find(m => String(m.id) === String(vSel.value)));
      td.vaccine = {material_id: vSel.value, type: mat ? mat.name : '', batch_no: mat ? mat.batch_no : '', date: vDate, quantity: 1};
    }
    if (items.deworming) {
      const dSel = area.querySelector('#dewormerSelect');
      if (!dSel || !dSel.value) { TNR_UI.toast('请选择驱虫药类型', 'warning'); return; }
      const dDate = area.querySelector('#dewormerDate')?.value || new Date().toISOString().substr(0, 10);
      const mat = await TNR_API.getMaterials().then(ms => ms.find(m => String(m.id) === String(dSel.value)));
      td.deworming = {material_id: dSel.value, type: mat ? mat.name : '', batch_no: mat ? mat.batch_no : '', date: dDate, quantity: 1};
    }
    if (items.chip) {
      const cInput = area.querySelector('#chipInput');
      if (!cInput || !cInput.value.trim()) { TNR_UI.toast('请输入芯片编号', 'warning'); return; }
      td.chip = {chip_no: cInput.value.trim(), date: area.querySelector('#chipDate')?.value || new Date().toISOString().substr(0, 10)};
    }

    const allChecked = items.sterilization && items.vaccine && items.deworming && items.chip;
    const payload = {
      pet_id: pet.id,
      items: {
        sterilization: !!items.sterilization,
        vaccine: !!items.vaccine,
        deworming: !!items.deworming,
        chip: !!items.chip
      },
      sterilization: td.sterilization || null,
      vaccine: td.vaccine || null,
      deworming: td.deworming || null,
      chip: td.chip || null,
      status: allChecked ? 'completed' : 'in_progress'
    };

    try {
      const res = await TNR_API.createTreatment(payload);
      if (res.success) {
        TNR_UI.toast('诊疗记录保存成功' + (allChecked ? '，诊疗已完成' : ''), 'success');
        this.state.treatmentData = {items: {}, sterilization: null, vaccine: null, deworming: null, chip: null};
        this.renderTreatmentOperate();
      } else {
        TNR_UI.toast(res.message || '保存失败', 'danger');
      }
    } catch (e) {
      TNR_UI.toast(e.message || '操作失败', 'danger');
    }
  },

  async renderTreatmentList() {
    const c = document.getElementById('treatmentContent');
    if (!c) return;
    c.innerHTML = '<div class="loading-state">加载中...</div>';

    try {
      const treatments = await TNR_API.getTreatments();
      if (treatments.length === 0) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无诊疗记录</div></div>';
        return;
      }

      const rows = treatments.map(t => {
        const items = [];
        if (t.items_sterilization) items.push('<span class="badge badge-cinnabar">绝育</span>');
        if (t.items_vaccine) items.push('<span class="badge badge-info">疫苗</span>');
        if (t.items_deworming) items.push('<span class="badge badge-success">驱虫</span>');
        if (t.items_chip) items.push('<span class="badge badge-warning">芯片</span>');
        return '<tr><td><div style="font-weight:500;">' + this.escape(t.pet_code || '') + '</div></td>' +
          '<td>' + (items.join(' ') || '—') + '</td>' +
          '<td>' + this.escape(t.hospital_name || '') + '</td>' +
          '<td>' + this.escape(t.sterilization_surgeon || t.operator_name || '—') + '</td>' +
          '<td>' + this.formatDateTime(t.created_at) + '</td>' +
          '<td>' + this.treatmentStatusBadge(t.status) + '</td>' +
          '<td><button class="btn-link" data-view-treatment="' + t.id + '">详情</button></td></tr>';
      }).join('');

      c.innerHTML = '<div class="table-wrapper"><table class="data-table"><thead><tr><th>宠物编号</th><th>诊疗项目</th><th>医院</th><th>医生</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

      c.querySelectorAll('[data-view-treatment]').forEach(btn => {
        btn.addEventListener('click', () => this.viewTreatmentDetail(btn.dataset.viewTreatment));
      });
    } catch (e) {
      c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">加载失败</div></div>';
    }
  },

  async viewTreatmentDetail(treatmentId) {
    try {
      const res = await fetch('/api/business/treatments/' + treatmentId + '/');
      const result = await res.json();
      if (!result.success) { TNR_UI.toast(result.message || '加载失败', 'danger'); return; }
      const t = result.data;
      const pet = t.pet || {};

      let html = '<div class="detail-section"><div class="detail-section-title">宠物信息</div>' + TNR_UI.renderDescList([
        {label: '宠物编号', value: this.escape(t.pet_code)},
        {label: '名称', value: this.escape(pet.name || '—')},
        {label: '物种/品种', value: pet.species ? (this.escape(pet.species) + (pet.breed ? ' / ' + this.escape(pet.breed) : '')) : '—'},
        {label: '性别/年龄', value: (pet.gender || pet.age) ? ((pet.gender ? this.escape(pet.gender) : '') + (pet.gender && pet.age ? ' / ' : '') + (pet.age ? this.escape(pet.age) : '')) : '—'}
      ]) + '</div>';

      html += '<div class="detail-section"><div class="detail-section-title">诊疗项目</div>' + TNR_UI.renderDescList([
        {label: '绝育手术', value: t.items_sterilization ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '疫苗接种', value: t.items_vaccine ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '驱虫护理', value: t.items_deworming ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'},
        {label: '芯片植入', value: t.items_chip ? '<span class="badge badge-success">已执行</span>' : '<span class="badge badge-default">未执行</span>'}
      ]) + '</div>';

      if (t.sterilization_surgeon) {
        html += '<div class="detail-section"><div class="detail-section-title">绝育病历档案</div>' + TNR_UI.renderDescList([
          {label: '手术日期', value: this.formatDate(t.sterilization_surgery_date)},
          {label: '主刀医生', value: this.escape(t.sterilization_surgeon)},
          {label: '麻醉方式', value: this.escape(t.sterilization_anesthesia)},
          {label: '诊断', value: this.escape(t.sterilization_diagnosis), full: true},
          {label: '手术过程', value: this.escape(t.sterilization_procedure), full: true},
          {label: '恢复情况', value: this.escape(t.sterilization_recovery), full: true}
        ]) + '</div>';
      }
      if (t.vaccine_type) {
        html += '<div class="detail-section"><div class="detail-section-title">疫苗接种记录</div>' + TNR_UI.renderDescList([
          {label: '疫苗类型', value: this.escape(t.vaccine_type)},
          {label: '批号', value: this.escape(t.vaccine_batch_no)},
          {label: '接种日期', value: this.formatDate(t.vaccine_date)},
          {label: '数量', value: (t.vaccine_quantity || 0) + '支'}
        ]) + '</div>';
      }
      if (t.deworming_type) {
        html += '<div class="detail-section"><div class="detail-section-title">驱虫护理记录</div>' + TNR_UI.renderDescList([
          {label: '驱虫药类型', value: this.escape(t.deworming_type)},
          {label: '批号', value: this.escape(t.deworming_batch_no)},
          {label: '用药日期', value: this.formatDate(t.deworming_date)},
          {label: '数量', value: (t.deworming_quantity || 0) + '盒'}
        ]) + '</div>';
      }
      if (t.chip_no) {
        html += '<div class="detail-section"><div class="detail-section-title">芯片植入记录</div>' + TNR_UI.renderDescList([
          {label: '芯片编号', value: this.escape(t.chip_no)},
          {label: '植入日期', value: this.formatDate(t.chip_date)}
        ]) + '</div>';
      }
      html += '<div class="detail-section"><div class="detail-section-title">其他信息</div>' + TNR_UI.renderDescList([
        {label: '医院', value: this.escape(t.hospital_name)},
        {label: '操作人', value: this.escape(t.operator_name)},
        {label: '创建时间', value: this.formatDateTime(t.created_at)},
        {label: '状态', value: this.treatmentStatusBadge(t.status)}
      ]) + '</div>';

      TNR_UI.drawer({title: '诊疗记录详情 · ' + this.escape(t.pet_code), body: html});
