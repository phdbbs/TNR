        <div class="tab-item" data-tab="materials">物料台账</div>
      </div>
      <div id="ledgerContent"></div>
    `;
    el.querySelectorAll('.tab-item').forEach(t => {
      t.addEventListener('click', () => {
        el.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.renderLedgerTab(t.dataset.tab);
      });
    });
    this.renderLedgerTab('captures');
  },

  renderLedgerTab(tab) {
    const wrap = document.getElementById('ledgerContent');
    let data = [], columns = [], title = '';
    if (tab === 'captures') {
      title = '捕捉台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.captures);
      columns = [
        { title: '台账单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '小区', key: 'communityName' },
        { title: '物业', key: 'propertyName' },
        { title: '数量', key: 'petCount' },
        { title: '状态', render: r => this.statusBadge(r.status) },
        { title: '操作员', key: 'operatorName' },
        { title: '登记时间', key: 'createdAt' }
      ];
    } else if (tab === 'transfers') {
      title = '转运台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.transfers);
      columns = [
        { title: '台账单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '发出捕捉点', key: 'fromShelterName' },
        { title: '接收医院', key: 'toHospitalName' },
        { title: '数量', key: 'petCount' },
        { title: '状态', render: r => this.statusBadge(r.status) },
        { title: '创建时间', key: 'createdAt' }
      ];
    } else if (tab === 'treatments') {
      title = '诊疗台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.treatments);
      columns = [
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '医院', key: 'hospitalName' },
        { title: '绝育', render: r => r.items && r.items.sterilization ? TNR_UI.statusBadge('已绝育', 'success') : '—' },
        { title: '疫苗', render: r => r.items && r.items.vaccine ? TNR_UI.statusBadge('已接种', 'success') : '—' },
        { title: '驱虫', render: r => r.items && r.items.deworming ? TNR_UI.statusBadge('已驱虫', 'success') : '—' },
        { title: '芯片', render: r => r.chip ? '<span class="chip-display">' + TNR_UI.escape(r.chip.chipNo) + '</span>' : '—' },
        { title: '状态', render: r => this.statusBadge(r.status) },
        { title: '时间', key: 'createdAt' }
      ];
    } else if (tab === 'releases') {
      title = '放养台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.releases);
      columns = [
        { title: '台账单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '放养小区', key: 'communityName' },
        { title: '接收人', key: 'receiverName' },
        { title: '状态', render: r => TNR_UI.statusBadge('已放养', 'success') },
        { title: '放养时间', key: 'releasedAt' }
      ];
    } else if (tab === 'adoptions') {
      title = '领养台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.adoptions);
      columns = [
        { title: '台账单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '领养人', key: 'adopterName' },
        { title: '电话', key: 'adopterPhone' },
        { title: '医院', key: 'hospitalName' },
        { title: '状态', render: r => this.statusBadge(r.status || 'completed') },
        { title: '领养时间', key: 'adoptedAt' }
      ];
    } else if (tab === 'materials') {
      title = '物料台账';
      data = TNR_DB.getAll(TNR_DB.KEYS.materialTxns);
      const typeMap = { purchase: ['采购', 'success'], dispatch: ['下发', 'info'], consume: ['消耗', 'warning'] };
      columns = [
        { title: '台账单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo) + '</span>' },
        { title: '类型', render: r => TNR_UI.statusBadge(typeMap[r.type] ? typeMap[r.type][0] : r.type, typeMap[r.type] ? typeMap[r.type][1] : 'default') },
        { title: '物料', key: 'materialName' },
        { title: '数量', render: r => r.quantity + ' ' + r.unit },
        { title: '来源/去向', key: 'fromTo' },
        { title: '日期', key: 'date' },
        { title: '操作员', key: 'operatorName' }
      ];
    }

    wrap.innerHTML = `
      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="card-title-bar"></span>${title}（共 ${data.length} 条）</div>
          <div class="flex gap-2">
            <button class="btn btn-secondary btn-sm" id="btnExportLedger">导出</button>
            <button class="btn btn-secondary btn-sm" id="btnPrintLedger">打印</button>
          </div>
        </div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrapper">${TNR_UI.renderTable({ columns, data, emptyText: '暂无台账数据' })}</div>
        </div>
      </div>
    `;
    document.getElementById('btnExportLedger').addEventListener('click', () => {
      const csv = [];
      csv.push(columns.map(c => c.title).join(','));
      data.forEach(r => {
        csv.push(columns.map(c => {
          const v = typeof c.render === 'function' ? '' : (r[c.key] ?? '');
          return '"' + String(v).replace(/"/g, '""') + '"';
        }).join(','));
      });
      const blob = new Blob(['\ufeff' + csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = title + '.csv'; a.click();
      URL.revokeObjectURL(url);
      TNR_UI.toast('已导出 CSV', 'success');
    });
    document.getElementById('btnPrintLedger').addEventListener('click', () => {
      const printWin = window.open('', '_blank');
      printWin.document.write('<html><head><title>' + title + '</title><style>body{font-family:sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:6px;text-align:left;font-size:12px;}th{background:#f5f0e8;}</style></head><body>');
      printWin.document.write('<h2>' + title + '</h2>');
      printWin.document.write(wrap.querySelector('.table-wrapper').innerHTML);
      printWin.document.write('</body></html>');
      printWin.document.close();
      printWin.print();
    });
  },

  /* ========== 13. 个人中心 ========== */
  render_profile() {
    const el = document.getElementById('page-profile');
    const user = TNR_DB.getCurrentUser();
    const district = TNR_DB.getDistricts().find(d => d.id === user.districtId);
    const shelter = TNR_DB.getInstitutions('shelter', user.districtId).find(s => s.id === user.institutionId);

    el.innerHTML = `
      <div class="form-row" style="align-items: stretch;">
        <div class="card">
          <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>账号信息</div></div>
          <div class="card-body">
            ${TNR_UI.renderDescList([
              { label: '用户名', value: user.username },
              { label: '姓名', value: user.name },
              { label: '角色', value: user.role === 'shelter' ? '捕捉点操作员' : user.role },
              { label: '所属区县', value: district ? district.name : '—' },
              { label: '所属机构', value: shelter ? shelter.name : '—' },
              { label: '联系电话', value: user.phone },
              { label: '账号状态', value: TNR_UI.statusBadge('启用', 'success') },
              { label: '创建时间', value: user.createdAt }
            ])}
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>修改密码</div></div>
          <div class="card-body">
            <div class="form-group"><label class="form-label">原密码</label><input type="password" class="form-input" id="pf_oldPwd"></div>
            <div class="form-group"><label class="form-label">新密码</label><input type="password" class="form-input" id="pf_newPwd"></div>
            <div class="form-group"><label class="form-label">确认新密码</label><input type="password" class="form-input" id="pf_confirmPwd"></div>
            <button class="btn btn-primary" id="btnChangePwd">修改密码</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>操作日志</div></div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrapper" id="logTableWrap"></div>
        </div>
      </div>
    `;

    // 渲染操作日志（从各业务数据汇总）
    const logs = [];
    TNR_DB.getAll(TNR_DB.KEYS.captures).forEach(r => logs.push({ time: r.createdAt, user: r.operatorName, action: '捕捉登记', detail: r.ledgerNo || r.id }));
    TNR_DB.getAll(TNR_DB.KEYS.transfers).forEach(r => logs.push({ time: r.createdAt, user: r.operatorName, action: '转运下发', detail: r.ledgerNo || r.id }));
    TNR_DB.getAll(TNR_DB.KEYS.materialTxns).forEach(r => logs.push({ time: r.date, user: r.operatorName, action: r.type === 'purchase' ? '物料采购' : (r.type === 'dispatch' ? '物料下发' : '物料消耗'), detail: r.ledgerNo }));
    TNR_DB.getAll(TNR_DB.KEYS.releases).forEach(r => logs.push({ time: r.createdAt, user: r.operatorName, action: '放养登记', detail: r.ledgerNo || r.id }));
    TNR_DB.getAll(TNR_DB.KEYS.adoptions).forEach(r => logs.push({ time: r.createdAt, user: r.operatorName, action: '领养登记', detail: r.ledgerNo || r.id }));
    logs.sort((a, b) => (b.time || '').localeCompare(a.time || ''));

    const logCols = [
      { title: '时间', key: 'time' },
      { title: '操作人', key: 'user' },
      { title: '操作类型', render: r => '<span class="badge badge-info">' + r.action + '</span>' },
      { title: '单号', key: 'detail', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.detail) + '</span>' }
    ];
    document.getElementById('logTableWrap').innerHTML = TNR_UI.renderTable({ columns: logCols, data: logs.slice(0, 50), emptyText: '暂无操作日志' });

    document.getElementById('btnChangePwd').addEventListener('click', () => {
      const oldPwd = document.getElementById('pf_oldPwd').value;
      const newPwd = document.getElementById('pf_newPwd').value;
      const confirmPwd = document.getElementById('pf_confirmPwd').value;
      if (!oldPwd || !newPwd || !confirmPwd) { TNR_UI.toast('请填写完整', 'warning'); return; }
      if (oldPwd !== user.password) { TNR_UI.toast('原密码错误', 'danger'); return; }
      if (newPwd !== confirmPwd) { TNR_UI.toast('两次新密码不一致', 'warning'); return; }
      if (newPwd.length < 6) { TNR_UI.toast('新密码至少6位', 'warning'); return; }
      // 更新用户密码
      const users = TNR_DB.getAllRaw(TNR_DB.KEYS.users);
      const idx = users.findIndex(u => u.id === user.id);
      if (idx !== -1) {
        users[idx].password = newPwd;
        TNR_DB._save(TNR_DB.KEYS.users, users);
        TNR_DB.setCurrentUser(users[idx]);
        TNR_UI.toast('密码修改成功', 'success');
        document.getElementById('pf_oldPwd').value = '';
        document.getElementById('pf_newPwd').value = '';
        document.getElementById('pf_confirmPwd').value = '';
      }
    });
  }
};

// 启动
Shelter.init();
</script>
</body>
</html>
