<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>捕捉点端 · TNR流浪动物管理系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tnr-traditional.css">
  <style>
    /* 登录页样式 */
    .login-screen {
      position: fixed;
      inset: 0;
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--grad-sidebar);
      overflow: auto;
      padding: var(--sp-6);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: var(--r-2xl);
      box-shadow: var(--shadow-lg);
      padding: var(--sp-10) var(--sp-8);
      position: relative;
    }
    .login-seal {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border-radius: var(--r-md);
      background: var(--grad-cinnabar);
      color: #fff;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-cinnabar);
    }
    .login-title {
      font-family: var(--font-display);
      font-size: var(--fs-2xl);
      font-weight: 700;
      color: var(--ink);
      text-align: center;
      margin-top: var(--sp-5);
      margin-bottom: var(--sp-1);
    }
    .login-subtitle {
      text-align: center;
      color: var(--ink-muted);
      font-size: var(--fs-sm);
      margin-bottom: var(--sp-6);
    }
    .login-demo-hint {
      margin-top: var(--sp-5);
      padding: var(--sp-3);
      background: var(--azurite-light);
      border-radius: var(--r-md);
      font-size: var(--fs-xs);
      color: var(--azurite);
      text-align: center;
      line-height: 1.8;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--sp-4);
      margin-top: var(--sp-5);
    }
    .quick-action {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-4);
      background: var(--white);
      border-radius: var(--r-xl);
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: all var(--t-base);
    }
    .quick-action:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--cinnabar);
    }
    .quick-action-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--r-lg);
      background: var(--cinnabar-light);
      color: var(--cinnabar);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .quick-action-text { font-size: var(--fs-md); font-weight: 600; color: var(--ink); }
    .quick-action-desc { font-size: var(--fs-xs); color: var(--ink-light); }
    .todo-list-item {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      padding: var(--sp-3) var(--sp-4);
      border-bottom: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background var(--t-fast);
    }
    .todo-list-item:hover { background: var(--rice-light); }
    .todo-list-item:last-child { border-bottom: none; }
    .todo-list-item .badge { flex-shrink: 0; }
    .stock-bar {
      height: 6px;
      background: var(--rice-warm);
      border-radius: var(--r-full);
      overflow: hidden;
      margin-top: var(--sp-1);
    }
    .stock-bar-fill { height: 100%; border-radius: var(--r-full); }
    .chip-display { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-muted); }
    .login-screen.hidden { display: none !important; }
    .form-check.inline { display: inline-flex; }
    .photo-upload-slot {
      aspect-ratio: 1;
      border: 2px dashed var(--border-ink);
      border-radius: var(--r-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--sp-1);
      cursor: pointer;
      transition: all var(--t-fast);
      background: var(--rice-light);
      color: var(--ink-light);
      font-size: var(--fs-xs);
      text-align: center;
      padding: var(--sp-2);
    }
    .photo-upload-slot:hover { border-color: var(--cinnabar); background: var(--cinnabar-light); color: var(--cinnabar); }
    .pet-code-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      padding: 2px 8px;
      background: var(--azurite-light);
      color: var(--azurite);
      border-radius: var(--r-sm);
      font-size: var(--fs-xs);
      font-family: var(--font-mono);
      font-weight: 600;
      margin: 2px;
    }
    .pet-select-item {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-2) var(--sp-3);
      border: 1px solid var(--border-light);
      border-radius: var(--r-md);
      margin-bottom: var(--sp-2);
      cursor: pointer;
      transition: all var(--t-fast);
    }
    .pet-select-item:hover { border-color: var(--cinnabar); background: var(--cinnabar-light); }
    .pet-select-item.selected { border-color: var(--cinnabar); background: var(--cinnabar-light); }
    .pet-select-item input { accent-color: var(--cinnabar); }
    .empty-block {
      text-align: center;
      padding: var(--sp-8);
      color: var(--ink-light);
    }
    .empty-block-icon { font-size: 40px; opacity: 0.4; margin-bottom: var(--sp-2); }
  </style>
</head>
<body>

<!-- ====== 登录页 ====== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-seal">捕</div>
    <div class="login-title">TNR 流浪动物管理系统</div>
    <div class="login-subtitle">捕捉点端 · 捕捉-绝育-放养</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" id="loginUsername" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: var(--sp-4);">登 录</button>
    </form>
    <div class="login-demo-hint">
      演示账号：cy_shelter<br>密码：123456
    </div>
  </div>
</div>

<!-- ====== 主应用 ====== -->
<div id="app" class="hidden">
  <div class="admin-layout">
    <div id="sidebarMount"></div>
    <div class="admin-main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="topbar-toggle" id="sidebarToggle">☰</button>
          <div class="topbar-title" id="topbarTitle">首页看板</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-district" id="topbarDistrict"></div>
          <div class="topbar-time" id="topbarTime"></div>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
        </div>
      </div>
      <div class="admin-content" id="adminContent">

        <!-- 1. 首页看板 -->
        <div class="page-view" id="page-dashboard"></div>
        <!-- 2. 捕捉记录 -->
        <div class="page-view" id="page-capture-list"></div>
        <!-- 3. 新增捕捉登记 -->
        <div class="page-view" id="page-capture-add"></div>
        <!-- 4. 主人领回 -->
        <div class="page-view" id="page-owner-return"></div>
        <!-- 5. 转运管理 -->
        <div class="page-view" id="page-transfer"></div>
        <!-- 6. 物料供应链 -->
        <div class="page-view" id="page-material"></div>
        <!-- 7. 动物回收放养 -->
        <div class="page-view" id="page-release"></div>
        <!-- 8. 领养审核管理 -->
        <div class="page-view" id="page-adoption"></div>
        <!-- 9. 领养回访管控 -->
        <div class="page-view" id="page-followup"></div>
        <!-- 10. 黑名单管理 -->
        <div class="page-view" id="page-blacklist"></div>
        <!-- 11. 安乐死备案 -->
        <div class="page-view" id="page-euthanasia"></div>
        <!-- 12. 全量台账 -->
        <div class="page-view" id="page-ledger"></div>
        <!-- 13. 个人中心 -->
        <div class="page-view" id="page-profile"></div>

      </div>
    </div>
  </div>
</div>

<script src="js/tnr-data.js"></script>
<script src="js/tnr-common.js"></script>
<script>
/* ====================================================
   捕捉点端 SPA · 全部业务逻辑
   ==================================================== */

const Shelter = {
  navGroups: [
    { title: '核心业务', items: [
      { id: 'dashboard', icon: '📊', label: '首页看板' },
      { id: 'capture-list', icon: '📋', label: '捕捉记录' },
      { id: 'capture-add', icon: '➕', label: '新增捕捉登记' },
      { id: 'owner-return', icon: '🏠', label: '主人领回' }
    ]},
    { title: '转运交接', items: [
      { id: 'transfer', icon: '🚚', label: '转运管理' }
    ]},
    { title: '物料管理', items: [
      { id: 'material', icon: '📦', label: '物料供应链' }
    ]},
    { title: '回收放养', items: [
      { id: 'release', icon: '🌿', label: '动物回收放养' }
    ]},
    { title: '领养管理', items: [
      { id: 'adoption', icon: '👤', label: '领养审核管理' },
      { id: 'followup', icon: '📝', label: '领养回访管控' },
      { id: 'blacklist', icon: '⛔', label: '黑名单管理' }
    ]},
    { title: '安乐死', items: [
      { id: 'euthanasia', icon: '⚰️', label: '安乐死备案' }
    ]},
    { title: '台账中心', items: [
      { id: 'ledger', icon: '📊', label: '全量台账' }
    ]},
    { title: '系统', items: [
      { id: 'profile', icon: '⚙️', label: '个人中心' }
    ]}
  ],

  titles: {
    'dashboard': '首页看板',
    'capture-list': '捕捉记录',
    'capture-add': '新增捕捉登记',
    'owner-return': '主人领回',
    'transfer': '转运管理',
    'material': '物料供应链管理',
    'release': '动物回收放养',
    'adoption': '领养审核管理',
    'followup': '领养回访管控',
    'blacklist': '黑名单管理',
    'euthanasia': '安乐死备案',
    'ledger': '全量台账',
    'profile': '个人中心'
  },

  /* ========== 初始化 ========== */
  init() {
    // 预填演示账号
    document.getElementById('loginUsername').value = 'cy_shelter';
    document.getElementById('loginPassword').value = '123456';

    // 登录表单
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();
      const user = TNR_DB.login(u, p);
      if (user) {
        TNR_UI.toast('登录成功，欢迎回来 ' + user.name, 'success');
        this.enterApp(user);
      } else {
        TNR_UI.toast('用户名或密码错误', 'danger');
      }
    });

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const ok = await TNR_UI.confirm('确定要退出登录吗？', '退出登录');
      if (ok) {
        TNR_DB.logout();
        location.reload();
      }
    });

    // 检查已登录
    const cur = TNR_DB.getCurrentUser();
    if (cur) this.enterApp(cur);
  },

  enterApp(user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    // 渲染侧边栏
    const districts = TNR_DB.getDistricts();
    const dName = districts.find(d => d.id === user.districtId)?.name || '全市';
    document.getElementById('topbarDistrict').innerHTML =
      '<span class="topbar-district-dot"></span><span>' + TNR_UI.escape(dName) + '</span>';

    const sidebarHTML = TNR_UI.renderSidebar({
      brand: { icon: '🐾', name: 'TNR 管理系统' },
      brandSub: '捕捉点端',
      navGroups: this.navGroups,
      user: { name: user.name, role: dName + ' · 捕捉点', avatar: user.name.charAt(0) },
      activeId: 'dashboard'
    });
    document.getElementById('sidebarMount').innerHTML = sidebarHTML;

    TNR_UI.bindSidebar((navId) => this.navigate(navId));
    TNR_UI.startClock();
    this.navigate('dashboard');
  },

  navigate(pageId) {
    // 切换页面显示
    document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
    const page = document.getElementById('page-' + pageId);
    if (page) page.classList.add('active');
    document.getElementById('topbarTitle').textContent = this.titles[pageId] || '';

    // 渲染对应页面
    const renderer = this['render_' + pageId.replace(/-/g, '_')];
    if (renderer) renderer.call(this);
  },

  /* ========== 辅助方法 ========== */
  statusBadge(status) {
    const map = {
      pending: ['待下发', 'warning'],
      dispatched: ['已下发', 'info'],
      received: ['已签收', 'success'],
      rejected: ['已驳回', 'danger'],
      completed: ['已完成', 'success'],
      released: ['已放养', 'success'],
      adopted: ['已领养', 'success'],
      pending_adopt: ['待领养', 'cinnabar'],
      in_transit: ['在途', 'warning'],
      in_treatment: ['诊疗中', 'info'],
      euthanized: ['已安乐', 'danger'],
      owner_returned: ['已领回', 'default'],
      active: ['启用', 'success'],
      inactive: ['停用', 'default']
    };
    const m = map[status] || [status, 'default'];
    return TNR_UI.statusBadge(m[0], m[1]);
  },

  getPetByCode(code) {
    return TNR_DB.getAllRaw(TNR_DB.KEYS.pets).find(p => p.code === code);
  },

  /* ========== 1. 首页看板 ========== */
  render_dashboard() {
    const captures = TNR_DB.getAll(TNR_DB.KEYS.captures);
    const transfers = TNR_DB.getAll(TNR_DB.KEYS.transfers);
    const releases = TNR_DB.getAll(TNR_DB.KEYS.releases);
    const adoptions = TNR_DB.getAll(TNR_DB.KEYS.adoptions);
    const materials = TNR_DB.getAllRaw(TNR_DB.KEYS.materials);

    const pendingCapture = captures.filter(c => c.status === 'pending' || c.status === 'in_transit').length;
    const pendingTransfer = transfers.filter(t => t.status === 'pending').length;
    const pendingRelease = releases.filter(r => r.status === 'pending').length;
    const pendingAdoption = adoptions.filter(a => a.status === 'pending').length;
    const lowStock = materials.filter(m => m.shelterStock <= m.safetyStock).length;

    const pets = TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
    const user = TNR_DB.getCurrentUser();

    const todoItems = [];
    if (pendingTransfer > 0) todoItems.push({ label: pendingTransfer + ' 笔转运单待下发/签收', page: 'transfer', badge: 'warning' });
    if (pendingRelease > 0) todoItems.push({ label: pendingRelease + ' 只动物待放养确认', page: 'release', badge: 'cinnabar' });
    if (pendingAdoption > 0) todoItems.push({ label: pendingAdoption + ' 笔领养申请待审核', page: 'adoption', badge: 'info' });
    if (lowStock > 0) todoItems.push({ label: lowStock + ' 项物料库存低于安全线', page: 'material', badge: 'danger' });
    const inTransitPets = pets.filter(p => p.status === 'in_transit').length;
    if (inTransitPets > 0) todoItems.push({ label: inTransitPets + ' 只动物在途待转运', page: 'transfer', badge: 'warning' });
    if (todoItems.length === 0) todoItems.push({ label: '暂无待办任务', page: null, badge: 'success' });

    const quickActions = [
      { icon: '➕', text: '新增捕捉', desc: '录入流浪动物捕捉信息', page: 'capture-add' },
      { icon: '📦', text: '物料采购', desc: '采购入库登记', page: 'material' },
      { icon: '🚚', text: '转运管理', desc: '下发转运单据', page: 'transfer' },
      { icon: '🌿', text: '放养管理', desc: '动物放养登记', page: 'release' }
    ];

    let html = '';
    html += '<div class="stat-grid">';
    html += '<div class="stat-card"><div class="stat-card-icon">📋</div><div><div class="stat-card-value">' + pendingCapture + '</div><div class="stat-card-label">待捕捉登记</div></div></div>';
    html += '<div class="stat-card blue"><div class="stat-card-icon">🚚</div><div><div class="stat-card-value">' + pendingTransfer + '</div><div class="stat-card-label">待转运</div></div></div>';
    html += '<div class="stat-card green"><div class="stat-card-icon">🌿</div><div><div class="stat-card-value">' + pendingRelease + '</div><div class="stat-card-label">待回收放养</div></div></div>';
    html += '<div class="stat-card gold"><div class="stat-card-icon">👤</div><div><div class="stat-card-value">' + pendingAdoption + '</div><div class="stat-card-label">待领养审核</div></div></div>';
    html += '<div class="stat-card rouge"><div class="stat-card-icon">📦</div><div><div class="stat-card-value">' + lowStock + '</div><div class="stat-card-label">物料库存预警</div></div></div>';
    html += '</div>';

    html += '<div class="form-row" style="align-items: stretch;">';
    html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待办任务</div></div><div class="card-body" style="padding:0;">';
    todoItems.forEach(item => {
      html += '<div class="todo-list-item" ' + (item.page ? 'data-todo="' + item.page + '"' : '') + '>';
      html += '<span class="badge badge-' + item.badge + '">' + (item.badge === 'danger' ? '紧急' : (item.badge === 'warning' ? '待处理' : (item.badge === 'info' ? '审核中' : '正常'))) + '</span>';
      html += '<span style="flex:1;font-size:14px;">' + TNR_UI.escape(item.label) + '</span>';
      if (item.page) html += '<span class="btn-link">前往 ›</span>';
      html += '</div>';
    });
    html += '</div></div>';

    html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>快捷操作</div></div><div class="card-body">';
    html += '<div class="quick-actions" style="margin-top:0;">';
    quickActions.forEach(a => {
      html += '<div class="quick-action" data-quick="' + a.page + '">';
      html += '<div class="quick-action-icon">' + a.icon + '</div>';
      html += '<div><div class="quick-action-text">' + a.text + '</div><div class="quick-action-desc">' + a.desc + '</div></div>';
      html += '</div>';
    });
    html += '</div>';
    html += '</div></div>';
    html += '</div>';

    document.getElementById('page-dashboard').innerHTML = html;

    document.querySelectorAll('[data-todo]').forEach(el => {
      el.addEventListener('click', () => this.navigate(el.dataset.todo));
    });
    document.querySelectorAll('[data-quick]').forEach(el => {
      el.addEventListener('click', () => this.navigate(el.dataset.quick));
    });
  },

  /* ========== 2. 捕捉记录 ========== */
  render_capture_list() {
    const el = document.getElementById('page-capture-list');
    const districts = TNR_DB.getDistricts();
    const communities = TNR_DB.getInstitutions('community');

    const filters = [
      { key: 'district', label: '区县', type: 'select', options: districts.map(d => ({ value: d.name, label: d.name })) },
      { key: 'community', label: '小区', type: 'select', options: communities.map(c => ({ value: c.name, label: c.name })) },
      { key: 'status', label: '状态', type: 'select', options: [
        { value: 'in_transit', label: '在途' },
        { value: 'completed', label: '已完成' },
        { value: 'pending', label: '待处理' }
      ]},
      { key: 'keyword', label: '搜索', type: 'search', placeholder: '捕捉单号/物业/编号' }
    ];
    const actions = '<button class="btn btn-primary btn-sm" id="btnAddCapture">+ 新增捕捉</button>';
    const filterHTML = TNR_UI.renderFilterBar(filters, actions);

    el.innerHTML = filterHTML + '<div id="captureTableWrap"></div>';
    document.getElementById('btnAddCapture').addEventListener('click', () => this.navigate('capture-add'));

    const renderTable = () => {
      const vals = TNR_UI.getFilterValues();
      let list = TNR_DB.getAll(TNR_DB.KEYS.captures);
      list = list.filter(c => {
        if (vals.district && districts.find(d => d.name === vals.district)?.id !== c.districtId) return false;
        if (vals.community && c.communityName !== vals.community) return false;
        if (vals.status && c.status !== vals.status) return false;
        if (vals.keyword) {
          const kw = vals.keyword;
          const hay = (c.id + c.ledgerNo + c.propertyName + c.contactPerson + (c.petCodes || []).join('')).toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      const columns = [
        { title: '捕捉单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '小区', key: 'communityName' },
        { title: '物业', key: 'propertyName' },
        { title: '数量', key: 'petCount', render: r => '<span class="badge badge-info">' + r.petCount + '</span>' },
        { title: '宠物编号', render: r => (r.petCodes || []).map(c => '<span class="pet-code-chip">' + c + '</span>').join('') },
        { title: '状态', render: r => this.statusBadge(r.status) },
        { title: '时间', key: 'createdAt' }
      ];
      const rowActions = (r) => {
        let html = '<button class="btn-link" data-act="view" data-id="' + r.id + '">详情</button>';
        html += '<button class="btn-link" data-act="edit" data-id="' + r.id + '">编辑</button>';
        html += '<button class="btn-link danger" data-act="del" data-id="' + r.id + '">删除</button>';
        return html;
      };
      const tableHTML = TNR_UI.renderTable({ columns, data: list, emptyText: '暂无捕捉记录', rowActions });
      const wrap = document.getElementById('captureTableWrap');
      wrap.innerHTML = '<div class="card"><div class="card-body" style="padding:0;"><div class="table-wrapper">' + tableHTML + '</div></div></div>';

        btn.addEventListener('click', () => {
          const id = btn.dataset.id;

          const rec = TNR_DB.getById(TNR_DB.KEYS.captures, id);

          if (act === 'view') this.showCaptureDetail(rec);
          else if (act === 'edit') this.showCaptureEdit(rec);

      <div class="card">
        <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>确认区 · 电子签名</div></div>
        <div class="card-body">
          <div class="form-group"><label class="form-label">物业电子签名<span class="req">*</span></label>
            <canvas class="signature-pad" id="ca_signature"></canvas>
            <div class="mt-3 flex gap-2">
              <button class="btn btn-secondary btn-sm" id="btnClearSig">清除签名</button>

          </div>

            <button class="btn btn-primary btn-lg" id="btnSubmitCapture">提交捕捉登记</button>
            <button class="btn btn-secondary btn-lg" id="btnResetCapture">重置表单</button>
          </div>
        </div>
      </div>
    `;

    // ========== 定位功能 ==========
    // 流程：浏览器 Geolocation（WGS-84）→ 转换为高德 GCJ-02 坐标 → 请求后端逆地理编码接口
    //（/api/business/geocode/reverse/，由服务端代理调用高德API，避免跨域及Key泄露）。
    // 高德 Key 在后端 .env 中配置：TNR_AMAP_KEY。本静态演示页脱离后端时，
    // 可选通过 window.TNR_MAP_KEY 直接调用高德（注意需自行处理跨域）。
    let pendingLocation = null;

    // WGS-84（GPS原始坐标）→ GCJ-02（国测局/高德坐标）纠偏，否则逆地理结果会偏移数百米
    function wgs84ToGcj02(wgsLat, wgsLng) {
      const a = 6378245.0, ee = 0.00669342162296594323;
      const outOfChina = wgsLng < 72.004 || wgsLng > 137.8347 || wgsLat < 0.8293 || wgsLat > 55.8271;
      if (outOfChina) return { lat: wgsLat, lng: wgsLng };
      const transformLat = (x, y) => {
        let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
        return ret;
      };
      const transformLng = (x, y) => {
        let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
        ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
        ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
        ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
        return ret;
      };
      let dLat = transformLat(wgsLng - 105.0, wgsLat - 35.0);
      let dLng = transformLng(wgsLng - 105.0, wgsLat - 35.0);
      const radLat = wgsLat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: wgsLat + dLat, lng: wgsLng + dLng };
    }

    // 逆地理编码：优先后端代理接口；失败时若配置了 window.TNR_MAP_KEY 则直连高德兜底
    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch('/api/business/geocode/reverse/?lat=' + lat + '&lng=' + lng, { credentials: 'same-origin' });
        const json = await res.json();
        if (!json.success) throw new Error(json.message || '地址解析失败');
        return json.data || {};
      } catch (e) {
        const key = window.TNR_MAP_KEY || '';
        if (!key) throw e;
        const resp = await fetch('https://restapi.amap.com/v3/geocode/regeo?key=' + key + '&location=' + lng + ',' + lat);
        const json = await resp.json();
        const addr = json && json.regeocode ? (json.regeocode.formatted_address || '') : '';
        if (!addr) throw new Error('地址解析失败');
        return { address: addr };
      }
    }

    // IP 定位兜底：浏览器 Geolocation 仅在 HTTPS/localhost 可用，
    // HTTP 局域网环境下报 "Only secure origins are allowed"，降级为城市/区级粗定位
    async function ipLocate() {
      const res = await fetch('/api/business/geocode/ip/', { credentials: 'same-origin' });
      const json = await res.json();
      if (!json.success) throw new Error(json.message || 'IP定位失败');
      return json.data || {};
    }

    // 应用定位结果：写入 pendingLocation，地址栏为空时自动填入
    function applyLocation(lat, lng, geoAddress, tip) {
      pendingLocation = { latitude: lat, longitude: lng, geoAddress: geoAddress || '' };
      const addrInput = document.getElementById('ca_address');
      if ((geoAddress || '').trim() && !addrInput.value.trim()) addrInput.value = geoAddress.trim();
      document.getElementById('ca_locInfo').textContent = tip;
    }

    document.getElementById('btnLocate').addEventListener('click', () => {
      if (!navigator.geolocation) { TNR_UI.toast('当前浏览器不支持定位，尝试IP定位', 'warning'); fallbackToIpLocate('当前浏览器不支持GPS定位'); return; }
      const locBtn = document.getElementById('btnLocate');
      const locInfo = document.getElementById('ca_locInfo');
      locBtn.disabled = true;
      locInfo.textContent = '定位中…';
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const wgs = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        const gcj = wgs84ToGcj02(wgs.lat, wgs.lng);
        const lat = +gcj.lat.toFixed(6), lng = +gcj.lng.toFixed(6);
        try {
          const info = await reverseGeocode(lat, lng);
          const addr = (info.address || '').trim();
          applyLocation(lat, lng, addr,
            addr ? addr + '（' + lat + ', ' + lng + '）'
                 : '已获取经纬度：' + lat + ', ' + lng + '（未能解析地址名称，请手动填写）');
        } catch (e) {
          pendingLocation = { latitude: lat, longitude: lng, geoAddress: '' };
          locInfo.textContent = '已获取经纬度：' + lat + ', ' + lng + '（地址解析失败：' + (e.message || '未知错误') + '）';
        }
        locBtn.disabled = false;
      }, async (err) => {
        // 精确定位失败（HTTP 环境被浏览器拦截 / 拒绝授权 / 超时）→ IP 粗定位兜底
        const reason = err && err.message ? err.message : '请允许浏览器获取定位权限';
        try {
          const info = await ipLocate();
          const addr = (info.address || '').trim();
          applyLocation(info.latitude, info.longitude, addr,
            '浏览器精确定位不可用（' + reason + '），已按网络位置定位到：' + (addr || info.city || info.province || '未知城市')
            + '（' + info.latitude + ', ' + info.longitude + '，城市/区级精度，请核对详细地址）');
        } catch (e2) {
          pendingLocation = null;
          locInfo.textContent = '定位失败：' + reason + '；IP定位也不可用（' + (e2.message || '未知错误') + '）';
        }
        locBtn.disabled = false;
      }, { enableHighAccuracy: true, timeout: 15000 });
    });

    async function fallbackToIpLocate(reason) {
      const locBtn = document.getElementById('btnLocate');
      const locInfo = document.getElementById('ca_locInfo');
      locBtn.disabled = true;
      locInfo.textContent = 'IP定位中…';
      try {
        const info = await ipLocate();
        const addr = (info.address || '').trim();
        applyLocation(info.latitude, info.longitude, addr,
          '已按网络位置定位到：' + (addr || info.city || info.province || '未知城市')
          + '（' + info.latitude + ', ' + info.longitude + '，城市/区级精度，请核对详细地址）');
      } catch (e) {
        pendingLocation = null;
        locInfo.textContent = 'IP定位失败：' + (e.message || '未知错误');
      }
      locBtn.disabled = false;
    }

    // 生成编号
    document.getElementById('btnGenCodes').addEventListener('click', () => {
      const count = parseInt(document.getElementById('ca_petCount').value) || 0;
      if (count < 1) { TNR_UI.toast('请输入有效数量', 'warning'); return; }
      const codes = TNR_DB.generatePetCodes(count);
      this._pendingCodes = codes;
      document.getElementById('ca_petCodes').innerHTML = codes.map(c => '<span class="pet-code-chip">' + c + '</span>').join('');

      // 渲染单只照片槽位
      const grid = document.getElementById('ca_petPhotos');
      grid.innerHTML = codes.map(c => '<div><div class="photo-upload-slot" data-code="' + c + '"><div style="font-size:20px;">📷</div><div>' + c + '</div></div></div>').join('');
    });

    // 签名板
    const sigPad = TNR_UI.initSignaturePad(document.getElementById('ca_signature'));
    this._sigPad = sigPad;
    document.getElementById('btnClearSig').addEventListener('click', () => sigPad.clear());

    // 提交
    document.getElementById('btnSubmitCapture').addEventListener('click', () => {
      const propertyName = document.getElementById('ca_propertyName').value.trim();
      const contactPerson = document.getElementById('ca_contactPerson').value.trim();
      const contactPhone = document.getElementById('ca_contactPhone').value.trim();
      if (!propertyName) { TNR_UI.toast('请填写物业名称', 'warning'); return; }
      if (!contactPerson) { TNR_UI.toast('请填写物业交接人', 'warning'); return; }
      if (!contactPhone) { TNR_UI.toast('请填写联系电话', 'warning'); return; }
      const communityName = document.getElementById('ca_communityName').value.trim();
      if (!communityName) { TNR_UI.toast('请填写所在小区', 'warning'); return; }
      if (!this._pendingCodes || this._pendingCodes.length === 0) { TNR_UI.toast('请先生成宠物编号', 'warning'); return; }
      if (sigPad.isEmpty()) { TNR_UI.toast('请完成物业电子签名', 'warning'); return; }

      const user = TNR_DB.getCurrentUser();
      const ledgerNo = TNR_UI.genLedgerNo('CAP');

      const record = {
        districtId: document.getElementById('ca_districtId').value,
        shelterId: user.institutionId,
        shelterName: TNR_DB.getInstitutions('shelter', user.districtId).find(s => s.id === user.institutionId)?.name || '',
        communityId: '',
        communityName: communityName,
        address: document.getElementById('ca_address').value.trim(),
        latitude: pendingLocation ? pendingLocation.latitude : null,
        longitude: pendingLocation ? pendingLocation.longitude : null,
        geoAddress: pendingLocation ? (pendingLocation.geoAddress || '') : '',
        propertyName,
        contactPerson,
        contactPhone,
        petCount: this._pendingCodes.length,
        petCodes: this._pendingCodes,
        groupPhoto: '',
        petPhotos: {},
        signature: sigPad.getDataURL(),
        status: 'in_transit',
        operator: user.id,
        operatorName: user.name,
        ledgerNo
      };
      TNR_DB.create(TNR_DB.KEYS.captures, record);

      // 同时创建宠物档案
      this._pendingCodes.forEach(code => {
        TNR_DB.create(TNR_DB.KEYS.pets, {
          code,
          name: '',
          species: '', breed: '', gender: '', age: '', color: '', weight: '',
          status: 'in_transit',
          districtId: record.districtId,
          captureId: record.id,
          shelterId: user.institutionId,
          hospitalId: '',
          photos: { group: '', before: '', after: '', treatment: '' },
          chipNo: '',
          description: ''
        });
      });

      TNR_UI.toast('捕捉登记成功！单号：' + ledgerNo, 'success');
      this._pendingCodes = null;
      this.navigate('capture-list');
    });

    document.getElementById('btnResetCapture').addEventListener('click', () => {
      document.querySelectorAll('#page-capture-add input, #page-capture-add textarea').forEach(i => { if (i.type !== 'button') i.value = ''; });
      document.getElementById('ca_petCount').value = 1;
      document.getElementById('ca_petCodes').innerHTML = '<span class="text-light fs-sm">点击"生成编号"按钮</span>';
      document.getElementById('ca_petPhotos').innerHTML = '';
      document.getElementById('ca_locInfo').textContent = '未定位（点击「定位」获取当前地址及经纬度）';
      pendingLocation = null;

  /* ========== 4. 主人领回 ========== */
  render_owner_return() {
    const el = document.getElementById('page-owner-return');
    const filters = [
      { key: 'keyword', label: '搜索', type: 'search', placeholder: '宠物编号/主人姓名/电话' }
    ];

    el.innerHTML = TNR_UI.renderFilterBar(filters, actions) + '<div id="returnTableWrap"></div>';

    const renderTable = () => {
      const vals = TNR_UI.getFilterValues();
      let list = TNR_DB.getAll(TNR_DB.KEYS.ownerReturns);
      if (vals.keyword) {
        const kw = vals.keyword;
        list = list.filter(r => (r.petCode + r.ownerName + r.ownerPhone + r.ownerIdCard).toLowerCase().includes(kw));
      }
      const columns = [
        { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '主人姓名', key: 'ownerName' },
        { title: '联系电话', key: 'ownerPhone' },
        { title: '身份证', key: 'ownerIdCard' },
        { title: '领回原因', key: 'reason' },
        { title: '状态', render: r => TNR_UI.statusBadge('已领回', 'default') },
        { title: '时间', key: 'createdAt' }
      ];
      const rowActions = (r) => '<button class="btn-link" data-act="view" data-id="' + r.id + '">详情</button><button class="btn-link danger" data-act="del" data-id="' + r.id + '">删除</button>';
      const tableHTML = TNR_UI.renderTable({ columns, data: list, emptyText: '暂无主人领回记录', rowActions });
      document.getElementById('returnTableWrap').innerHTML = '<div class="card"><div class="card-body" style="padding:0;"><div class="table-wrapper">' + tableHTML + '</div></div></div>';
      document.getElementById('returnTableWrap').querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rec = TNR_DB.getById(TNR_DB.KEYS.ownerReturns, btn.dataset.id);
          if (!rec) return;
          if (btn.dataset.act === 'view') {
            TNR_UI.drawer({ title: '主人领回详情', body: TNR_UI.renderDescList([
              { label: '单号', value: rec.ledgerNo || rec.id },
              { label: '宠物编号', value: '<span class="pet-code-chip">' + rec.petCode + '</span>' },
              { label: '主人姓名', value: rec.ownerName },
              { label: '联系电话', value: rec.ownerPhone },
              { label: '身份证', value: rec.ownerIdCard },
              { label: '领回原因', value: rec.reason, full: true },
              { label: '操作员', value: rec.operatorName },
              { label: '登记时间', value: rec.createdAt }
            ]) });
          } else if (btn.dataset.act === 'del') {
            TNR_UI.confirm('确定删除该领回记录吗？').then(ok => {
              if (ok) { TNR_DB.delete(TNR_DB.KEYS.ownerReturns, rec.id); TNR_UI.toast('已删除', 'success'); renderTable(); }
            });
          }
        });
      });
    };
    renderTable();
    TNR_UI.bindFilter(renderTable);

    document.getElementById('btnAddReturn').addEventListener('click', () => this.showOwnerReturnForm());
  },

  showOwnerReturnForm() {
    const pets = TNR_DB.getAllRaw(TNR_DB.KEYS.pets).filter(p => p.status === 'in_transit');
    const body = (el) => {
      el.innerHTML = `
        <div class="form-group"><label class="form-label">选择在途宠物<span class="req">*</span></label>
          <select class="form-select" id="or_petCode">
            ${pets.length === 0 ? '<option value="">暂无在途宠物</option>' : pets.map(p => '<option value="' + p.code + '">' + p.code + '（' + (p.name || '未命名') + '）</option>').join('')}
          </select>
        </div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">主人姓名<span class="req">*</span></label><input class="form-input" id="or_ownerName"></div>
          <div class="form-group"><label class="form-label">联系电话<span class="req">*</span></label><input class="form-input" id="or_ownerPhone"></div>
        </div>
        <div class="form-group"><label class="form-label">身份证号</label><input class="form-input" id="or_ownerIdCard" placeholder="身份证号"></div>
        <div class="form-group"><label class="form-label">领回原因<span class="req">*</span></label><textarea class="form-textarea" id="or_reason" placeholder="说明领回原因"></textarea></div>
        <div class="form-group"><label class="form-label">主人电子签名<span class="req">*</span></label>
          <canvas class="signature-pad" id="or_signature"></canvas>
          <button class="btn btn-secondary btn-sm mt-2" id="orClearSig">清除签名</button>
        </div>
      `;
    };
    const { close } = TNR_UI.modal({
      title: '主人领回登记',
      size: 'lg',
      body,
      actions: '<button class="btn btn-secondary" data-action="close">取消</button><button class="btn btn-primary" id="btnSubmitReturn">确认领回</button>'
    });

    setTimeout(() => {
      const sigPad = TNR_UI.initSignaturePad(document.getElementById('or_signature'));
      document.getElementById('orClearSig').addEventListener('click', () => sigPad.clear());

      document.getElementById('btnSubmitReturn').addEventListener('click', () => {
        const petCode = document.getElementById('or_petCode').value;
        const ownerName = document.getElementById('or_ownerName').value.trim();
        const ownerPhone = document.getElementById('or_ownerPhone').value.trim();
        const ownerIdCard = document.getElementById('or_ownerIdCard').value.trim();
        const reason = document.getElementById('or_reason').value.trim();
        if (!petCode) { TNR_UI.toast('请选择在途宠物', 'warning'); return; }
        if (!ownerName || !ownerPhone || !reason) { TNR_UI.toast('请填写完整信息', 'warning'); return; }
        if (sigPad.isEmpty()) { TNR_UI.toast('请完成主人电子签名', 'warning'); return; }

        // 黑名单检查
        const bl = TNR_DB.checkBlacklist(ownerIdCard, ownerPhone);
        if (bl) {
          TNR_UI.confirm('该主人存在于黑名单中：<br>原因：' + TNR_UI.escape(bl.reason) + '<br>是否继续领回？', '黑名单警告').then(ok => {
            if (ok) doReturn();
          });
        } else {
          doReturn();
        }

        const doReturn = () => {
          const user = TNR_DB.getCurrentUser();
          const pet = this.getPetByCode(petCode);
          const ledgerNo = TNR_UI.genLedgerNo('RET');
          TNR_DB.create(TNR_DB.KEYS.ownerReturns, {
            petCode, petId: pet ? pet.id : '',
            ownerName, ownerPhone, ownerIdCard,
            reason, signature: sigPad.getDataURL(),
            status: 'completed',
            operator: user.id, operatorName: user.name,
            ledgerNo
          });
          if (pet) TNR_DB.update(TNR_DB.KEYS.pets, pet.id, { status: 'owner_returned' });
          TNR_UI.toast('主人领回登记成功！', 'success');
          close();
          this.render_owner_return();
        };
      });
    }, 100);
  },

        html += '<div class="form-group"><label class="form-label">接收医院<span class="req">*</span></label><select class="form-select" id="tr_hospital">' + hospitals.map(h => '<option value="' + h.id + '" data-name="' + TNR_UI.escape(h.name) + '">' + TNR_UI.escape(h.name) + '</option>').join('') + '</select></div>';

          { title: '日期', key: 'date' },
          { title: '操作员', key: 'operatorName' }
        ],
        data: txns, emptyText: '暂无采购记录'
      });
      html += '</div></div></div>';
      wrap.innerHTML = html;

      // 芯片号段显示控制
      document.getElementById('pu_category').addEventListener('change', (e) => {
        document.getElementById('pu_chipRangeGroup').style.display = e.target.value === 'chip' ? '' : 'none';
      });

      document.getElementById('btnPurchase').addEventListener('click', () => {
        const cat = document.getElementById('pu_category').value;
        const name = document.getElementById('pu_name').value.trim();
        const qty = parseInt(document.getElementById('pu_qty').value) || 0;
        if (!name || qty < 1) { TNR_UI.toast('请填写完整信息', 'warning'); return; }
        const user = TNR_DB.getCurrentUser();
        const ledgerNo = TNR_UI.genLedgerNo('PUR');
        const batchNo = document.getElementById('pu_batchNo').value.trim();
        const txn = {
          type: 'purchase',
          materialId: '',
          materialName: name,
          quantity: qty,
          unit: document.getElementById('pu_unit').value.trim() || '支',
          batchNo,
          supplier: document.getElementById('pu_supplier').value.trim(),
          fromTo: document.getElementById('pu_supplier').value.trim() || '供应商',
          date: document.getElementById('pu_date').value || TNR_UI.formatDate(new Date()),
          note: document.getElementById('pu_note').value.trim() + (cat === 'chip' ? '（芯片号段：' + (document.getElementById('pu_chipStart').value || '') + '~' + (document.getElementById('pu_chipEnd').value || '') + '）' : ''),
          operator: user.id, operatorName: user.name,
          ledgerNo
        };
        TNR_DB.create(TNR_DB.KEYS.materialTxns, txn);
        TNR_UI.toast('采购入库成功：' + ledgerNo, 'success');
        this.renderMatTab('purchase');
      });

    } else if (tab === 'outbound') {
      const hospitals = TNR_DB.getInstitutions('hospital');
      let html = '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>下发出库登记</div></div><div class="card-body">';
      html += '<div class="form-row-3">';
      html += '<div class="form-group"><label class="form-label">接收医院<span class="req">*</span></label><select class="form-select" id="ob_hospital">' + hospitals.map(h => '<option value="' + h.id + '" data-name="' + TNR_UI.escape(h.name) + '">' + TNR_UI.escape(h.name) + '</option>').join('') + '</select></div>';
      html += '<div class="form-group"><label class="form-label">物料名称<span class="req">*</span></label><select class="form-select" id="ob_material">' + materials.map(m => '<option value="' + m.id + '" data-name="' + TNR_UI.escape(m.name) + '" data-unit="' + m.unit + '">' + TNR_UI.escape(m.name) + '（库存' + m.shelterStock + m.unit + '）' + '</option>').join('') + '</select></div>';
      html += '<div class="form-group"><label class="form-label">下发数量<span class="req">*</span></label><input type="number" class="form-input" id="ob_qty" min="1" value="1"></div>';
      html += '</div><div class="form-row-3">';
      html += '<div class="form-group"><label class="form-label">批号</label><input class="form-input" id="ob_batchNo" placeholder="批号"></div>';
      html += '<div class="form-group" id="ob_chipRangeGroup" style="display:none;"><label class="form-label">芯片号段</label><input class="form-input" id="ob_chipRange" placeholder="如：1000010001-1000010010"></div>';
      html += '<div class="form-group"><label class="form-label">备注</label><input class="form-input" id="ob_note" placeholder="备注"></div>';
      html += '</div>';
      html += '<button class="btn btn-primary" id="btnOutbound">提交下发</button>';
      html += '</div></div>';

      const txns = TNR_DB.getAll(TNR_DB.KEYS.materialTxns).filter(t => t.type === 'dispatch');
      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>下发出库记录</div></div><div class="card-body" style="padding:0;"><div class="table-wrapper">';
      html += TNR_UI.renderTable({
        columns: [
          { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo) + '</span>' },
          { title: '物料', key: 'materialName' },
          { title: '数量', render: r => r.quantity + ' ' + r.unit },
          { title: '接收方', key: 'fromTo' },
          { title: '批号', key: 'batchNo' },
          { title: '日期', key: 'date' },
          { title: '操作员', key: 'operatorName' }
        ],
        data: txns, emptyText: '暂无出库记录'
      });
      html += '</div></div></div>';
      wrap.innerHTML = html;

      document.getElementById('ob_material').addEventListener('change', (e) => {
        const mat = materials.find(m => m.id === e.target.value);
        document.getElementById('ob_chipRangeGroup').style.display = (mat && mat.category === 'chip') ? '' : 'none';
      });

      document.getElementById('btnOutbound').addEventListener('click', () => {
        const matSel = document.getElementById('ob_material');
        const mat = materials.find(m => m.id === matSel.value);
        const qty = parseInt(document.getElementById('ob_qty').value) || 0;
        if (!mat || qty < 1) { TNR_UI.toast('请填写完整信息', 'warning'); return; }
        if (qty > mat.shelterStock) { TNR_UI.toast('库存不足，当前库存：' + mat.shelterStock + mat.unit, 'danger'); return; }
        const hospSel = document.getElementById('ob_hospital');
        const user = TNR_DB.getCurrentUser();
        const ledgerNo = TNR_UI.genLedgerNo('DIS');
        TNR_DB.create(TNR_DB.KEYS.materialTxns, {
          type: 'dispatch',
          materialId: mat.id,
          materialName: mat.name,
          quantity: qty,
          unit: mat.unit,
          batchNo: document.getElementById('ob_batchNo').value.trim(),
          supplier: '',
          fromTo: hospSel.options[hospSel.selectedIndex].dataset.name,
          date: TNR_UI.formatDate(new Date()),
          note: document.getElementById('ob_note').value.trim() + (mat.category === 'chip' ? '（芯片号段：' + (document.getElementById('ob_chipRange').value || '') + '）' : ''),
          operator: user.id, operatorName: user.name,
          ledgerNo
        });
        // 扣减库存
        TNR_DB.update(TNR_DB.KEYS.materials, mat.id, { shelterStock: mat.shelterStock - qty });
        TNR_UI.toast('下发成功：' + ledgerNo, 'success');
        this.renderMatTab('outbound');
      });

    } else if (tab === 'flow') {
      const txns = TNR_DB.getAll(TNR_DB.KEYS.materialTxns);
      const filters = [
        { key: 'type', label: '类型', type: 'select', options: [
          { value: 'purchase', label: '采购入库' },
          { value: 'dispatch', label: '下发出库' },
          { value: 'consume', label: '诊疗消耗' }
        ]},
        { key: 'keyword', label: '搜索', type: 'search', placeholder: '物料/单号/供应商' }
      ];
      wrap.innerHTML = TNR_UI.renderFilterBar(filters) + '<div id="flowTableWrap"></div>';
      const renderFlow = () => {
        const vals = TNR_UI.getFilterValues();
        let list = txns;
        if (vals.type) list = list.filter(t => t.type === vals.type);
        if (vals.keyword) {
          const kw = vals.keyword;
          list = list.filter(t => (t.materialName + t.ledgerNo + t.supplier + t.fromTo).toLowerCase().includes(kw));
        }
        const typeMap = { purchase: ['采购入库', 'success'], dispatch: ['下发出库', 'info'], consume: ['诊疗消耗', 'warning'] };
        const columns = [
          { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo) + '</span>' },
          { title: '类型', render: r => TNR_UI.statusBadge(typeMap[r.type][0], typeMap[r.type][1]) },
          { title: '物料', key: 'materialName' },
          { title: '数量', render: r => r.quantity + ' ' + r.unit },
          { title: '来源/去向', key: 'fromTo' },
          { title: '批号', key: 'batchNo' },
          { title: '日期', key: 'date' },
          { title: '操作员', key: 'operatorName' },
          { title: '备注', key: 'note' }
        ];
        document.getElementById('flowTableWrap').innerHTML = '<div class="card"><div class="card-body" style="padding:0;"><div class="table-wrapper">' + TNR_UI.renderTable({ columns, data: list, emptyText: '暂无流向记录' }) + '</div></div></div>';
      };
      renderFlow();
      TNR_UI.bindFilter(renderFlow);
    }
  },

  /* ========== 7. 动物回收放养 ========== */
  render_release() {
    const el = document.getElementById('page-release');
    el.innerHTML = `
      <div class="tabs" id="relTabs">
        <div class="tab-item active" data-tab="recovery">待回收</div>
        <div class="tab-item" data-tab="pending">待放养</div>
        <div class="tab-item" data-tab="released">已放养</div>
      </div>
      <div id="relContent"></div>
    `;
    el.querySelectorAll('.tab-item').forEach(t => {
      t.addEventListener('click', () => {
        el.querySelectorAll('.tab-item').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        this.renderRelTab(t.dataset.tab);
      });
    });
    this.renderRelTab('recovery');
  },

  renderRelTab(tab) {
    const wrap = document.getElementById('relContent');
    const pets = TNR_DB.getAllRaw(TNR_DB.KEYS.pets);
    const releases = TNR_DB.getAll(TNR_DB.KEYS.releases);
    const user = TNR_DB.getCurrentUser();

    if (tab === 'recovery') {
      // 已治愈（诊疗完成）可回收的动物
      const recoverable = pets.filter(p => p.status === 'in_treatment' || p.status === 'pending_adopt');
      const treatments = TNR_DB.getAllRaw(TNR_DB.KEYS.treatments);
      let html = '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>可回收动物列表</div></div><div class="card-body" style="padding:0;"><div class="table-wrapper">';
      const columns = [
        { title: '宠物编号', key: 'code', render: r => '<span class="pet-code-chip">' + r.code + '</span>' },
        { title: '名称', key: 'name', render: r => r.name || '—' },
        { title: '品种', render: r => (r.breed || '—') + ' / ' + (r.species || '') },
        { title: '所属医院', render: r => {
          const t = treatments.find(t => t.petId === r.id);
          return t ? t.hospitalName : '—';
        }},
        { title: '状态', render: r => TNR_UI.statusBadge(TNR_DB.getPetStatusText(r.status), TNR_DB.getPetStatusBadge(r.status).replace('badge-','')) },
        { title: '操作', render: r => '<button class="btn btn-success btn-sm" data-recover="' + r.id + '">回收</button>' }
      ];
      html += TNR_UI.renderTable({ columns, data: recoverable, emptyText: '暂无可回收动物' });
      html += '</div></div></div>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('[data-recover]').forEach(btn => {
        btn.addEventListener('click', () => {
          const pet = pets.find(p => p.id === btn.dataset.recover);
          if (!pet) return;
          TNR_UI.confirm('确认回收宠物 <b>' + pet.code + '</b>（' + (pet.name || '未命名') + '）至捕捉点？', '回收确认').then(ok => {
            if (ok) {
              TNR_DB.update(TNR_DB.KEYS.pets, pet.id, { status: 'pending_release', shelterId: user.institutionId });
              TNR_UI.toast('回收成功，动物已纳入待放养', 'success');
              this.renderRelTab('recovery');
            }
          });
        });
      });

    } else if (tab === 'pending') {
      const pending = pets.filter(p => p.status === 'pending_release');
      const communities = TNR_DB.getInstitutions('community');
      let html = '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>放养登记</div></div><div class="card-body">';
      if (pending.length === 0) {
        html += '<div class="empty-block"><div class="empty-block-icon">🌿</div>暂无待放养动物，请先在"待回收"页面回收动物</div>';
      } else {
        html += '<div class="form-group"><label class="form-label">选择放养动物（可多选）<span class="req">*</span></label><div>';
        pending.forEach(p => {
          html += '<label class="pet-select-item"><input type="checkbox" value="' + p.id + '" data-code="' + p.code + '"><span class="pet-code-chip">' + p.code + '</span><span class="fs-sm text-muted">' + TNR_UI.escape(p.name || '未命名') + ' · ' + TNR_UI.escape(p.breed || '') + '</span></label>';
        });
        html += '</div></div>';
        html += '<div class="form-row">';
        html += '<div class="form-group"><label class="form-label">放养小区<span class="req">*</span></label><select class="form-select" id="rl_community">' + communities.map(c => '<option value="' + c.id + '" data-name="' + TNR_UI.escape(c.name) + '">' + TNR_UI.escape(c.name) + '</option>').join('') + '</select></div>';
        html += '<div class="form-group"><label class="form-label">接收人姓名<span class="req">*</span></label><input class="form-input" id="rl_receiverName"></div>';
        html += '</div><div class="form-row">';
        html += '<div class="form-group"><label class="form-label">接收人电话<span class="req">*</span></label><input class="form-input" id="rl_receiverPhone"></div>';
        html += '<div class="form-group"><label class="form-label">备注</label><input class="form-input" id="rl_note"></div>';
        html += '</div>';
        html += '<div class="form-group"><label class="form-label">物业电子签名<span class="req">*</span></label><canvas class="signature-pad" id="rl_signature"></canvas><button class="btn btn-secondary btn-sm mt-2" id="rlClearSig">清除签名</button></div>';
        html += '<button class="btn btn-success" id="btnRelease">确认放养</button>';
      }
      html += '</div></div>';
      wrap.innerHTML = html;

      if (pending.length > 0) {
        const sigPad = TNR_UI.initSignaturePad(document.getElementById('rl_signature'));
        document.getElementById('rlClearSig').addEventListener('click', () => sigPad.clear());
        document.getElementById('btnRelease').addEventListener('click', () => {
          const checked = Array.from(wrap.querySelectorAll('input[type=checkbox]:checked'));
          if (checked.length === 0) { TNR_UI.toast('请选择放养动物', 'warning'); return; }
          if (sigPad.isEmpty()) { TNR_UI.toast('请完成物业电子签名', 'warning'); return; }
          const commSel = document.getElementById('rl_community');
          const commName = commSel.options[commSel.selectedIndex].dataset.name;
          const receiverName = document.getElementById('rl_receiverName').value.trim();
          const receiverPhone = document.getElementById('rl_receiverPhone').value.trim();
          if (!receiverName || !receiverPhone) { TNR_UI.toast('请填写接收人信息', 'warning'); return; }

          checked.forEach(cb => {
            const petId = cb.value;
            const petCode = cb.dataset.code;
            const ledgerNo = TNR_UI.genLedgerNo('REL');
            TNR_DB.create(TNR_DB.KEYS.releases, {
              petId, petCode,
              communityId: commSel.value,
              communityName: commName,
              receiverName, receiverPhone,
              signature: sigPad.getDataURL(),
              status: 'released',
              releasedAt: TNR_UI.formatDate(new Date()),
              note: document.getElementById('rl_note').value.trim(),
              operator: user.id, operatorName: user.name,
              ledgerNo
            });
            TNR_DB.update(TNR_DB.KEYS.pets, petId, { status: 'released' });
          });
          TNR_UI.toast('放养登记成功！共 ' + checked.length + ' 只动物', 'success');
          this.renderRelTab('released');
          el.querySelector('[data-tab="released"]').click();
        });
      }

    } else if (tab === 'released') {
      const columns = [
        { title: '放养单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '放养小区', key: 'communityName' },
        { title: '接收人', key: 'receiverName' },
        { title: '联系电话', key: 'receiverPhone' },
        { title: '状态', render: r => TNR_UI.statusBadge('已放养', 'success') },
        { title: '放养时间', key: 'releasedAt' }
      ];
      const rowActions = (r) => '<button class="btn-link" data-act="view" data-id="' + r.id + '">详情</button><button class="btn-link danger" data-act="del" data-id="' + r.id + '">删除</button>';
      wrap.innerHTML = '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>放养记录</div></div><div class="card-body" style="padding:0;"><div class="table-wrapper">' + TNR_UI.renderTable({ columns, data: releases, emptyText: '暂无放养记录', rowActions }) + '</div></div></div>';
      wrap.querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rec = TNR_DB.getById(TNR_DB.KEYS.releases, btn.dataset.id);
          if (!rec) return;
          if (btn.dataset.act === 'view') {
            TNR_UI.drawer({ title: '放养详情', body: TNR_UI.renderDescList([
              { label: '放养单号', value: rec.ledgerNo || rec.id },
              { label: '宠物编号', value: '<span class="pet-code-chip">' + rec.petCode + '</span>' },
              { label: '放养小区', value: rec.communityName },
              { label: '接收人', value: rec.receiverName },
              { label: '联系电话', value: rec.receiverPhone },
              { label: '放养时间', value: rec.releasedAt },
              { label: '备注', value: rec.note || '—', full: true },
              { label: '操作员', value: rec.operatorName }
            ]) });
          } else if (btn.dataset.act === 'del') {
            TNR_UI.confirm('确定删除该放养记录吗？').then(ok => {
              if (ok) { TNR_DB.delete(TNR_DB.KEYS.releases, rec.id); TNR_UI.toast('已删除', 'success'); this.renderRelTab('released'); }
            });
          }
        });
      });
    }
  },

              { label: '地址', value: rec.adopterAddress || '—' },
              { label: '资质', value: rec.qualification, full: true },
              { label: '承诺书', value: rec.commitmentLetter || '—' },
              { label: '协议', value: rec.adoptionAgreement || '—' },
              { label: '状态', value: this.statusBadge(rec.status || 'completed') },
              { label: '领养时间', value: rec.adoptedAt || '—' }
            ]) });
          } else if (btn.dataset.act === 'del') {
            TNR_UI.confirm('确定删除该领养记录吗？').then(ok => {
              if (ok) { TNR_DB.delete(TNR_DB.KEYS.adoptions, rec.id); TNR_UI.toast('已删除', 'success'); renderTable(); }
            });
          }
        });
      });
    };
    renderTable();

    document.getElementById('btnSubmitAdoption').addEventListener('click', () => {
      const name = document.getElementById('ad_name').value.trim();
      const phone = document.getElementById('ad_phone').value.trim();
      const idCard = document.getElementById('ad_idCard').value.trim();
      const petSel = document.getElementById('ad_pet');
      const pet = pets.find(p => p.id === petSel.value);
      if (!name || !phone || !pet) { TNR_UI.toast('请填写完整信息', 'warning'); return; }

      // 黑名单检查
      const bl = TNR_DB.checkBlacklist(idCard, phone);
      if (bl) {
        TNR_UI.toast('警告：该领养人在黑名单中！原因：' + bl.reason, 'danger');
        return;
      }

      const user = TNR_DB.getCurrentUser();
      const ledgerNo = TNR_UI.genLedgerNo('ADP');
      TNR_DB.create(TNR_DB.KEYS.adoptions, {
        petId: pet.id,
        petCode: pet.code,
        adopterName: name,
        adopterPhone: phone,
        adopterIdCard: idCard,
        adopterAddress: document.getElementById('ad_address').value.trim(),
        qualification: document.getElementById('ad_qualification').value,
        commitmentLetter: document.getElementById('ad_commitment').checked ? '已签署' : '未签署',
        adoptionAgreement: document.getElementById('ad_agreement').checked ? '线下已签' : '未签',
        hospitalId: pet.hospitalId,
        hospitalName: TNR_DB.getAllRaw(TNR_DB.KEYS.institutions).find(i => i.id === pet.hospitalId)?.name || '',
        status: 'completed',
        adoptedAt: TNR_UI.formatDate(new Date()),
        operator: user.id, operatorName: user.name,
        ledgerNo
      });
      TNR_DB.update(TNR_DB.KEYS.pets, pet.id, { status: 'adopted' });
      TNR_UI.toast('领养登记成功：' + ledgerNo, 'success');
      this.render_adoption();
    });
  },

  /* ========== 9. 领养回访管控 ========== */
  render_followup() {
    const el = document.getElementById('page-followup');
    const checkins = TNR_DB.getAll(TNR_DB.KEYS.checkIns);
    const adoptions = TNR_DB.getAll(TNR_DB.KEYS.adoptions);

    el.innerHTML = `
      <div class="card mb-4">
        <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>月度打卡记录</div></div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrapper" id="checkinTableWrap"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><span class="card-title-bar"></span>违规收回操作</div></div>
        <div class="card-body">
          <p class="text-muted fs-sm mb-3">如发现领养人存在弃养、私自转赠、打卡不合格等违规行为，可在此收回动物并加入黑名单。</p>
          <div class="form-row">
            <div class="form-group"><label class="form-label">选择领养记录<span class="req">*</span></label><select class="form-select" id="fu_adoption">${adoptions.map(a => '<option value="' + a.id + '" data-pet="' + a.petId + '" data-petcode="' + a.petCode + '" data-name="' + TNR_UI.escape(a.adopterName) + '" data-phone="' + TNR_UI.escape(a.adopterPhone) + '" data-idcard="' + TNR_UI.escape(a.adopterIdCard || '') + '">' + a.petCode + ' - ' + TNR_UI.escape(a.adopterName) + '</option>').join('')}</select></div>
            <div class="form-group"><label class="form-label">违规原因<span class="req">*</span></label><select class="form-select" id="fu_reason"><option value="弃养">弃养</option><option value="私自转赠">私自转赠</option><option value="打卡不合格">打卡不合格</option><option value="虐待动物">虐待动物</option><option value="其他">其他</option></select></div>
          </div>
          <button class="btn btn-danger" id="btnReclaim">收回动物并加入黑名单</button>
        </div>
      </div>
    `;

    const renderTable = () => {
      const list = TNR_DB.getAll(TNR_DB.KEYS.checkIns);
      const columns = [
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '领养人', key: 'adopterName' },
        { title: '打卡月份', key: 'month' },
        { title: '近况说明', key: 'note' },
        { title: '状态', render: r => r.status === 'approved' ? TNR_UI.statusBadge('已通过', 'success') : (r.status === 'rejected' ? TNR_UI.statusBadge('未通过', 'danger') : TNR_UI.statusBadge('待审核', 'warning')) },
        { title: '提交时间', key: 'createdAt' }
      ];
      const rowActions = (r) => {
        if (r.status === 'pending') return '<button class="btn-link success" data-act="approve" data-id="' + r.id + '">通过</button><button class="btn-link danger" data-act="reject" data-id="' + r.id + '">驳回</button>';
        return '<button class="btn-link" data-act="view" data-id="' + r.id + '">详情</button>';
      };
      document.getElementById('checkinTableWrap').innerHTML = TNR_UI.renderTable({ columns, data: list, emptyText: '暂无打卡记录', rowActions });
      document.getElementById('checkinTableWrap').querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rec = TNR_DB.getById(TNR_DB.KEYS.checkIns, btn.dataset.id);
          if (!rec) return;
          if (btn.dataset.act === 'approve') {
            TNR_DB.update(TNR_DB.KEYS.checkIns, rec.id, { status: 'approved' });
            TNR_UI.toast('已通过审核', 'success');
            renderTable();
          } else if (btn.dataset.act === 'reject') {
            TNR_DB.update(TNR_DB.KEYS.checkIns, rec.id, { status: 'rejected' });
            TNR_UI.toast('已驳回', 'warning');
            renderTable();
          } else if (btn.dataset.act === 'view') {
            TNR_UI.drawer({ title: '打卡详情', body: TNR_UI.renderDescList([
              { label: '宠物编号', value: '<span class="pet-code-chip">' + rec.petCode + '</span>' },
              { label: '领养人', value: rec.adopterName },
              { label: '打卡月份', value: rec.month },
              { label: '近况说明', value: rec.note, full: true },
              { label: '状态', value: rec.status === 'approved' ? '已通过' : (rec.status === 'rejected' ? '未通过' : '待审核') },
              { label: '提交时间', value: rec.createdAt }
            ]) });
          }
        });
      });
    };
    renderTable();

    document.getElementById('btnReclaim').addEventListener('click', async () => {
      const sel = document.getElementById('fu_adoption');
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) { TNR_UI.toast('请选择领养记录', 'warning'); return; }
      const reason = document.getElementById('fu_reason').value;
      const ok = await TNR_UI.confirm('确认收回宠物 <b>' + opt.dataset.petcode + '</b> 并将领养人 <b>' + TNR_UI.escape(opt.dataset.name) + '</b> 加入黑名单？', '违规收回确认');
      if (!ok) return;

      const user = TNR_DB.getCurrentUser();
      // 更新宠物状态
      TNR_DB.update(TNR_DB.KEYS.pets, opt.dataset.pet, { status: 'in_transit' });
      // 加入黑名单
      TNR_DB.create(TNR_DB.KEYS.blacklist, {
        name: opt.dataset.name,
        idCard: opt.dataset.idcard,
        phone: opt.dataset.phone,
        reason: reason,
        violationDate: TNR_UI.formatDate(new Date()),
        operator: user.id, operatorName: user.name
      });
      // 更新领养记录状态
      TNR_DB.update(TNR_DB.KEYS.adoptions, opt.value, { status: 'revoked' });
      TNR_UI.toast('已收回动物并加入黑名单', 'success');
      this.render_followup();
    });
  },

  /* ========== 10. 黑名单管理 ========== */
  render_blacklist() {
    const el = document.getElementById('page-blacklist');
    const filters = [
      { key: 'keyword', label: '搜索', type: 'search', placeholder: '姓名/身份证/电话' }
    ];
    const actions = '<button class="btn btn-primary btn-sm" id="btnAddBlack">+ 加入黑名单</button><button class="btn btn-secondary btn-sm" id="btnCheckBlack">查询拦截</button>';
    el.innerHTML = TNR_UI.renderFilterBar(filters, actions) + '<div id="blackTableWrap"></div>';

    const renderTable = () => {
      const vals = TNR_UI.getFilterValues();
      let list = TNR_DB.getAll(TNR_DB.KEYS.blacklist);
      if (vals.keyword) {
        const kw = vals.keyword;
        list = list.filter(b => (b.name + b.idCard + b.phone).toLowerCase().includes(kw));
      }
      const columns = [
        { title: '姓名', key: 'name' },
        { title: '身份证号', key: 'idCard', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.idCard) + '</span>' },
        { title: '电话', key: 'phone' },
        { title: '拉黑原因', key: 'reason' },
        { title: '违规日期', key: 'violationDate' },
        { title: '操作员', key: 'operatorName' },
        { title: '登记时间', key: 'createdAt' }
      ];
      const rowActions = (r) => '<button class="btn-link" data-act="edit" data-id="' + r.id + '">编辑</button><button class="btn-link danger" data-act="del" data-id="' + r.id + '">删除</button>';
      document.getElementById('blackTableWrap').innerHTML = '<div class="card"><div class="card-body" style="padding:0;"><div class="table-wrapper">' + TNR_UI.renderTable({ columns, data: list, emptyText: '暂无黑名单记录', rowActions }) + '</div></div></div>';
      document.getElementById('blackTableWrap').querySelectorAll('[data-act]').forEach(btn => {
        btn.addEventListener('click', () => {
          const rec = TNR_DB.getById(TNR_DB.KEYS.blacklist, btn.dataset.id);
          if (!rec) return;
          if (btn.dataset.act === 'edit') this.showBlacklistEdit(rec, renderTable);
          else if (btn.dataset.act === 'del') {
            TNR_UI.confirm('确定移除 <b>' + TNR_UI.escape(rec.name) + '</b> 的黑名单记录吗？').then(ok => {
              if (ok) { TNR_DB.delete(TNR_DB.KEYS.blacklist, rec.id); TNR_UI.toast('已移除', 'success'); renderTable(); }
            });
          }
        });
      });
    };
    renderTable();
    TNR_UI.bindFilter(renderTable);

    document.getElementById('btnAddBlack').addEventListener('click', () => this.showBlacklistForm(null, renderTable));
    document.getElementById('btnCheckBlack').addEventListener('click', () => this.showBlacklistCheck());
  },

  showBlacklistForm(rec, afterSave) {
    const isEdit = !!rec;
    const body = (el) => {
      el.innerHTML = `
        <div class="form-row">
          <div class="form-group"><label class="form-label">姓名<span class="req">*</span></label><input class="form-input" id="bl_name" value="${rec ? TNR_UI.escape(rec.name) : ''}"></div>
          <div class="form-group"><label class="form-label">电话<span class="req">*</span></label><input class="form-input" id="bl_phone" value="${rec ? TNR_UI.escape(rec.phone) : ''}"></div>
        </div>
        <div class="form-group"><label class="form-label">身份证号</label><input class="form-input" id="bl_idCard" value="${rec ? TNR_UI.escape(rec.idCard) : ''}"></div>
        <div class="form-group"><label class="form-label">拉黑原因<span class="req">*</span></label><select class="form-select" id="bl_reason">
          ${['弃养', '私自转赠', '打卡不合格', '虐待动物', '其他'].map(r => '<option value="' + r + '"' + (rec && rec.reason === r ? ' selected' : '') + '>' + r + '</option>').join('')}
        </select></div>
        <div class="form-group"><label class="form-label">违规日期</label><input type="date" class="form-input" id="bl_date" value="${rec ? rec.violationDate : TNR_UI.formatDate(new Date())}"></div>
      `;
    };
    const { close } = TNR_UI.modal({
      title: isEdit ? '编辑黑名单' : '加入黑名单',
      body,
      actions: '<button class="btn btn-secondary" data-action="close">取消</button><button class="btn btn-primary" id="btnSaveBlack">保存</button>'
    });
    document.getElementById('btnSaveBlack').addEventListener('click', () => {
      const name = document.getElementById('bl_name').value.trim();
      const phone = document.getElementById('bl_phone').value.trim();
      const idCard = document.getElementById('bl_idCard').value.trim();
      const reason = document.getElementById('bl_reason').value;
      if (!name || !phone) { TNR_UI.toast('请填写姓名和电话', 'warning'); return; }
      const user = TNR_DB.getCurrentUser();
      if (isEdit) {
        TNR_DB.update(TNR_DB.KEYS.blacklist, rec.id, { name, phone, idCard, reason, violationDate: document.getElementById('bl_date').value });
        TNR_UI.toast('修改成功', 'success');
      } else {
        TNR_DB.create(TNR_DB.KEYS.blacklist, { name, phone, idCard, reason, violationDate: document.getElementById('bl_date').value, operator: user.id, operatorName: user.name });
        TNR_UI.toast('已加入黑名单', 'success');
      }
      close();
      afterSave();
    });
  },

  showBlacklistEdit(rec, afterSave) {
    this.showBlacklistForm(rec, afterSave);
  },

  showBlacklistCheck() {
    const body = (el) => {
      el.innerHTML = `
        <p class="text-muted fs-sm mb-3">输入身份证号或电话，模拟系统自动拦截检查（领养登记时会自动触发）。</p>
        <div class="form-group"><label class="form-label">身份证号</label><input class="form-input" id="ck_idCard" placeholder="身份证号"></div>
        <div class="form-group"><label class="form-label">电话</label><input class="form-input" id="ck_phone" placeholder="手机号"></div>
        <div id="ckResult" style="margin-top:12px;"></div>
      `;
    };
    const { close } = TNR_UI.modal({
      title: '黑名单查询拦截',
      body,
      actions: '<button class="btn btn-secondary" data-action="close">关闭</button><button class="btn btn-primary" id="btnDoCheck">查询</button>'
    });
    document.getElementById('btnDoCheck').addEventListener('click', () => {
      const idCard = document.getElementById('ck_idCard').value.trim();
      const phone = document.getElementById('ck_phone').value.trim();
      const bl = TNR_DB.checkBlacklist(idCard, phone);
      const result = document.getElementById('ckResult');
      if (bl) {
        result.innerHTML = '<div class="badge badge-danger" style="padding:8px 12px;font-size:13px;">⚠ 拦截：该人员存在于黑名单</div>' +
          TNR_UI.renderDescList([
            { label: '姓名', value: bl.name },
            { label: '身份证', value: bl.idCard },
            { label: '电话', value: bl.phone },
            { label: '拉黑原因', value: bl.reason, full: true },
            { label: '违规日期', value: bl.violationDate }
          ]);
      } else {
        result.innerHTML = '<div class="badge badge-success" style="padding:8px 12px;font-size:13px;">✓ 通过：未在黑名单中</div>';
      }
    });
  },

  /* ========== 11. 安乐死备案 ========== */
  render_euthanasia() {
    const el = document.getElementById('page-euthanasia');
    el.innerHTML = `
      <div class="tabs" id="eutTabs">
        <div class="tab-item active" data-tab="body">尸体接收备案</div>
        <div class="tab-item" data-tab="records">处置记录查询</div>
      </div>
      <div id="eutContent"></div>

    el.querySelectorAll('.tab-item').forEach(t => {
      t.addEventListener('click', () => {

        t.classList.add('active');
        this.renderEutTab(t.dataset.tab);

  renderEutTab(tab) {
    const wrap = document.getElementById('eutContent');
    const records = TNR_DB.getAll(TNR_DB.KEYS.euthanasia);

    if (tab === 'body') {
      const pending = records.filter(r => !r.bodyReceived);
      const received = records.filter(r => r.bodyReceived);
      let html = '<div class="card mb-4"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>待接收尸体（' + pending.length + '）</div></div><div class="card-body" style="padding:0;"><div class="table-wrapper">';
      const columns = [
        { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '处置医院', key: 'hospitalName' },
        { title: '原因', key: 'reason' },
        { title: '病情', key: 'condition' },
        { title: '处置时间', key: 'euthanizedAt' },
        { title: '操作', render: r => '<button class="btn btn-primary btn-sm" data-receive="' + r.id + '">接收备案</button>' }
      ];
      html += TNR_UI.renderTable({ columns, data: pending, emptyText: '暂无待接收尸体' });
      html += '</div></div></div>';

      html += '<div class="card"><div class="card-header"><div class="card-title"><span class="card-title-bar"></span>已接收备案（' + received.length + '）</div></div><div class="card-body" style="padding:0;"><div class="table-wrapper">';
      const cols2 = [
        { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
        { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
        { title: '处置医院', key: 'hospitalName' },
        { title: '原因', key: 'reason' },
        { title: '处置时间', key: 'euthanizedAt' },
        { title: '接收时间', key: 'bodyReceivedAt' },
        { title: '接收人', key: 'bodyReceivedByName' }
      ];
      html += TNR_UI.renderTable({ columns: cols2, data: received, emptyText: '暂无已接收记录' });
      html += '</div></div></div>';
      wrap.innerHTML = html;

      wrap.querySelectorAll('[data-receive]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const rec = TNR_DB.getById(TNR_DB.KEYS.euthanasia, btn.dataset.receive);
          if (!rec) return;
          const ok = await TNR_UI.confirm('确认接收宠物 <b>' + rec.petCode + '</b> 的尸体并备案？', '接收确认');
          if (ok) {
            const user = TNR_DB.getCurrentUser();
            TNR_DB.update(TNR_DB.KEYS.euthanasia, rec.id, {
              bodyReceived: true,
              bodyReceivedAt: TNR_UI.formatDate(new Date()),
              bodyReceivedBy: user.id,
              bodyReceivedByName: user.name
            });
            TNR_UI.toast('尸体接收备案成功', 'success');
            this.renderEutTab('body');
          }
        });
      });

    } else if (tab === 'records') {
      const filters = [
        { key: 'keyword', label: '搜索', type: 'search', placeholder: '宠物编号/医院/单号' }
      ];
      wrap.innerHTML = TNR_UI.renderFilterBar(filters) + '<div id="eutTableWrap"></div>';
      const renderTable = () => {
        const vals = TNR_UI.getFilterValues();
        let list = records;
        if (vals.keyword) {
          const kw = vals.keyword;
          list = list.filter(r => (r.petCode + r.hospitalName + r.ledgerNo + r.id).toLowerCase().includes(kw));
        }
        const columns = [
          { title: '单号', key: 'ledgerNo', render: r => '<span class="font-mono fs-sm">' + TNR_UI.escape(r.ledgerNo || r.id) + '</span>' },
          { title: '宠物编号', key: 'petCode', render: r => '<span class="pet-code-chip">' + r.petCode + '</span>' },
          { title: '处置医院', key: 'hospitalName' },
          { title: '原因', key: 'reason' },
          { title: '病情', key: 'condition' },
          { title: '处置时间', key: 'euthanizedAt' },
          { title: '尸体状态', render: r => r.bodyReceived ? TNR_UI.statusBadge('已接收', 'success') : TNR_UI.statusBadge('待接收', 'warning') },
          { title: '操作', render: r => '<button class="btn-link" data-view="' + r.id + '">详情</button>' }
        ];
        document.getElementById('eutTableWrap').innerHTML = '<div class="card"><div class="card-body" style="padding:0;"><div class="table-wrapper">' + TNR_UI.renderTable({ columns, data: list, emptyText: '暂无处置记录' }) + '</div></div></div>';
        document.getElementById('eutTableWrap').querySelectorAll('[data-view]').forEach(btn => {
          btn.addEventListener('click', () => {
            const rec = records.find(r => r.id === btn.dataset.view);
            if (!rec) return;
            TNR_UI.drawer({ title: '安乐死备案详情', body: TNR_UI.renderDescList([
              { label: '单号', value: rec.ledgerNo || rec.id },
              { label: '宠物编号', value: '<span class="pet-code-chip">' + rec.petCode + '</span>' },
              { label: '处置医院', value: rec.hospitalName },
              { label: '处置时间', value: rec.euthanizedAt },
              { label: '原因', value: rec.reason, full: true },
              { label: '病情说明', value: rec.condition, full: true },
              { label: '尸体接收', value: rec.bodyReceived ? '已接收' : '待接收' },
              { label: '接收时间', value: rec.bodyReceivedAt || '—' },
              { label: '接收人', value: rec.bodyReceivedByName || '—' }
            ]) });
          });
        });
      };
      renderTable();
      TNR_UI.bindFilter(renderTable);
    }
  },
